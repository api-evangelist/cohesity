polymorphism:
  discriminator: environment
  note: >-
    The single largest structural fact about these contracts: nearly every
    protection, registration and recovery request is a union keyed on an
    `environment` value (kVMware, kAWS, kAzure, kO365, kSQL, kOracle, kCassandra,
    kMongoDB, kHdfs, kHive, kHbase, kCouchbase, kPhysical, kNetapp, kIsilon and
    more). The GUID-suffixed `Common*Params<uuid>` schemas are the generated
    envelopes for those unions. An agent must select the environment-specific
    parameter block, not fill a flat body.
