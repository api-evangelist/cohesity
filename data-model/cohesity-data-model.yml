note: >-
  Derived from $ref topology and id-reference fields in the published Swagger 2.0
  documents. Cohesity's contracts are enormous and heavily polymorphic - the v2
  document carries GUID-suffixed synthetic schema names such as
  `CommonProtectionGroupResponseParamsfd9f614e-2c28-46ff-a431-2430d1548801`,
  which is a code-generator artifact, not a domain name. Only the stable domain
  entities are modelled below; the per-workload parameter schemas (Cassandra,
  MongoDB, VMware, AWS, Azure, O365 and roughly forty more) are variants of the
  same three shapes and are summarised rather than enumerated.
id_conventions:
  - >-
    Object ids are opaque strings, frequently composite
    (`clusterId:clusterIncarnationId:objectId`) on Helios where the same logical
    object exists on several clusters.
  - >-
    All timestamps are MICROSECONDS since epoch and carry a `Usecs` suffix
    (startTimeUsecs, endTimeUsecs, runStartTimeUsecs).
  - >-
    Enumerated values are `k`-prefixed PascalCase strings (kCritical, kRegular,
    kBackupRestore) throughout both generations.
