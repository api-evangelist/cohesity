    View_2:
      description: 'Specifies settings for defining a storage location (called a View)

        with NFS and SMB mount paths in a Storage Domain (View Box) on the Cohesity

        Cluster.'
      type: object
      title: View.
      allOf:
      - type: object
        required:
        - protocolAccess
        - qos
        properties:
          viewId:
            description: Specifies an id of the View assigned by the Cohesity Cluster.
            type:
            - integer
            - 'null'
            format: int64
            x-order: 0
            readOnly: true
          isCategoryInferred:
            description: "If True, category in response is not set by user but inferred by\nIris because none is set. Category can only be none when view was\ncreated by v1 API or cloned from a view created by v1 API.\n\nInference Logic is as follows:\n1. Object Services if only S3 or Swift protocol is selected.\n2. Backup Target only if one read-write protocol is selected and\n   QoS is \"Backup Target Commvault\" or \"Backup Target SSD\".\n3. File Services if there are more than 1 read-write protocol or\n   it doesn't fit any other category."
            type:
            - boolean
            - 'null'
            x-order: 1
            readOnly: true
          dataLockExpiryUsecs:
            description: 'DataLock (Write Once Read Many) lock expiry epoch time in microseconds. If

              a view is marked as a DataLock view, only a Data Security Officer (a user

              having Data Security Privilege) can delete the view until the lock expiry

              time.'
            type:
            - integer
            - 'null'
            format: int64
            x-order: 2
          objectServicesMappingConfig:
            description: 'Specifies the Object Services key mapping config of the view. This parameter can only

              be set during create and cannot be changed.

              Configuration of Object Services key mapping.

              Specifies the type of Object Services key mapping config.'
            type:
            - string
            - 'null'
            enum:
            - Random
            - Short
            - Long
            - Hierarchical
            x-order: 3
            readOnly: true
          storageDomainId:
            description: 'Specifies the id of the Storage Domain (View Box) where the View is

              stored.'
            type:
            - integer
            - 'null'
            format: int64
            x-order: 4
            readOnly: true
          storageDomainName:
            description: 'Specifies the name of the Storage Domain (View Box) where the View is

              stored.'
            type:
