          x-go-name: LockRanges
      x-go-package: cohesity/iris/server/data/public
    QoSPolicy:
      description: Specifies the Quality of Service (QoS) Policy details.
      type: object
      title: QoSPolicy.
      properties:
        alwaysUseSsd:
          description: Specifies whether to always write to SSD even if SeqWriteSsdPct is 0.
          type:
          - boolean
          - 'null'
          x-go-name: AlwaysUseSsd
        id:
          description: Specifies Id of the QoS Policy.
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: Id
        minRequests:
          description: 'Specifies minimum number of requests,  corresponding to this Policy,

            executed in the QoS queue.'
          type:
          - integer
          - 'null'
          format: int32
          x-go-name: MinRequests
        name:
          description: Specifies Name of the Qos Policy.
          type:
          - string
          - 'null'
          x-go-name: Name
        priority:
          description: 'Specifies Priority of the Qos Policy.

            Priority of QoS Policy as defined in cluster config proto.'
          type:
          - string
          - 'null'
          enum:
          - kLow
          - kHigh
          x-go-name: Priority
        randomWriteHydraPct:
          description: 'Specifies percentage of a random write request belonging to this Policy

            that hits hydra.'
          type:
          - integer
          - 'null'
          format: int32
          x-go-name: RandomWriteHydraPct
        randomWriteSsdPct:
          description: 'Specifies percentage of a random write request belonging to this Policy

            that hits SSD.'
          type:
          - integer
          - 'null'
          format: int32
          x-go-name: RandomWriteSsdPct
        seqWriteHydraPct:
          description: 'Specifies percentage of a sequential write request belonging to this

            Policy that hits hydra.'
          type:
          - integer
          - 'null'
          format: int32
          x-go-name: SeqWriteHydraPct
        seqWriteSsdPct:
          description: 'Specifies percentage of a sequential write request belonging to this

            Policy that hits SSD.'
          type:
          - integer
          - 'null'
          format: int32
          x-go-name: SeqWriteSsdPct
        weight:
          description: Specifies Weight of the QoS Policy used in QoS queue.
          type:
          - integer
          - 'null'
          format: int32
          x-go-name: Weight
        workLoadType:
          description: Specifies Workload type attribute associated with this Policy.
          type:
          - string
          - 'null'
          x-go-name: WorkloadType
      x-go-package: cohesity/iris/server/data/public
