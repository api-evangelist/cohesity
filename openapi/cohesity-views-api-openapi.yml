openapi: 3.2.0
info:
  title: Cohesity Views API
  version: '1.0'
  description: 'Operations tagged Views across 2 of this provider''s published API definitions: cohesity-cluster-v1-openapi-original.yml, cohesity-cluster-v2-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://<CLUSTER_VIP>/irisservices/api/v1
- url: /v2
tags:
- name: Views
paths:
  /public/nlmLocks:
    get:
      description: 'If no parameters are specified, all NLM locks currently on the Cohesity Cluster

        are returned. Specifying parameters filters the results that are returned.'
      tags:
      - Views
      summary: List the NLM locks that match the filter criteria specified using parameters
      operationId: ListNlmLocks
      parameters:
      - x-go-name: FilePath
        description: 'Specifies the filepath in the view relative to the root filesystem.

          If this field is specified, viewName field must also be specified.'
        name: filePath
        in: query
        schema:
          type: string
      - x-go-name: ViewName
        description: 'Specifies the name of the View in which to search. If a view name is not

          specified, all the views in the Cluster is searched.

          This field is mandatory if filePath field is specified.'
        name: viewName
        in: query
        schema:
          type: string
      - x-go-name: PageCount
        description: 'Specifies the maximum number of NLM locks to return in the response.

          This field cannot be set above 1000. If this is not set, maximum of 1000

          entries are returned.'
        name: pageCount
        in: query
        schema:
          type: integer
          format: int32
      - x-go-name: Cookie
        description: 'Specifies the opaque string returned in the previous response.

          If this is set, next set of active opens just after the previous

          response are returned. If this is not set, first set of NLM locks

          are returned.'
        name: cookie
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/GetListNlmLocksResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      description: Returns nothing upon success.
      tags:
      - Views
      summary: Clear NLM locks that match the filter criteria specified using parameters
      operationId: ClearNlmLocks
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClearNlmLocksParameters'
        description: Request to clear NLM locks.
        required: true
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/qosPolicies:
    get:
      description: Returns error if op fails.
      tags:
      - Views
      summary: Fetches QoS Policies of a view
      operationId: GetQoSPolicies
      parameters:
      - x-go-name: Ids
        description: Specifies the Ids of QoS Policies to filter by.
        name: ids
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: Names
        description: Specifies the names of QoS Policies to filter by.
        name: names
        in: query
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/GetQoSPoliciesResponse'
        default:
          $ref: '#/components/responses/Error'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/shares:
    get:
      description: 'If no parameters are specified, all shares on the Cohesity Cluster are

        returned. Specifying share name/prefix filters the results that are returned.

        NOTE: If maxCount is set and the number of Views returned exceeds the maxCount,

        there are more Views to return.

        To get the next set of Views, send another request and specify the pagination

        cookie from the previous response.'
      tags:
      - Views
      summary: List shares filtered by name
      operationId: GetViewsByShareName
      parameters:
      - x-go-name: TenantIds
        description: 'TenantIds contains ids of the tenants for which objects are to be

          returned.'
        name: tenantIds
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: AllUnderHierarchy
        description: 'AllUnderHierarchy specifies if objects of all the tenants under the

          hierarchy of the logged in user''s organization should be returned.'
        name: allUnderHierarchy
        in: query
        schema:
          type: boolean
      - x-go-name: ShareName
        description: 'The share name(substring) that needs to be searched against existing views

          and aliases.'
        name: shareName
        in: query
        schema:
          type: string
      - x-go-name: MaxCount
        description: Specifies a limit on the number of Views returned.
        name: maxCount
        in: query
        schema:
          type: integer
          format: int32
      - x-go-name: PaginationCookie
        description: 'Expected to be empty in the first call to GetViewsByShareName.

          To get the next set of results, set this value to the pagination cookie

          value returned  in the response of the previous call.'
        name: paginationCookie
        in: query
        schema:
          type: string
      - x-go-name: MatchPartialNames
        description: 'If true, the names in viewNames are matched by prefix rather than

          exactly matched.'
        name: matchPartialNames
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/GetViewsByShareNameResponse'
        default:
          $ref: '#/components/responses/Error'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/smbConnections:
    get:
      description: Returns error if op fails.
      tags:
      - Views
      summary: Fetches Smb Connection Status of a view
      operationId: GetSmbConnections
      parameters:
      - x-go-name: ViewNames
        description: 'Parameters to get Smb Connections.

          List of names of views whose connections are to be fetched.'
        name: viewNames
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: ViewIds
        description: List of ids of views whose connections are to be fetched.
        name: viewIds
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: MaxCount
        description: Maximum number of results to return.
        name: maxCount
        in: query
        schema:
          type: integer
          format: int32
      - x-go-name: IncludeSid
        description: Specifies whether to include list of sids in the result.
        name: includeSid
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/GetSmbConnectionsResponse'
        default:
          $ref: '#/components/responses/Error'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/viewAliases:
    put:
      description: Returns the updated View Alias.
      tags:
      - Views
      summary: Update a View Alias.
      operationId: UpdateViewAlias
      responses:
        '201':
          $ref: '#/components/responses/UpdateViewAliasResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateViewAliasParam'
        description: Request to update a View.
        required: true
    post:
      description: Returns the created View Alias.
      tags:
      - Views
      summary: Create a View Alias.
      operationId: CreateViewAlias
      responses:
        '201':
          $ref: '#/components/responses/CreateViewAliasResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewAlias'
        description: Request to create a View Alias.
        required: true
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/viewAliases/{name}:
    delete:
      description: Returns delete status upon completion.
      tags:
      - Views
      summary: Delete a View Alias
      operationId: DeleteViewAlias
      parameters:
      - x-go-name: Name
        description: Specifies the View Alias name.
        name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/Error'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/viewAliases/{name}/activate:
    post:
      description: Returns error if op fails.
      tags:
      - Views
      summary: Activates the view aliases of a view from it's source view
      operationId: ActivateViewAliases
      parameters:
      - x-go-name: Name
        description: Specifies the View name.
        name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ActivateViewAliasesResponse'
        default:
          $ref: '#/components/responses/Error'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/viewDirectoryQuotas:
    get:
      tags:
      - Views
      summary: Gets directory quota info for a view. Returns error if op fails
      operationId: GetViewDirQuotaInfo
      parameters:
      - x-go-name: ViewName
        description: The name of the view.
        name: viewName
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/GetDirQuotaInfoResponse'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - Views
      summary: Updates a directory quota policy for a view. Returns error if op fails
      operationId: UpdateViewDirQuota
      responses:
        '200':
          $ref: '#/components/responses/UpdateViewDirQuotaResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDirQuotaArgs'
        description: Request to update view directory quota policy.
        required: true
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/viewUserQuotas:
    get:
      description: Returns error if op fails.
      tags:
      - Views
      summary: Get the quota policies, usage and summary for a view for all its users.
      operationId: GetViewUserQuotas
      parameters:
      - x-go-name: ViewName
        description: 'Specifies the name of the input view. If given, there could be three

          scenarios with the viewName input parameter:

          It gives the user quota overrides for this view, and the user quota

          settings. Returns ''usersQuotaAndUsage''.

          If given along with the user id, it returns the quota policy for this

          user on this view. Returns ''usersQuotaAndUsage''.

          If given along with SummaryOnly as true, a user quota summary for

          this view would be returned. Returns ''summaryForView''.

          If not given, then the user id is checked.'
        name: viewName
        in: query
        schema:
          type: string
      - x-go-name: IncludeUsage
        description: 'If set to true, the logical usage info is included only for users with

          quota overrides. By default, it is set to false.'
        name: includeUsage
        in: query
        schema:
          type: boolean
      - x-go-name: IncludeUserWithQuotaOnly
        description: 'If set to true, the result will only contain user with user quota enabled.

          By default, this field is set to false, and it''s only in effect when

          ''SummaryOnly'' is set to false and ''ViewName'' is specified.'
        name: includeUserWithQuotaOnly
        in: query
        schema:
          type: boolean
      - x-go-name: ExcludeUsersWithinAlertThreshold
        description: 'This field can be set only when includeUsage is set to true.

          By default, all the users with logical usage > 0 will be returned in the

          result. If this field is set to true, only the list of users who has

          exceeded the alert threshold will be returned.'
        name: excludeUsersWithinAlertThreshold
        in: query
        schema:
          type: boolean
      - x-go-name: UnixUid
        description: 'If interested in a user via unix-identifier, include UnixUid.

          Otherwise, If a valid unix-id to SID mappings are available (i.e., when

          mixed mode is enabled) the server will perform the necessary id mapping

          and return the correct usage irrespective of whether the unix id / SID is

          provided.'
        name: unixUid
        in: query
        schema:
          type: integer
          format: uint32
      - x-go-name: Sid
        description: 'If interested in a user via smb_client, include SID.

          Otherwise, If a valid unix-id to SID mappings are available (i.e., when

          mixed mode is enabled) the server will perform the necessary id mapping

          and return the correct usage irrespective of whether the unix id / SID is

          provided.

          The string is of following format -

          S-1-IdentifierAuthority-SubAuthority1-SubAuthority2-...-SubAuthorityn.'
        name: sid
        in: query
        schema:
          type: string
      - x-go-name: UserUnixIdsForView
        description: 'While making a query for a view, this specifies a list of specific users

          with their unix uid for the result.'
        name: userUnixIdsForView
        in: query
        schema:
          type: array
          items:
            type: integer
            format: uint32
      - x-go-name: UserSidsForView
        description: 'While making a query for a view, this specifies a list of specific users

          with their Sid for the result.'
        name: userSidsForView
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: ViewNamesForUser
        description: 'While making a query for a user, this specifies a list of specific views

          for the result.'
        name: viewNamesForUser
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: SummaryOnly
        description: 'Specifies a flag to just return a summary. If set to true, and if ViewName

          is not nil, it returns the summary of users for a view. Otherwise if

          UserId not nil, and ViewName is nil then it fetches the summary for a

          user in his views.  By default, it is set to false.'
        name: summaryOnly
        in: query
        schema:
          type: boolean
      - x-go-name: PageCount
        description: Specifies the max entries that should be returned in the result.
        name: pageCount
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: MaxViewId
        description: 'Related to fetching a particular user''s quota and usage in all his views.

          It only pertains to the scenario where either UnixUid or Sid is specified,

          and ViewName is nil. Specify the maxViewId for All the views returned

          would have view_id''s less than or equal to the given MaxViewId if it is

          >= 0.'
        name: maxViewId
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: Cookie
        description: 'Cookie should be used from previous call to list user quota overrides. It

          resumes (or gives the next set of values) from the result of the previous

          call.'
        name: cookie
        in: query
        schema:
          type: string
      - x-go-name: OutputFormat
        description: 'OutputFormat is the Output format for the output. If it is not specified,

          default is json.'
        name: outputFormat
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/GetViewUserQuotasResponse'
        default:
          $ref: '#/components/responses/Error'
    put:
      description: Returns error if op fails.
      tags:
      - Views
      summary: Update a new quota policy for a user in a view
      operationId: UpdateViewUserQuota
      responses:
        '201':
          $ref: '#/components/responses/UpdateViewUserQuotaResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewUserQuotaParameters'
        description: update user quota params.
    post:
      description: Returns error if op fails.
      tags:
      - Views
      summary: Create a new quota policy for a user in a view
      operationId: CreateViewUserQuota
      responses:
        '200':
          $ref: '#/components/responses/CreateViewUserQuotaResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewUserQuotaParameters'
        description: update user quota params.
    delete:
      description: Returns error if op fails.
      tags:
      - Views
      summary: Delete the quota policy overrides for users in a view
      operationId: DeleteViewUsersQuota
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteViewUsersQuotaParameters'
        description: update user quota params.
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/viewUserQuotasSettings:
    put:
      description: Returns error if op fails.
      tags:
      - Views
      summary: Update the user quota settings in a view
      operationId: UpdateUserQuotaSettings
      responses:
        '200':
          $ref: '#/components/responses/UserQuotaSettingsResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserQuotaSettingsForView'
        description: update user quota metadata params.
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/views:
    get:
      description: 'If no parameters are specified, all Views on the Cohesity Cluster are returned.

        Specifying parameters filters the results that are returned.

        NOTE: If maxCount is set and the number of Views returned exceeds the maxCount,

        there are more Views to return.

        To get the next set of Views, send another request and specify the id of the

        last View returned in viewList from the previous response.'
      tags:
      - Views
      summary: List Views filtered by some parameters
      operationId: GetViews
      parameters:
      - x-go-name: TenantIds
        description: 'TenantIds contains ids of the tenants for which objects are to be

          returned.'
        name: tenantIds
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: AllUnderHierarchy
        description: 'AllUnderHierarchy specifies if objects of all the tenants under the

          hierarchy of the logged in user''s organization should be returned.'
        name: allUnderHierarchy
        in: query
        schema:
          type: boolean
      - x-go-name: ViewNameList
        description: Filter by a list of View names.
        name: viewNames
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: ViewIdList
        description: Filter by a list of View ids.
        name: viewIds
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: ViewBoxIdList
        description: Filter by a list of Storage Domains (View Boxes) specified by id.
        name: viewBoxIds
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: ViewBoxNameList
        description: Filter by a list of View Box names.
        name: viewBoxNames
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: MatchPartialNames
        description: 'If true, the names in viewNames are matched by prefix rather than

          exactly matched.'
        name: matchPartialNames
        in: query
        schema:
          type: boolean
      - x-go-name: MaxCount
        description: Specifies a limit on the number of Views returned.
        name: maxCount
        in: query
        schema:
          type: integer
          format: int32
      - x-go-name: IncludeProtectionJobs
        description: 'Specifies if Protection Jobs information needs to be returned along with

          view metadata. By default, if not set or set to true, Job information is

          returned.'
        name: includeProtectionJobs
        in: query
        schema:
          type: boolean
      - x-go-name: MaxViewId
        description: 'If the number of Views to return exceeds the maxCount specified in the

          original request, specify the id of the last View

          from the viewList in the previous response

          to get the next set of Views.'
        name: maxViewId
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: IncludeInactive
        description: 'Specifies if inactive Views on this Remote Cluster (which have

          Snapshots copied by replication) should also be returned.

          Inactive Views are not counted towards the maxCount.

          By default, this field is set to false.'
        name: includeInactive
        in: query
        schema:
          type: boolean
      - x-go-name: JobIds
        description: 'Filter by Protection Job ids. Return Views that are being protected by

          listed Jobs, which are specified by ids.'
        name: jobIds
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - description: If set to true, the list is sorted descending by logical usage.
        name: SortByLogicalUsage
        in: query
        schema:
          type: boolean
      - x-go-name: MatchAliasNames
        description: If true, view aliases are also matched with the names in viewNames.
        name: matchAliasNames
        in: query
        schema:
          type: boolean
      - x-go-name: IncludeViewsWithAntivirusEnabledOnly
        description: 'If set to true, the list will contain only the views for which antivirus

          scan is enabled.'
        name: includeViewsWithAntivirusEnabledOnly
        in: query
        schema:
          type: boolean
      - x-go-name: IncludeStats
        description: 'If set to true, stats of views will be returned. By default this parameter

          is set to false.'
        name: includeStats
        in: query
        schema:
          type: boolean
      - x-go-name: IncludeViewsWithDataLockEnabledOnly
        description: 'If set to true, the list will contain only the views for which either

          file level data lock is enabled or view level data lock is enabled.'
        name: includeViewsWithDataLockEnabledOnly
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/GetViewsResponse'
        default:
          $ref: '#/components/responses/Error'
    put:
      description: Returns the updated View.
      tags:
      - Views
      summary: Update a View
      operationId: UpdateView
      responses:
        '200':
          $ref: '#/components/responses/UpdateViewResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateViewParam'
        description: Request to update a view.
        required: true
    post:
      description: Returns the created View.
      tags:
      - Views
      summary: Create a View
      operationId: CreateView
      responses:
        '201':
          $ref: '#/components/responses/CreateViewResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateViewRequest'
        description: Request to create a View.
        required: true
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/views/clone:
    post:
      description: Returns the cloned View.
      tags:
      - Views
      summary: Clone a View
      operationId: CloneView
      responses:
        '201':
          $ref: '#/components/responses/CloneViewResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneViewRequest'
        description: Request to clone a View.
        required: true
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/views/cloneDirectory:
    post:
      description: Returns error if op fails.
      tags:
      - Views
      summary: Clone a directory of a view
      operationId: CloneDirectory
      responses:
        '201':
          $ref: '#/components/responses/CloneDirectoryResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneDirectoryParams'
        description: Request to clone a directory.
        required: true
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/views/id/{id}:
    get:
      description: Returns the View corresponding to the specified View id.
      tags:
      - Views
      summary: List details about a single View
      operationId: GetViewById
      parameters:
      - x-go-name: Id
        description: Specifies the View id.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/GetViewByIdResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      description: Returns delete status upon completion.
      tags:
      - Views
      summary: Delete a View
      operationId: DeleteViewById
      parameters:
      - x-go-name: Id
        description: Specifies the View id.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/Error'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/views/id/{id}/fileLocks:
    get:
      description: Returns error if op fails.
      tags:
      - Views
