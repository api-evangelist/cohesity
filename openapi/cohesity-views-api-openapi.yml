  /file-services/views:
    get:
      description: 'If no parameters are specified, all Views on the Cohesity Cluster are returned.

        Specifying parameters filters the results that are returned.

        NOTE: If maxCount is set and the number of Views returned exceeds the maxCount,

        there are more Views to return.

        To get the next set of Views, send another request and specify the id of the

        last View returned in viewList from the previous response.'
      tags:
      - Views
      summary: List Views
      operationId: GetViews
      parameters:
      - description: Filter by a list of View names.
        name: viewNames
        in: query
        schema:
          type: array
          items:
            type: string
      - description: Filter by a list of View ids.
        name: viewIds
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - description: Filter by a list of Storage Domains (View Boxes) specified by id.
        name: storageDomainIds
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - description: Filter by a list of View Box names.
        name: storageDomainNames
        in: query
        schema:
          type: array
          items:
            type: string
      - description: 'Filter by a list of protocol accesses. Only views with

          protocol accesses in these specified accesses list will be returned.'
        name: protocolAccesses
        in: query
        schema:
          type: array
          items:
            enum:
            - NFS
            - NFS4
            - SMB
            - S3
            - Swift
            type: string
      - description: 'If true, the names in viewNames are matched by any partial rather than

          exactly matched.'
        name: matchPartialNames
        in: query
        schema:
          type: boolean
      - description: Specifies a limit on the number of Views returned.
        name: maxCount
        in: query
        schema:
          type: integer
          format: int32
      - description: 'Specifies if internal Views created by the Cohesity Cluster are

          also returned. In addition, regular Views are returned.'
        name: includeInternalViews
        in: query
        schema:
          type: boolean
      - description: 'Specifies if Protection Groups information needs to be returned along with

          view metadata. By default, if not set or set to true, Group information is

          returned.'
        name: includeProtectionGroups
        in: query
        schema:
          type: boolean
      - description: 'If the number of Views to return exceeds the maxCount specified in the

          original request, specify the id of the last View

          from the viewList in the previous response

          to get the next set of Views.'
        name: maxViewId
        in: query
        schema:
          type: integer
          format: int64
      - description: 'Specifies if inactive Views on this Remote Cluster (which have

          Snapshots copied by replication) should also be returned.

          Inactive Views are not counted towards the maxCount.

          By default, this field is set to false.'
        name: includeInactive
        in: query
        schema:
          type: boolean
      - description: 'Filter by Protection Group ids. Return Views that are being protected by

          listed Groups, which are specified by ids.'
        name: protectionGroupIds
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - description: 'Whether to get just the total number of views with the given input

          filters. If the flag is true, we ignore the parameter ''maxViews'' for the

          count. Also, if flag is true, list of views will not be returned.'
        name: viewCountOnly
        in: query
        schema:
          type: boolean
      - description: If set to true, the list is sorted descending by logical usage.
        name: sortByLogicalUsage
        in: query
        schema:
          type: boolean
      - description: 'Sids of restricted principals who can access the view. This is an

          internal field and therefore does not have json tag.'
        name: internalAccessSids
        in: query
        schema:
          type: array
          items:
            type: string
      - description: If true, view aliases are also matched with the names in viewNames.
        name: matchAliasNames
        in: query
        schema:
          type: boolean
      - description: 'TenantIds contains ids of the tenants for which objects are to be

          returned.'
        name: tenantIds
        in: query
        schema:
          type: array
          items:
            type: string
      - description: 'IncludeTenants specifies if objects of all the tenants under the

          hierarchy of the logged in user''s organization should be returned.'
        name: includeTenants
        in: query
        schema:
          type: boolean
      - description: 'If set to true, stats of views will be returned. By default this parameter

          is set to false.'
        name: includeStats
        in: query
        schema:
          type: boolean
      - description: 'If set to true, the list will contain only the views for which antivirus

          scan is enabled.'
        name: includeViewsWithAntivirusEnabledOnly
        in: query
        schema:
          type: boolean
      - description: 'If set to true, the list will contain only the views for which either

          file level data lock is enabled or view level data lock is enabled.'
        name: includeViewsWithDataLockEnabledOnly
        in: query
        schema:
          type: boolean
      - description: 'If set to true, only views with filer audit log enabled will be returned.

          If set to false, only views with filer audit log disabled will be returned.'
        name: filerAuditLogEnabled
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/GetViewsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    post:
      description: Creates a View.
      tags:
      - Views
      summary: Create a View
      operationId: CreateView
      responses:
        '201':
          $ref: '#/components/responses/CreateViewResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateViewRequest_2'
        description: Request to create a View.
        required: true
    servers:
    - url: /v2
