components:
  schemas:
    NlmLock:
      description: 'Response <clientID-Locks> map as received from view-keeper is converted into

        this structure. These Locks belong to one file-path.'
      type: object
      title: Specifies a NLM lock.
      properties:
        clientId:
          description: Specifies the client ID
          type:
          - string
          - 'null'
          x-go-name: ClientId
