openapi: 3.2.0
info:
  title: Cohesity Active Directory API
  version: '1.0'
  description: 'Operations tagged ActiveDirectory across 2 of this provider''s published API definitions: cohesity-cluster-v1-openapi-original.yml, cohesity-cluster-v2-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://<CLUSTER_VIP>/irisservices/api/v1
- url: /v2
tags:
- name: Active Directory
paths:
  /public/activeDirectory:
    get:
      description: 'After a Cohesity Cluster has been joined to an Active Directory domain,

        the users and groups in the domain can be authenticated on the Cohesity Cluster

        using their Active Directory credentials.


        NOTE: The userName and password fields are not populated by this operation.'
      tags:
      - Active Directory
      summary: Lists the Active Directories that the Cohesity Cluster has joined
      operationId: GetActiveDirectoryEntry
      parameters:
      - x-go-name: Domains
        description: Specifies the domains to fetch active directory entries.
        name: domains
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: TenantIds
        description: 'TenantIds contains ids of the tenants for which objects are to be

          returned.'
        name: tenantIds
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: AllUnderHierarchy
        description: 'AllUnderHierarchy specifies if objects of all the tenants under the

          hierarchy of the logged in user''s organization should be returned.'
        name: allUnderHierarchy
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/GetActiveDirectoryResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      description: 'After a Cohesity Cluster has been joined to an Active Directory domain,

        the users and groups in the domain can be authenticated on the Cohesity Cluster

        using their Active Directory credentials.'
      tags:
      - Active Directory
      summary: Join the Cohesity Cluster to the specified Active Directory
      operationId: CreateActiveDirectoryEntry
      responses:
        '201':
          $ref: '#/components/responses/CreateActiveDirectoryResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActiveDirectoryEntryParams'
        description: Request to join an Active Directory.
        required: true
    delete:
      description: 'Deletes the join of the Cohesity Cluster to the specified

        Active Directory domain. After the deletion, the Cohesity Cluster

        no longer has access to the principals on the Active Directory.

        For example, you can no longer log in to the Cohesity Cluster

        with a user defined in a principal group of the Active Directory domain.'
      tags:
      - Active Directory
      summary: Deletes the join with the Active Directory
      operationId: DeleteActiveDirectoryEntry
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveDirectoryEntry'
        description: Request to delete a join with an Active Directory.
        required: true
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/activeDirectory/centrifyZones:
    get:
      tags:
      - Active Directory
      summary: Fetches the list centrify zones of an active directory domain
      operationId: ListCentrifyZones
      parameters:
      - x-go-name: DomainName
        description: Specifies the fully qualified domain name (FQDN) of an Active Directory.
        name: domainName
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ListCentrifyZonesResponse'
        default:
          $ref: '#/components/responses/Error'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/activeDirectory/domainControllers:
    get:
      tags:
      - Active Directory
      summary: List the domain controllers for a domain
      operationId: GetActiveDirectoryDomainControllers
      parameters:
      - x-go-name: DomainName
        description: Specifies the domain name
        name: domainName
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ListDomainControllersResponse'
        default:
          $ref: '#/components/responses/Error'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/activeDirectory/principals:
    get:
      description: 'Optionally limit the search results by specifying security identifiers (SIDs),

        an object class (user or group) or a substring.

        You can specify SIDs or a substring but not both.'
      tags:
      - Active Directory
      summary: List the user and group principals in the Active Directory that match the…
      operationId: SearchActiveDirectoryPrincipals
      parameters:
      - x-go-name: Domain
        description: 'Specifies the domain name of the principals to search. If specified

          the principals in that domain are searched. Domain could be an

          Active Directory domain joined by the Cluster or any one of the

          trusted domains of the Active Directory domain or the LOCAL domain.

          If not specified, all the domains are searched.'
        name: domain
        in: query
        schema:
          type: string
      - x-go-name: ObjectClass
        description: 'Optionally filter by a principal object class such as ''kGroup'' or ''kUser''.

          If ''kGroup'' is specified, only group principals are returned.

          If ''kUser'' is specified, only user principals are returned.

          If not specified, both group and user principals are returned.

          ''kUser'' specifies a user object class.

          ''kGroup'' specifies a group object class.

          ''kComputer'' specifies a computer object class.

          ''kWellKnownPrincipal'' specifies a well known principal.'
        name: objectClass
        in: query
        schema:
          type: string
          enum:
          - kUser
          - kGroup
          - kComputer
          - kWellKnownPrincipal
      - x-go-name: Search
        description: 'Optionally filter by matching a substring. Only principals in

          the with a name or sAMAccountName that matches

          part or all of the specified substring are returned.

          If specified, a ''sids'' parameter should not be specified.'
        name: search
        in: query
        schema:
          type: string
      - x-go-name: Sids
        description: 'Optionally filter by a list of security identifiers (SIDs) found

          in the specified domain. Only principals matching

          the specified SIDs are returned.

          If specified, a ''search'' parameter should not be specified.'
        name: sids
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: IncludeComputers
        description: Specifies if Computer/GMSA accounts need to be included in this search.
        name: includeComputers
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/SearchActiveDirectoryPrincipalsResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      description: 'After a group or user has been added to a Cohesity Cluster,

        the referenced Active Directory principal can be used by the Cohesity Cluster.

        In addition, this operation maps Cohesity roles with a group or user and

        this mapping defines the privileges allowed on the Cohesity Cluster for the

        group or user.

        For example if an ''management'' group is created on the Cohesity Cluster

        for the Active Directory ''management'' principal group and is

        associated with the Cohesity ''View'' role, all users in the

        referenced Active Directory ''management'' principal group can log in to the

        Cohesity Dashboard but will only have view-only privileges.

        These users cannot create new Protection Jobs, Policies, Views, etc.


        NOTE: Local Cohesity users and groups cannot be created by this operation.

        Local Cohesity users or groups do not have an associated Active Directory

        principals and are created directly in the default LOCAL domain.'
      tags:
      - Active Directory
      summary: Add multiple groups or users on the Cohesity Cluster for the specified Active…
      operationId: AddActiveDirectoryPrincipals
      responses:
        '201':
          $ref: '#/components/responses/AddActiveDirectoryPrincipalsResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ActiveDirectoryPrincipalsAddParameters'
        description: Request to add groups or users to the Cohesity Cluster.
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/activeDirectory/{name}/enableTrustedDomainState:
    post:
      tags:
      - Active Directory
      summary: Updates the states of trusted domains discovery
      operationId: EnableTrustedDomainDiscovery
      parameters:
      - x-go-name: Name
        description: Specifies the Active Directory Domain Name.
        name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/UpdateActiveDirectoryResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrustedDomainEnableParams'
        description: Request to update enable trusted domains state of an Active Directory.
        required: true
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/activeDirectory/{name}/idMappingInfo:
    put:
      tags:
      - Active Directory
      summary: Updates the user id mapping info of an Active Directory
      operationId: UpdateActiveDirectoryIdMapping
      parameters:
      - x-go-name: Name
        description: Specifies the Active Directory Domain Name.
        name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/UpdateActiveDirectoryResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdMappingInfo'
        description: Request to update user id mapping of an Active Directory.
        required: true
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/activeDirectory/{name}/ignoredTrustedDomains:
    put:
      tags:
      - Active Directory
      summary: Updates the list of trusted domains to be ignored during trusted domain…
      operationId: UpdateActiveDirectoryIgnoredTrustedDomains
      parameters:
      - x-go-name: Name
        description: Specifies the Active Directory Domain Name.
        name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/UpdateActiveDirectoryResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIgnoredTrustedDomainsParams'
        description: Request to update the list of ignored trusted domains of an AD.
        required: true
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/activeDirectory/{name}/ldapProvider:
    put:
      tags:
      - Active Directory
      summary: Updates the LDAP provide Id for an Active Directory domain
      operationId: UpdateActiveDirectoryLdapProvider
      parameters:
      - x-go-name: Name
        description: Specifies the Active Directory Domain Name.
        name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/UpdateActiveDirectoryResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLdapProviderParams'
        description: Request to update the LDAP provider info.
        required: true
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/activeDirectory/{name}/machineAccounts:
    post:
      tags:
      - Active Directory
      summary: Updates the machine accounts of an Active Directory
      operationId: UpdateActiveDirectoryMachineAccounts
      parameters:
      - x-go-name: Name
        description: Specifies the Active Directory Domain Name.
        name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/UpdateActiveDirectoryMachineAccountsResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMachineAccountsParams'
        description: Request to update machine accounts of an Active Directory.
        required: true
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/activeDirectory/{name}/preferredDomainControllers:
    put:
      description: Updates the preferred domain controllers of an Active Directory
      tags:
      - Active Directory
      operationId: UpdatePreferredDomainControllers
      parameters:
      - x-go-name: Name
        description: Specifies the Active Directory Domain Name.
        name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/UpdateActiveDirectoryResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PreferredDomainController'
        description: Request to update preferred domain controllers of an Active Directory.
        required: true
      summary: Update preferred domain controllers
      x-summary-source: derived
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /active-directories:
    get:
      description: Get the list of Active Directories.
      tags:
      - Active Directory
      summary: Get the list of Active Directories
      operationId: GetActiveDirectory
      parameters:
      - description: Filter by a list of Active Directory domain names.
        name: domainNames
        in: query
        schema:
          type: array
          items:
            pattern: ^([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])(\.([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9\-]{0,61}[a-zA-Z0-9]))*$
            type: string
      - description: Filter by a list of Active Directory Ids.
        name: ids
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - description: TenantIds contains ids of the tenants for which objects are to be returned.
        name: tenantIds
        in: query
        schema:
          type: array
          items:
            type: string
      - description: If true, the response will include Protection Groups which were created by all tenants which the current user has permission to see. If false, then only Protection Groups created by the current user will be returned.
        name: includeTenants
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/GetActiveDirectoriesResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    post:
      description: Create an Active Directory.
      tags:
      - Active Directory
      summary: Create an Active Directory
      operationId: CreateActiveDirectory
      responses:
        '201':
          $ref: '#/components/responses/CreateOrUpdateActiveDirectoryResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActiveDirectoryRequest'
        description: Specifies the parameters to create an Active Directory.
        required: true
    servers:
    - url: /v2
  /active-directories/{id}:
    get:
      description: Get an Active Directory by id.
      tags:
      - Active Directory
      summary: Get an Active Directory by id
      operationId: GetActiveDirectoryById
      parameters:
      - description: Specifies id of an Active Directory.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - description: Specifies whether to include Centrify Zones of the Active Directory in response.
        name: includeCentrifyZones
        in: query
        schema:
          type: boolean
      - description: Specifies whether to include Domain Controllers of the Active Directory in response.
        name: includeDomainControllers
        in: query
        schema:
          type: boolean
      - description: Specifies whether to include Security Principals of the Active Directory in response.
        name: includeSecurityPrincipals
        in: query
        schema:
          type: boolean
      - description: Specifies a prefix, only security principals with name or sAMAccountName having this prefix (ignoring cases) will be returned. This field is appliciable and mandatory if 'includeSecurityPrincipals' is set to true.
        name: prefix
        in: query
        schema:
          type: string
      - description: Specifies a list of object classes, only security principals with object class in this list will be returned. This field is appliciable if 'includeSecurityPrincipals' is set to true.
        name: objectClass
        in: query
        schema:
          type: array
          items:
            enum:
            - User
            - Group
            - Computer
            - WellKnownPrincipal
            type: string
          uniqueItems: true
      responses:
        '200':
          $ref: '#/components/responses/GetActiveDirectoryByIdResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    put:
      description: Update an Active Directory.
      tags:
      - Active Directory
      summary: Update an Active Directory
      operationId: UpdateActiveDirectory
      parameters:
      - description: Specifies id of an Active Directory.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/UpdateActiveDirectoryResponse_2'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActiveDirectoryRequest'
        description: Request to update an Active Directory.
        required: true
    delete:
      description: Delete an Active Directory.
      tags:
      - Active Directory
      summary: Delete an Active Directory
      operationId: DeleteActiveDirectory
      parameters:
      - description: Specifies id of an Active Directory.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - description: Specifies the username of the Active Direcotry Admin.
        name: activeDirectoryAdminUsername
        in: header
        required: true
        schema:
          type: string
      - description: Specifies the password of the Active Direcotry Admin.
        name: activeDirectoryAdminPassword
        in: header
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    servers:
    - url: /v2
  /domain-controllers:
    get:
      description: Get Domain Controllers of specified domains.
      tags:
      - Active Directory
      summary: Get Domain Controllers of specified domains
      operationId: GetDomainControllers
      parameters:
      - description: Specifies a list of domain names.
        name: domainNames
        in: query
        required: true
        schema:
          type: array
          items:
            pattern: ^([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])(\.([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9\-]{0,61}[a-zA-Z0-9]))*$
            type: string
          minItems: 1
          uniqueItems: true
      - description: Specifies the Id of the connection which the connector belongs to.
        name: connectionId
        in: query
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/GetDomainControllersResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    servers:
    - url: /v2
components:
  schemas:
    RequestError:
      description: Details about the Error.
      type: object
      title: Error
      properties:
        errorCode:
          description: Operation response error code.
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: ErrorCode
        message:
          description: Description of the error.
          type:
          - string
          - 'null'
          x-go-name: Message
      x-go-package: cohesity/iris/server/data/public
    ActiveDirectoryEntry:
      description: Specifies the join settings for a Microsoft Active Directory domain.
      type: object
      title: Active Directory.
      properties:
        domainName:
          description: Specifies the fully qualified domain name (FQDN) of an Active Directory.
          type:
          - string
          - 'null'
          x-go-name: DomainName
        fallbackUserIdMappingInfo:
          description: 'Specifies the fallback id mapping info which is used when an ID mapping

            for a user is not found via the above IdMappingInfo. Only supported for

            two types of fallback mapping types - ''kRid'' and ''kFixed''.'
          $ref: '#/components/schemas/UserIdMapping'
        ignoredTrustedDomains:
          description: 'Specifies the list of trusted domains that were set by the user to be

            ignored during trusted domain discovery.'
          type:
          - array
          - 'null'
          items:
            type: string
          x-go-name: IgnoredTrustedDomains
        ldapProviderId:
          description: Specifies the LDAP provider id which is map to this Active Directory
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: LdapProviderId
        machineAccounts:
          description: 'Array of Machine Accounts.


            Specifies an array of computer names used to identify the Cohesity

            Cluster on the domain.'
          type:
          - array
          - 'null'
          items:
            type: string
          x-go-name: MachineAccounts
        ouName:
          description: Specifies an optional Organizational Unit name.
          type:
          - string
          - 'null'
          x-go-name: OuName
        password:
          description: Specifies the password for the specified userName.
          type:
          - string
          - 'null'
          x-go-name: Password
        preferredDomainControllers:
          description: 'Specifies Map of Active Directory domain names to its preferred domain

            controllers.'
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PreferredDomainController'
          x-go-name: PreferredDomainControllers
        taskPath:
          description: Specifies the task path for AD joining task.
          type:
          - string
          - 'null'
          x-go-name: TaskPath
        tenantId:
          description: Specifies the unique id of the tenant.
          type:
          - string
          - 'null'
          x-go-name: TenantId
        trustedDomains:
          description: Specifies the trusted domains of the Active Directory domain.
          type:
          - array
          - 'null'
          items:
            type: string
          x-go-name: TrustedDomains
          readOnly: true
        trustedDomainsEnabled:
          description: Specifies whether Trusted Domain discovery is disabled.
          type:
          - boolean
          - 'null'
          x-go-name: TrustedDomainsEnabled
        unixRootSid:
          description: 'Specifies the SID of the Active Directory domain user to be mapped to

            Unix root user.'
          type:
          - string
          - 'null'
          x-go-name: UnixRootSid
        userIdMappingInfo:
          description: 'Specifies the information about how the Unix and Windows users are mapped

            for this domain.'
          $ref: '#/components/schemas/UserIdMapping'
        userName:
          description: Specifies a userName that has administrative privileges in the domain.
          type:
          - string
          - 'null'
          x-go-name: UserName
        workgroup:
          description: Specifies an optional Workgroup name.
          type:
          - string
          - 'null'
          x-go-name: Workgroup
      x-go-package: cohesity/iris/server/data/public
    AddedActiveDirectoryPrincipal:
      description: 'Specifies a group or user added to the Cohesity Cluster for an Active

        Directory principal.'
      type: object
      title: Non-LOCAL Group or User.
      properties:
        createdTimeMsecs:
          description: 'Specifies the epoch time in milliseconds when the group or user

            was added to the Cohesity Cluster.'
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: CreatedTimeMsecs
        description:
          description: Specifies a description about the user or group.
          type:
          - string
          - 'null'
          x-go-name: Description
        domain:
          description: 'Specifies the domain of the Active Directory where the

            referenced principal is stored.'
          type:
          - string
          - 'null'
          x-go-name: Domain
        lastUpdatedTimeMsecs:
          description: 'Specifies the epoch time in milliseconds when the group or user

            was last modified on the Cohesity Cluster.'
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: LastUpdatedTimeMsecs
        objectClass:
          description: 'Specifies the type of the referenced Active Directory principal.

            If ''kGroup'', the referenced Active Directory principal is a group.

            If ''kUser'', the referenced Active Directory principal is a user.

            ''kUser'' specifies a user object class.

            ''kGroup'' specifies a group object class.

            ''kComputer'' specifies a computer object class.

            ''kWellKnownPrincipal'' specifies a well known principal.'
          type:
          - string
          - 'null'
          enum:
          - kUser
          - kGroup
          - kComputer
          - kWellKnownPrincipal
          x-go-name: ObjectClass
        principalName:
          description: 'Specifies the name of the Active Directory principal,

            that will be referenced by the group or user.

            The name of the Active Directory principal is used for naming

            the new group or user on the Cohesity Cluster.'
          type:
          - string
          - 'null'
          x-go-name: PrincipalName
        restricted:
          description: 'Whether the principal is a restricted principal. A restricted principal

            can only view the objects he has permissions to.'
          type:
          - boolean
          - 'null'
          x-go-name: Restricted
        roles:
          description: 'Array of Roles.


            Specifies the Cohesity roles to associate with this user or group

            such as ''Admin'', ''Ops'' or ''View''.

