openapi: 3.2.0
info:
  description: Cohesity API provides a RESTful interface to access the various data management operations on Cohesity cluster and Helios.
  title: Cohesity REST Platform API
  version: '2.0'
servers:
- url: /v2
tags:
- name: Platform
paths:
  /alertsSummary:
    get:
      description: Get alerts summary grouped by category.
      tags:
      - Platform
      summary: Get alerts summary
      operationId: GetAlertSummary
      parameters:
      - description: Filter by start time. Specify the start time as a Unix epoch Timestamp (in microseconds). By default it is current time minus a day.
        name: startTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: Filter by end time. Specify the end time as a Unix epoch Timestamp (in microseconds). By default it is current time.
        name: endTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: 'IncludeTenants specifies if alerts of all the tenants under the

          hierarchy of the logged in user''s organization should be used to

          compute summary.'
        name: includeTenants
        in: query
        schema:
          type: boolean
      - description: 'TenantIds contains ids of the tenants for which alerts are to be

          used to compute summary.'
        name: tenantIds
        in: query
        schema:
          type: array
          items:
            type: string
      - description: 'Specifies list of alert states to filter alerts by. If not specified,

          only open alerts will be used to get summary.'
        name: statesList
        in: query
        schema:
          type: array
          items:
            enum:
            - kResolved
            - kOpen
            - kNote
            - kSuppressed
            type: string
      responses:
        '200':
          $ref: '#/components/responses/GetAlertsSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
  /chassis:
    get:
      description: Get list of all chassis info that are part of cluster.
      tags:
      - Platform
      summary: Get list of chassis
      operationId: GetChassis
      parameters:
      - description: Filters chassis that have no rack assigned.
        name: noRackAssigned
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/ChassisListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
  /chassis/{id}:
    get:
      description: Get a chassis info by id.
      tags:
      - Platform
      summary: Get a chassis by chassis id
      operationId: GetChassisById
      parameters:
      - description: Specifies the id of chassis.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/ChassisResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    patch:
      description: Update selected properties of chassis info by id.
      tags:
      - Platform
      summary: Update a chassis by chassis id
      operationId: UpdateChassisById
      parameters:
      - description: Specifies the id of chassis.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/ChassisResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Chassis'
        description: Specifies the parameters to update chassis.
  /clusters:
    get:
      description: Retrieve some summary information about the Cluster Configuration.
      tags:
      - Platform
      summary: Retrieve Cluster Configuration
      operationId: GetCluster
      responses:
        '200':
          $ref: '#/components/responses/ClusterResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    put:
      description: Update the Cluster with the given configuration.
      tags:
      - Platform
      summary: Update a cluster
      operationId: UpdateCluster
      responses:
        '200':
          $ref: '#/components/responses/ClusterResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cluster'
        description: Specifies the parameters to update cluster.
        required: true
    post:
      description: Create a cluster with given network and cluster configuration.
      tags:
      - Platform
      summary: Create a cluster
      operationId: CreateCluster
      responses:
        '201':
          $ref: '#/components/responses/ClusterResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClusterParams'
        description: Specifies the parameters to create cluster.
        required: true
  /clusters/amqp-target-config:
    get:
      description: Fetch AMQP target config on the cluster.
      tags:
      - Platform
      summary: Get AMQP Target Config
      operationId: GetAMQPTargetConfig
      responses:
        '200':
          $ref: '#/components/responses/ClusterAMQPTargetConfigResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    put:
      description: Updates AMQP target config on the cluster.
      tags:
      - Platform
      summary: Update AMQP Target Config
      operationId: UpdateAMQPTargetConfig
      responses:
        '200':
          $ref: '#/components/responses/ClusterAMQPTargetConfigResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterAMQPTargetConfig'
        description: Specifies the parameters to update cluster AMQP target config.
        required: true
    delete:
      description: Delete AMQP target config on the cluster.
      tags:
      - Platform
      summary: Delete AMQP Target Config
      operationId: DeleteAMQPTargetConfig
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
  /disks/assimilate:
    post:
      description: Assimilate list of disks from one or more nodes of cluster.
      tags:
      - Platform
      summary: Assimilate disks
      operationId: DisksAssimilate
      responses:
        '200':
          $ref: '#/components/responses/DiskAssimilationResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterFreeDisks'
        description: Specifies the parameter to assimilate disks.
        required: true
  /disks/discover:
    get:
      description: Discover disks that are ready for activation
      tags:
      - Platform
      summary: Discover new disks
      operationId: DiscoverDisks
      responses:
        '200':
          $ref: '#/components/responses/DiscoverDisksResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
  /disks/identify:
    post:
      description: Turn on/off led light of a disk.
      tags:
      - Platform
      summary: Identify a disk
      operationId: DiskIdentify
      responses:
        '200':
          $ref: '#/components/responses/DiskIdentifyResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiskIdentify'
        description: Specifies the parameter to identify disk.
        required: true
  /disks/local:
    get:
      description: Get list of local disks.
      tags:
      - Platform
      summary: Get list of disks
      operationId: ListDisks
      parameters:
      - description: Specifies node id of the node to get list of disks
        name: nodeId
        in: query
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/DisksResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
  /disks/remote:
    get:
      description: Get remote disks.
      tags:
      - Platform
      summary: Get remote disks
      operationId: GetRemoteDisks
      parameters:
      - description: Specifies a list of disk ids, only disks having these ids will be returned.
        name: diskIds
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - description: Specifies a list of node ids, only disks in these nodes will be returned.
        name: nodeIds
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - description: Specifies a list of disk tiers, only disks with given tiers will be returned.
        name: tiers
        in: query
        schema:
          type: array
          items:
            enum:
            - PCIeSSD
            - SATA-SSD
            - SATA-HDD
            - CLOUD
            type: string
      - description: This field is deprecated. Providing this queryparam will not have any impact. Please use fileSystem query param to filter instead.
        name: mountPath
        in: query
        schema:
          type: string
      - description: Specified file system name to search. only disks with file system name that partially matches the specified name will be returned.
        name: fileSystem
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/GetRemoteDisksResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    post:
      description: Add a remote disk.
      tags:
      - Platform
      summary: Add remote disk
      operationId: AddRemoteDisk
      responses:
        '201':
          $ref: '#/components/responses/AddRemoteDiskResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoteDisks'
        description: Specifies the remote disk configuration.
        required: true
  /disks/remote/{id}:
    delete:
      description: Remove a remote disk.
      tags:
      - Platform
      summary: Remove remote disk
      operationId: RemoveRemoteDisk
      parameters:
      - description: Specifies the id of the remote disk to remove.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
  /disks/{id}/remove:
    post:
      description: Mark disk for removal or cancel removal if a disk is already marked for removal.
      tags:
      - Platform
      summary: Mark Disk for removal
      operationId: MarkDiskRemoval
      parameters:
      - description: Specifies unique id of the disk to mark for removal.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/DiskRemovalResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiskRemovalParams'
        description: Specifies parameters to mark/cancel disk removal.
        required: true
  /network-interfaces:
    get:
      description: Get a list of interfaces present on the node or cluster.
      tags:
      - Platform
      summary: Get list of interfaces
      operationId: GetNetworkInterfaces
      responses:
        '200':
          $ref: '#/components/responses/GetNetworkInterfacesResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
  /nodePower:
    post:
      description: Reboot or shutdown nodes in cluster.
      tags:
      - Platform
      summary: Reboot or shutdown nodes in cluster
      operationId: SetNodePower
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodePowerOperation'
        description: Specifies the reboot or shutdown operation.
        required: true
  /nodes/{id}/identify:
    post:
      description: Turn on/off LED light of a node to identify.
      tags:
      - Platform
      summary: Identify node
      operationId: Identify node
      parameters:
      - description: Specifies id of node to identify.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/NodeIdentifyResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeIdentifyParams'
        description: Specifies the parameter to identify node.
        required: true
  /nodes/{id}/remove:
    post:
      description: Mark node for removal or Cancel if a node is already marked for removal.
      tags:
      - Platform
      summary: Mark Node for removal
      operationId: MarkNodeRemoval
      parameters:
      - description: Specifies id of node to cancel removal.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/NodeRemovalResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeRemovalParams'
        description: Specifies parameters to initiate/cancel node removal .
        required: true
  /racks:
    get:
      description: Get list of all racks that are part of cluster.
      tags:
      - Platform
      summary: Get list of racks
      operationId: GetRacks
      responses:
        '200':
          $ref: '#/components/responses/RacksResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    post:
      description: Create list of racks and optionally also assign list of chassis to each rack
      tags:
      - Platform
      summary: Create racks
      operationId: CreateRacks
      responses:
        '201':
          $ref: '#/components/responses/RacksResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Racks'
        description: Specifies the parameters to create racks.
        required: true
    delete:
      description: Delete all the racks.
      tags:
      - Platform
      summary: Delete all the racks
      operationId: DeleteRacks
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    patch:
      description: Updates list of racks with name, chassis list or/and location
      tags:
      - Platform
      summary: Update racks
      operationId: UpdateRacks
      responses:
        '200':
          $ref: '#/components/responses/RacksResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Racks'
        description: Specifies the parameters to update racks.
        required: true
  /racks/{id}:
    get:
      description: Get a rack info by id.
      tags:
      - Platform
      summary: Get a rack by rack id
      operationId: GetRackById
      parameters:
      - description: Specifies the id of rack.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/RackResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    delete:
      description: Delete a given rack by id.
      tags:
      - Platform
      summary: Delete a rack by id
      operationId: DeleteRackById
      parameters:
      - description: Specifies a unique id of the rack.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    patch:
      description: Update selected properties of a rack given by id.
      tags:
      - Platform
      operationId: UpdateRackById
      parameters:
      - description: Specifies the id of rack.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/RackResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rack'
        description: Specifies the parameters to update rack.
      summary: Update rack by id
      x-summary-source: derived
  /remote-storage:
    get:
      description: Get summary about list of registered remote storage servers.
      tags:
      - Platform
      summary: Get Registered Remote Storage Servers List
      operationId: GetRegisteredRemoteStorageList
      responses:
        '200':
          $ref: '#/components/responses/RegisteredRemoteStorageListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    post:
      description: Register a remote storage to be used for disaggregated storage.
      tags:
      - Platform
      summary: Register Remote Storage
      operationId: RegisterNewRemoteStorage
      responses:
        '201':
          $ref: '#/components/responses/RemoteStorageRegistrationResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoteStorageInfo'
        description: Specifies the parameters to register a remote storage management server.
        required: true
  /remote-storage/{id}:
    get:
      description: Get details of remote storage given by id.
      tags:
      - Platform
      summary: Get remote storage details
      operationId: GetRemoteStorageDetails
      parameters:
      - description: Specifies the id of the registered remote storage.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - x-go-name: IncludeAvailableSpace
        description: Specifies whether to include available capacity on remote storage.
        name: includeAvailableSpace
        in: query
        schema:
          type: boolean
          default: false
      - x-go-name: IncludeAvailableDataVips
        description: Specifies whether to include available data vips on remote storage.
        name: includeAvailableDataVips
        in: query
        schema:
          type: boolean
          default: false
      - x-go-name: IncludeArrayInfo
        description: Includes flashblade specific info like name, software os and version of pure flashblade.
        name: includeArrayInfo
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          $ref: '#/components/responses/RemoteStorageRegistrationResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    delete:
      description: Delete remote storage registration.
      tags:
      - Platform
      summary: Delete Remote Storage Registration
      operationId: DeleteRemoteStorageRegistration
      parameters:
      - description: Specifies the registration id of the registered remote storage.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    patch:
      description: Update Registered Remote Storage Config.
      tags:
      - Platform
      summary: Update Remote Storage Config
      operationId: UpdateRemoteStorageRegistration
      parameters:
      - description: Specifies the registration id of the registered remote storage.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/RemoteStorageRegistrationResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoteStorageInfo'
        description: Specifies the parameters to update the registration.
        required: true
  /support-channel-config:
    get:
      description: Get support channel configuration.
      tags:
      - Platform
      summary: Get support channel configuration
      operationId: GetSupportChannelConfig
      responses:
        '200':
          $ref: '#/components/responses/GetSupportChannelConfigResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    put:
      description: Update support channel configuration.
      tags:
      - Platform
      summary: Update support channel configuration
      operationId: UpdateSupportChannelConfig
      responses:
        '200':
          $ref: '#/components/responses/GetSupportChannelConfigResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportChannelConfig'
        description: Specifies the support channel configuration.
        required: true
  /syslogAuditTags:
    get:
      description: Get cluster audit tags.
      tags:
      - Platform
      summary: Get cluster audit tags
      operationId: GetSyslogAuditTags
      responses:
        '200':
          $ref: '#/components/responses/SyslogAuditTagResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    post:
      description: Update cluster audit tags.
      tags:
      - Platform
      summary: Update cluster audit tags
      operationId: UpdateSyslogAuditTags
      responses:
        '200':
          $ref: '#/components/responses/SyslogAuditTagResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyslogAuditTag'
        description: Specifies syslog audit tag to update.
  /syslogProgramNames:
    get:
      description: Get supported program names to configure for a syslog server.
      tags:
      - Platform
      summary: Get supported program names
      operationId: GetSupportedSyslogProgramNames
      responses:
        '200':
          $ref: '#/components/responses/SyslogProgramNamesResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
  /syslogs:
    get:
      description: Get list of syslog servers.
      tags:
      - Platform
      summary: Get list of syslog servers
      operationId: GetSyslogServers
      responses:
        '200':
          $ref: '#/components/responses/GetSyslogServersResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    post:
      description: Add a new syslog server
      tags:
      - Platform
      summary: Add Syslog Server
      operationId: AddSyslogServer
      responses:
        '201':
          $ref: '#/components/responses/AddSyslogServerResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyslogServer'
        description: Specifies parameters to add syslog server.
        required: true
    delete:
      description: Delete all syslog servers.
      tags:
      - Platform
      summary: Remove syslog servers
      operationId: RemoveSyslogServers
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
  /syslogs/{id}:
    get:
      description: Get a syslog server by id.
      tags:
      - Platform
      summary: Get a syslog server by id
      operationId: GetSyslogServerById
      parameters:
      - description: Specifies the id of syslog server.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          $ref: '#/components/responses/SyslogServerResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    put:
      description: Update syslog server by id.
      tags:
      - Platform
      summary: Update a syslog server by id
      operationId: UpdateSyslogServerById
      parameters:
      - description: Specifies the id of syslog server.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          $ref: '#/components/responses/SyslogServerResponse'
        default:
