openapi: 3.2.0
info:
  version: 1.0.0
  description: Public APIs for Site Continuity v2 service.
  title: Site Continuity v2 Service DR Plan API
  termsOfService: https://cohesity.com
  contact:
    email: support@cohesity.com
servers:
- url: https://helios.cohesity.com/v2/mcm/site-continuity/v2
security:
- ApiKeyAuth: []
tags:
- name: DRPlan
paths:
  /dr-plans:
    post:
      description: 'Privileges: DRAAS_MODIFY


        Creates a new DR plan consisting of application, primary

        site, DR site and resource profile configuration.'
      tags:
      - DRPlan
      summary: Creates a DR plan
      operationId: SCCreateDRPlan
      responses:
        201:
          $ref: '#/components/responses/SCCreateDRPlanResponse'
        default:
          $ref: '#/components/responses/SCErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SCDRPlanCreateOrUpdateParams'
        description: Specifies the parameters to create a DR plan.
        required: true
    get:
      description: 'Privileges: DRAAS_VIEW


        Returns a list of DR Plans based on the defined filter

        criteria.'
      tags:
      - DRPlan
      summary: Returns a list of DR plans
      operationId: SCGetDrPlans
      parameters:
      - name: drPlanIds
        description: Specifies IDs to filter the DR plans response.
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: drPlanNames
        description: Specifies DR plan names to filter the DR plans response. This is case insensitive and supports substring search.
        in: query
        schema:
          type: array
          items:
            type: string
      - name: appIds
        description: Specifies application IDs to filter the DR plans response.
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: states
        description: Specifies list of states to filter the DR plans response.
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - Created
            - Active
            - Deleted
            - Failed
            - Completed
      - name: primarySiteIds
        description: Specifies primary site IDs to filter the DR plans response.
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: drSiteIds
        description: Specifies DR site IDs to filter the DR plans response.
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: statuses
        description: Specifies list of status to filter the DR plans response.
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - ActivationReady
            - ActivationInProgress
            - ActivationNotReady
            - ConfigurationError
            - FailoverNotReady
            - FailoverReady
            - FailoverInProgress
            - FailoverFailed
            - FailoverCompleted
            - PrepareForFailbackInProgress
            - FailbackNotReady
            - FailbackReady
            - FailbackInProgress
            - FailbackFailed
            - FailbackCompleted
            - TeardownInProgress
            - CancellationInProgress
            - TestFailoverInProgress
            - TestFailbackInProgress
            - PrepareForFailoverInProgress
            - SystemError
      - name: slaStatus
        description: Specifies the SLA status to filter the DR Plans response.
        in: query
        schema:
          type: string
          enum:
          - Satisfied
          - NotSatisfied
      - name: includeSummary
        description: Specifies the filter to include the summary of the DR plans. This must be passed and set to true in order to get the summary.
        in: query
        schema:
          type: boolean
      responses:
        200:
          $ref: '#/components/responses/SCGetDRPlansResponse'
        default:
          $ref: '#/components/responses/SCErrorResponse'
  /dr-plans/{id}:
    get:
      description: 'Privileges: DRAAS_VIEW


        Gets DR plan information using its ID.'
      tags:
      - DRPlan
      summary: Returns a DR plan by ID
      operationId: SCGetDRPlanById
      parameters:
      - name: id
        description: Specifies the ID of the DR plan.
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        200:
          $ref: '#/components/responses/SCGetDRPlanByIdResponse'
        default:
          $ref: '#/components/responses/SCErrorResponse'
    delete:
      description: 'Privileges: DRAAS_MODIFY


        Deletes a DR plan using its ID.'
      tags:
      - DRPlan
      summary: Deletes a DR plan by ID
      operationId: SCDeleteDRPlanById
      parameters:
      - name: id
        description: Specifies the ID of the DR plan.
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        204:
          description: No content
        default:
          $ref: '#/components/responses/SCErrorResponse'
    put:
      description: 'Privileges: DRAAS_MODIFY


        Updates DR plan''s information using its ID.'
      tags:
      - DRPlan
      summary: Updates a DR Plan by ID
      operationId: SCUpdateDRPlanById
      parameters:
      - name: id
        description: Specifies the ID of the DR plan.
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        200:
          $ref: '#/components/responses/SCUpdateDRPlanResponse'
        default:
          $ref: '#/components/responses/SCErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SCDRPlanCreateOrUpdateParams'
        description: Specifies the parameters to update a DR plan.
        required: true
  /dr-plans/{id}/actions:
    post:
      description: 'Privileges: DRAAS_MODIFY


        Performs actions such as activate, failover, failback, etc

        on a given DR plan.'
      tags:
      - DRPlan
      summary: Performs an action on a DR plan
      operationId: SCPerformActionOnDRPlan
      parameters:
      - name: id
        description: Specifies the ID of the DR plan.
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        202:
          $ref: '#/components/responses/SCPerformActionDrPlanResponse'
        default:
          $ref: '#/components/responses/SCErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SCPerformActionOnDrPlanParams'
        description: Specifies the parameters to perform action on DR plan.
        required: true
  /actions:
    get:
      description: 'Privileges: DRAAS_VIEW


        Returns a list of actions on DR plans based on the defined

        filter criteria.'
      tags:
      - DRPlan
      summary: Returns a list of actions
      operationId: SCGetActions
      parameters:
      - name: actionIds
        description: Specifies IDs to filter the actions response.
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: statuses
        description: Specifies list of statuses to filter the actions response.
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - Running
            - Completed
            - Failed
            - Canceled
            - Canceling
      - name: types
        description: Specifies list of types to filter the actions response.
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - Activate
            - PrepareForFailover
            - PrepareForFailback
            - TestFailover
            - TestFailback
            - Failover
            - Failback
            - Teardown
      - name: drPlanIds
        description: Filter the actions response by DR plan IDs.
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: fromTimeUsecs
        description: Specifies the starting timestamp in Unix time epoch in microseconds to get actions response. This filter will return the actions having start time greater than equal to this value.
        in: query
        schema:
          type: integer
          format: int64
      - name: toTimeUsecs
        description: Specifies the ending timestamp in Unix time epoch in microseconds to get actions response. This filter will return the actions having finish time less than equal to toTimeUsecs.
        in: query
        schema:
          type: integer
          format: int64
      - name: includeStepDetails
        description: Specifies the filter to include step level details for attempts associated with every DR action. This must be passed as true to include the step details in attempts.
        in: query
        schema:
          type: boolean
      responses:
        200:
          $ref: '#/components/responses/SCGetActionsResponse'
        default:
          $ref: '#/components/responses/SCErrorResponse'
  /actions/{id}:
    get:
      description: 'Privileges: DRAAS_VIEW


        Gets action information performed on DR plan using its action

        ID.'
      tags:
      - DRPlan
      summary: Returns an action by ID
      operationId: SCGetActionById
      parameters:
      - name: id
        description: Specifies the ID of the action.
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: includeStepDetails
        description: Specifies the filter to include step level details for attempts associated with DR action. This must be passed as true to include the step details in attempts.
        in: query
        schema:
          type: boolean
      responses:
        200:
          $ref: '#/components/responses/SCGetActionByIdResponse'
        default:
          $ref: '#/components/responses/SCErrorResponse'
  /actions/{id}/operations:
    post:
      description: 'Privileges: DRAAS_MODIFY


        Perform operations like cancel, resume and force finish

        on a DR plan action. The provided operation will be validated and error

        will be returned if operation cannot be performed at that time. Resume

        and force finish creates a new attempt on the DR plan action. Cancel

        cancels the latest attempt on the DR plan action. An attempt details

        must be accessed using the GET actions API by providing the the same

        action ID as provided here.'
      tags:
      - DRPlan
      summary: Performs operations on a DR plan action
      operationId: SCPerformOperationOnDrPlanAction
      parameters:
      - name: id
        description: Specifies the ID of the action on which the operation needs to be performed.
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        204:
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/SCErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SCOperationOnActionParams'
        description: Specifies the parameters to perform the operation on a DR plan action.
        required: true
components:
  schemas:
    SCSnapshotDetails:
      description: Specifies the specific details of the snapshot.
      type: object
      properties:
        snapshotId:
          description: Specifies the unique identifier for the snapshot.
          type:
          - string
          - 'null'
        snapshotTimeUsecs:
          description: Specifies the Unix time epoch in microseconds when the snapshot was taken.
          type:
          - integer
          - 'null'
          format: int64
    DrPlanErrorDetails:
      description: Specifies the error details in case DR plan is in a failed state.
      type: object
      properties:
        message:
          description: Specifies the overall error in the DR plan.
          type:
          - string
          - 'null'
        detailedErrors:
          description: Specifies more detailed errors and can be specific to entities, protection groups, policies etc.
          type:
          - array
          - 'null'
          items:
            type: string
    SCFailbackActionParams:
      description: Specifies the action parameters to trigger a failback on a DR plan.
      type: object
      allOf:
      - $ref: '#/components/schemas/SCDRPlanActionCommonParams'
      - type: object
        required:
        - environment
        properties:
          environment:
            description: Specifies the environment of the source for which the failback action needs to be performed.
            type: string
            enum:
            - vmware
          vmwareParams:
            description: Specifies the VMware specific parameters to perform the failback action.
            type: object
            $ref: '#/components/schemas/SCFailbackActionVMwareParams'
    SCObjectDetails:
      description: Specifies the object level details.
      type: object
      properties:
        objectId:
          description: Specifies the ID of the object.
          type:
          - integer
          - 'null'
          format: int64
        objectName:
          description: Specifies the name of the object.
          type:
          - string
          - 'null'
        objectType:
          description: Specifies the type of the object.
          type:
          - string
          - 'null'
          enum:
          - virtualMachine
        virtualMachineInfo:
          description: Specifies the details specific to the virtualMachine object type.
          type: object
          $ref: '#/components/schemas/SCVMDetails'
    SCvCenterDefaultResourceSet:
      description: Specifies the parameters required to configure default resource set.
      type: object
      required:
      - computeConfig
      properties:
        name:
          description: Specifies name of the resource set. If name is not provided then an internally generated name will be assigned to this resource set.
          type:
          - string
          - 'null'
        computeConfig:
          description: Specifies the compute settings for the current resource set.
          type: object
          $ref: '#/components/schemas/SCvCenterComputeConfig'
    SCDRPlan:
      description: Specifies the information about a DR plan.
      type: object
      properties:
        id:
          description: Specifies the unique identifier for the DR plan.
          type:
          - integer
          - 'null'
          format: int64
        state:
          description: Specifies the current state of the DR plan.
          type:
          - string
          - 'null'
          enum:
          - Created
          - Active
          - Failed
          - Completed
          - Deleted
        status:
          description: Specifies the current status of the DR plan.
          type:
          - string
          - 'null'
          enum:
          - ActivationReady
          - ActivationInProgress
          - ActivationNotReady
          - ConfigurationError
          - FailoverNotReady
          - FailoverReady
          - FailoverInProgress
          - FailoverFailed
          - FailoverCompleted
          - PrepareForFailbackInProgress
          - FailbackNotReady
          - FailbackReady
          - FailbackInProgress
          - FailbackFailed
          - FailbackCompleted
          - TeardownInProgress
          - CancellationInProgress
          - TestFailoverInProgress
          - TestFailbackInProgress
          - PrepareForFailoverInProgress
          - SystemError
        errorDetails:
          description: Specifies the error details in case DR plan is in a failed state.
          type:
          - object
          - 'null'
          $ref: '#/components/schemas/DrPlanErrorDetails'
        slaStatus:
          description: Specifies the SLA status for a DR plan.
          type:
          - string
          - 'null'
          enum:
          - Satisfied
          - NotSatisfied
        lastActionId:
          description: Specifies the last action id of a DR plan.
          type:
          - integer
          - 'null'
          format: int64
        isAppRunningOnDRSite:
          description: Specifies whether the app is currently running on the DR site. Value true implies that the app is running on DR site and false implies that the app is running on primary site. If no app is associated with the DR plan, this field will not be populated.
          type:
          - boolean
          - 'null'
        markedForDeletion:
          description: Specifies whether the DR plan is undergoing deletion in background. Once the DR plan is fully deleted, the response will not contain this DR plan.
          type:
          - boolean
          - 'null'
        lastTestActionId:
          description: Specifies the last test action ID on the DR plan. This will only be populated if at least one test action such as test failover or test failback has run on the DR plan.
          type:
          - integer
          - 'null'
          format: int64
        lastHealthCheckDetails:
          description: Specifies the details of the last health check executed on a DR plan.
          type:
          - object
          - 'null'
          $ref: '#/components/schemas/SCHealthCheck'
      allOf:
      - $ref: '#/components/schemas/SCDRPlanCreateOrUpdateParams'
    SCInitiateHealthCheckParams:
      description: Specifies the parameters required to initiate a health check.
      type: object
      required:
      - checkType
      properties:
        checkType:
          description: Specifies the type of the resource on which the health check should be initiated.
          type:
          - string
          - 'null'
          enum:
          - DRPlan
        drPlanHealthCheckParams:
          description: Specifies the parameters required for initiating health check on a DR plan.
          type:
          - object
          - 'null'
          $ref: '#/components/schemas/SCDRPlanHealthCheckParams'
    SCDRPlanCreateOrUpdateParams:
      description: Specifies the parameters required for creation of DR plan.
      type: object
      required:
      - name
      - primarySite
      - drSite
      - rpo
      properties:
        name:
          description: Specifies the name of the DR Plan.
          type:
          - string
          - 'null'
        description:
          description: Specifies the description of the DR Plan.
          type:
          - string
          - 'null'
        primarySite:
          description: Specifies the primary site configuration of the DR plan.
          type: object
          $ref: '#/components/schemas/SCPrimarySiteConfig'
        drSite:
          description: Specifies the DR site configuration of the DR plan.
          type: object
          $ref: '#/components/schemas/SCDRSiteConfig'
        appId:
          description: Specifies the unique identifier for the application. This field is optional for creation of DR plan but it is required before performing any actions on a DR plan.
          type:
          - integer
          - 'null'
          format: int64
        rpo:
          description: Specifies the Recovery Point Objective (RPO) configuration required for this DR plan. This value is used to validate the RPO expectation of the DR plan by comparing this configuration against the backup and replication frequencies set on the objects in the DR plan.
          type: object
          $ref: '#/components/schemas/SCRPOConfig'
    SCPerformActionOnDrPlanParams:
      description: Specifies the parameters required to perform a specific action on a DR plan.
      type: object
      required:
      - action
      properties:
        action:
          description: Specifies the current action which is being performed on a DR plan. <br> 'Activate' activates the DR plan which periodically checks the protection and replication status to determine if the DR plan Recovery Point Objective (RPO) is met. <br> 'TestFailover' tests if a failover from primary site to DR site works. <br> 'Failover' fails over the resources from primary site to DR site. <br> 'PrepareForFailback' prepares the DR plan for a Failback operation by validating the required configuration for failback to the primary site. <br> 'TestFailback' tests if a failback from DR site to primary site works. <br> 'Failback' fails back the resources from DR site to primary site. <br> 'PrepareForFailover' prepares the DR plan for subsequent Failover operation (after a successful Failover and Failback) by validating the required configuration for Failover to the DR site. <br> 'Teardown' can be used to tear down configuration after a failed/partially successful Failover or Failback operation. This option can also be used to tear down configuration after a successful/failed/partially successful Test Failover or Test Failback operation. <br>
          type:
          - string
          - 'null'
          enum:
          - Activate
          - PrepareForFailover
          - PrepareForFailback
          - TestFailover
          - TestFailback
          - Failover
          - Failback
          - Teardown
        failoverParams:
          description: Specifies the parameters to trigger failover on a DR plan.
          type: object
          $ref: '#/components/schemas/SCFailoverActionParams'
        testFailoverParams:
          description: Specifies the parameters to trigger a test failover on a DR plan.
          type: object
          $ref: '#/components/schemas/SCTestFailoverActionParams'
        failbackParams:
          description: Specifies the parameters to trigger a failback on a DR plan.
          type: object
          $ref: '#/components/schemas/SCFailbackActionParams'
        testFailbackParams:
          description: Specifies the parameters to trigger a test failback on a DR plan.
          type: object
          $ref: '#/components/schemas/SCTestFailbackActionParams'
        teardownParams:
          description: Specifies the parameters to trigger a teardown operation on a specified action.
          type: object
          $ref: '#/components/schemas/SCTeardownActionParams'
    SCTestFailbackActionParams:
      description: Specifies the action parameters to trigger a test failback on a DR plan.
      type: object
      allOf:
      - $ref: '#/components/schemas/SCDRPlanActionCommonParams'
      - type: object
        required:
        - environment
        properties:
          environment:
            description: Specifies the environment of the source for which the test failback action needs to be performed.
            type: string
            enum:
            - vmware
          vmwareParams:
            description: Specifies the VMware specific parameters to perform the test failback action.
            type: object
            $ref: '#/components/schemas/SCTestFailbackActionVMwareParams'
    SCDRSourceVCenterParams:
      description: Specifies the vCenter parameters to configure a source.
      type: object
      required:
      - objectId
      properties:
        objectId:
          description: Specifies the object ID of the vCenter. This object identifier uniquely locates the vCenter object within Cohesity.
          type:
          - integer
          - 'null'
          format: int64
        resourceProfiles:
          description: Specifies the resource profile settings.
          type: array
          items:
            $ref: '#/components/schemas/SCvCenterResourceProfileParams'
    SCObjectSnapshotUserConfig:
      description: Specifies the object and snapshot details from the user provided configuration at the time of action submission.
      type: object
      properties:
        objectDetails:
          description: Specifies the specific details of the object.
          type: object
          $ref: '#/components/schemas/SCObjectDetails'
        snapshotDetails:
          description: Specifies the specific details of the snapshot for the object.
          type: object
          $ref: '#/components/schemas/SCSnapshotDetails'
        pointInTimeUsecs:
          description: Specifies the epoch timestamp in microseconds of a point-in-time selected by the user.
          type:
          - integer
          - 'null'
          format: int64
    SCTestFailoverActionVMwareParams:
      description: Specifies the VMware specific parameters to perform the test failover action.
      type: object
      required:
      - resourceProfileName
      properties:
        resourceProfileName:
          description: Specifies the unique resource profile name which is added as a part of the DR plan.
          type:
          - string
          - 'null'
        performStorageVmotion:
          description: Specifies whether to perform the storage vMotion operation with the test failover action. Default value is false if not specified.
          type:
          - boolean
          - 'null'
    SCvCenterCustomResourceSet:
      description: Specifies the parameters required to configure a custom resource set.
      type: object
      allOf:
      - $ref: '#/components/schemas/SCvCenterDefaultResourceSet'
      - type: object
        properties:
          objectIds:
            description: Specifies the list of VM object IDs to which the given resource settings will apply. These objects will override the default settings provided in default resource set.
            type: array
            items:
              type: integer
              format: int64
            minItems: 1
    SCFailbackActionVMwareParams:
      description: Specifies the action parameters to trigger failback for VMware environment.
      type: object
      required:
      - resourceProfileName
      properties:
        resourceProfileName:
          description: Specifies the unique resource profile name which is added as a part of the DR plan.
          type:
          - string
          - 'null'
        shutdownVms:
          description: Specifies if the data objects such as VMs at DR site should be shut down after failback is completed.
          type:
          - boolean
          - 'null'
        protectVms:
          description: Specifies if the data objects such as VMs at primary site should be re-protected after failback is completed.
          type:
          - boolean
          - 'null'
    SCDRPlanActionCommonParams:
      description: Specifies the action parameters to trigger failover or failback on a DR plan.
      type: object
      properties:
        objectSnapshotOverrides:
          description: Specifies the list of object Ids along with the snapshot ID which will be used during failover. If object ID is not specified then latest snapshot will be used internally for failover action for that object.
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SCObjectSnapshotOverride'
    SCFailoverActionParams:
      description: Specifies the action parameters to trigger failover on a DR plan.
      type: object
      allOf:
      - $ref: '#/components/schemas/SCDRPlanActionCommonParams'
      - type: object
        required:
        - environment
        properties:
          environment:
            description: Specifies the environment of the source for which the failover action needs to be performed.
            type: string
            enum:
            - vmware
          vmwareParams:
            description: Specifies the VMware specific parameters to perform the failover action.
            type: object
            $ref: '#/components/schemas/SCFailoverActionVMwareParams'
    SCDRSourceVMwareParams:
      description: Specifies the source details for adding VMware objects.
      type: object
      required:
      - sourceType
      properties:
        sourceType:
          description: Specifies the type of the VMware source.
          type:
          - string
          - 'null'
          enum:
          - vCenter
        vCenterParams:
          description: Specifies the parameters to configure vCenter source.
          type: object
          $ref: '#/components/schemas/SCDRSourceVCenterParams'
    SCManualObjectLevelIpConfig:
      description: Specifies the object level manual IP configuration.
      allOf:
      - type: object
        required:
        - objectId
        - ipAddress
        - subnet
        - gateway
        properties:
          objectId:
            description: Specifies the object ID for VM for which static IP need to be assigned.
            type:
            - integer
            - 'null'
            format: int64
          ipAddress:
            description: Specifies the static IP address.
            type:
            - string
            - 'null'
          subnet:
            description: Specifies the subnet for IP address.
            type:
            - string
            - 'null'
          gateway:
            description: Specifies the gateway network address.
            type:
            - string
            - 'null'
      - $ref: '#/components/schemas/SCCommonDNSSettings'
    SCIpConfig:
      description: Specifies the customer IP configuration parameters.
      type: object
      required:
      - configurationType
      properties:
        configurationType:
          description: Specifies the type of the IP configuration.
          type:
          - string
          - 'null'
          enum:
          - DHCP
          - Static
        dhcpConfig:
          description: Specifies the dhcp IP configuration.
          type: object
          $ref: '#/components/schemas/SCDhcpIpConfig'
        staticConfig:
          description: Specifies the static IP configuration.
          type: object
          $ref: '#/components/schemas/SCStaticIpConfig'
    SCError:
      description: Specifies the error object with error code and a message.
      type: object
      properties:
