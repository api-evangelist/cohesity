        customResourceSets:
          description: Specifies the parameters required to configure custom resource sets. These are additional resource sets added along with default resource set primarily to override default settings.
          type: array
          items:
            $ref: '#/components/schemas/SCvCenterCustomResourceSet'
        ipConfig:
          description: Specifies the custom IP configuration for VMs as part of a resource profile.
          type: object
          $ref: '#/components/schemas/SCIpConfig'
    SCvCenterComputeConfig:
