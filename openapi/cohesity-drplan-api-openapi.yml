    SCAttemptStepObject:
      description: Specifies the object level details involved in the individual step of an attempt.
      type: object
      properties:
        objectId:
          description: Specifies the ID of the object.
          type:
          - integer
          - 'null'
          format: int64
        objectName:
          description: Specifies the name of the object.
          type:
          - string
          - 'null'
    SCAttemptStep:
      description: Specifies the step level details such as message, status, progress percentage for the respective DR action.
      type: object
      properties:
        message:
          description: Specifies the detailed message for the step.
          type:
          - string
          - 'null'
        status:
          description: Specifies the status of the step. <br> 'Created' state specifies that attempt step has been created. <br> 'InProgress' status specifies that attempt step is in progress. This is a transient status and will not emit a timestamp. Instead, the status will change to 'Success' or 'Failure' when step reaches a terminating status such as success or failure. <br> 'Success' status specifies that attempt step has successfully finished. <br> 'Failure' status specifies that attempt step has failed. <br>
          type:
          - string
          - 'null'
          enum:
          - Started
          - InProgress
          - Success
          - Failure
        stepTimeUsecs:
          description: Specifies the emit time of the step in microseconds. This timestamp will not be emitted for inProgress steps.
          type:
          - integer
          - 'null'
          format: int64
        progressPercentage:
          description: Specifies the progress in percentage for the step.
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        objects:
          description: Specifies the list of objects associated with this step. A single step may be working on one or more objects as per the functioning of the step.
          type: array
          items:
            $ref: '#/components/schemas/SCAttemptStepObject'
        subSteps:
          description: Specifies the list of sub-steps associated with the current step. At occasions, larger steps may be divided into smaller sub-steps and details of these steps will be returned here.
          type: array
          items:
            $ref: '#/components/schemas/SCAttemptStep'
    SCDrPlanAction:
      description: Specifies the action configuration to be executed on a DR plan.
      type: object
      properties:
        actionId:
          description: Specifies the identifier which can be used to get the current status of the action.
          type:
          - integer
          - 'null'
          format: int64
        action:
          description: Specifies the current action which is being performed on a DR plan. <br> 'Activate' activates the DR plan which periodically checks the protection and replication status to determine if the DR plan Recovery Point Objective (RPO) is met. <br> 'TestFailover' tests if a failover from primary site to DR site works. <br> 'Failover' fails over the resources from primary site to DR site. <br> 'PrepareForFailback' prepares the DR plan for a Failback operation by validating the required configuration for failback to the primary site. <br> 'TestFailback' tests if a failback from DR site to primary site works. <br> 'Failback' fails back the resources from DR site to primary site. <br> 'PrepareForFailover' prepares the DR plan for subsequent Failover operation (after a successful Failover and Failback) by validating the required configuration for Failover to the DR site. <br> 'Teardown' can be used to tear down configuration after a failed/partially successful Failover or Failback operation. This option can also be used to tear down configuration after a successful/failed/partially successful Test Failover or Test Failback operation. <br>
          type:
          - string
          - 'null'
          enum:
          - Activate
          - PrepareForFailover
          - PrepareForFailback
          - TestFailover
          - TestFailback
          - Failover
          - Failback
          - Teardown
    SCRPOConfig:
      description: Specifies the Recovery Point Objective (RPO) configuration for a DR Plan.
      required:
      - unit
      properties:
        unit:
          description: Specifies the unit for RPO settings.
          type:
          - string
          - 'null'
          enum:
          - Minutes
          - Hours
          - Days
        frequency:
          description: Specifies the frequency at which RPO need to be executed along with the unit.
          type:
          - integer
          - 'null'
          format: int32
          minimum: 1
    SCTestFailoverActionParams:
