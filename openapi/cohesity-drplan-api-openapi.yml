        networkPortGroupConfig:
          description: Specifies the compute settings for the data store located under a specific vCenter object hierarchy on Cohesity.
          type: object
          $ref: '#/components/schemas/SCNetworkPortGroupComputeConfig'
    SCAction:
      description: Specifies the details of an ongoing or past action performed on a DR plan.
      type: object
      properties:
        id:
          description: Specifies the identifier for an action.
          type:
          - integer
          - 'null'
          format: int64
        type:
          description: Specifies the current action which is being performed on a DR plan. <br> 'Activate' activates the DR plan which periodically checks the protection and replication status to determine if the DR plan Recovery Point Objective (RPO) is met. <br> 'TestFailover' tests if a failover from primary site to DR site works. <br> 'Failover' fails over the resources from primary site to DR site. <br> 'PrepareForFailback' prepares the DR plan for a Failback operation by validating the required configuration for failback to the primary site. <br> 'TestFailback' tests if a failback from DR site to primary site works. <br> 'Failback' fails back the resources from DR site to primary site. <br> 'PrepareForFailover' prepares the DR plan for subsequent Failover operation (after a successful Failover and Failback) by validating the required configuration for Failover to the DR site. <br> 'Teardown' can be used to tear down configuration after a failed/partially successful Failover or Failback operation. This option can also be used to tear down configuration after a successful/failed/partially successful Test Failover or Test Failback operation. <br>
          type:
          - string
          - 'null'
          enum:
          - Activate
          - PrepareForFailover
          - PrepareForFailback
          - TestFailover
          - TestFailback
          - Failover
          - Failback
          - Teardown
        drPlanId:
          description: Specifies the ID of the DR plan with which the current action is associated.
          type:
          - integer
          - 'null'
          format: int64
        status:
          description: Specifies the current status of the DR plan action. Following status field will always match with latest attempt's status.
          type:
          - string
          - 'null'
          enum:
          - Running
          - Completed
          - Failed
          - Canceled
          - Canceling
        message:
          description: Specifies the message associated with the above status. In case of errors/warnings, this field will be populated with appropriate message.
          type:
          - string
          - 'null'
        progressPercentage:
          description: Specifies the progress in percentage for a DR plan action.
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        startTimeUsecs:
          description: Specifies the start time of the action in microseconds.
          type:
          - integer
          - 'null'
          format: int64
        endTimeUsecs:
          description: Specifies the end time of the action in microseconds.
          type:
          - integer
          - 'null'
          format: int64
        latestAttemptId:
          description: Specifies the identifier to locate the latest attempt for a DR plan action.
          type:
          - integer
          - 'null'
          format: int64
        attempts:
          description: Specifies the list of attempts associated with an action. The list of attempts will be returned in the order of start timestamps where latest timestamp will appear first and so on.
          type: array
          items:
            $ref: '#/components/schemas/SCActionAttempt'
        parentId:
          description: Specifies the identifier of the parent action on which the current action is performed. e.g Teardown action can be performed on failover/test failover/failback/test failback action. This field will not be populated for activities such as Activation, Failover, Test failover, Failback, Test failback etc where no parent action exists.
          type:
          - integer
          - 'null'
          format: int64
        supportedOperations:
          description: Specifies the operations that can be performed to handle the failures that resulted from this action.
          type: array
          items:
            type:
            - string
            - 'null'
            enum:
            - ForceFinish
            - Resume
            - Cancel
            - Teardown
        userConfig:
          description: Specifies the user provided configuration associated with the current activity. This field will only be populated for types of activities such as Failover, TestFailover, Failback, TestFailback etc. where explicit user configuration is provided when performing an action on DR plan.
          type: object
          $ref: '#/components/schemas/SCUserActionConfig'
    SCObjectSnapshotOverride:
      description: Specifies the list of object Ids along with the snapshot timestamps typically used for actual or test failover/failback.
      required:
      - objectId
      properties:
        objectId:
          description: Specifies the unique ID of the object in DR plan. This identifier uniquely locates the data object such as VM in primary site.
          type:
          - integer
          - 'null'
          format: int64
        snapshotId:
          description: Specifies the snapshot identifier associated with the object id mentioned above. If objectID is provided but 'snapshotId' is not, then the field will be defaulted to a latest snapshot Id internally.
          type:
          - string
          - 'null'
        pointInTimeUsecs:
          description: Specifies the epoch timestamp in microseconds for recovering to a point-in-time in the past. This option is only available if Continuous Data Protection (CDP) is enabled for data objects.
          type:
          - integer
          - 'null'
          format: int64
    SCDatastoreComputeConfig:
      description: Specifies the compute settings for the data store object located under a specific vCenter object hierarchy on Cohesity.
      type: object
      required:
