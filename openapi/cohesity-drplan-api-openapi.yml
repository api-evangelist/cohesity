          type:
          - string
          - 'null'
          readOnly: true
        name:
          description: Specifies the name of the data store object.
          type:
          - string
          - 'null'
          readOnly: true
    SCTeardownActionParams:
      description: Specifies the action parameters to teardown a DR plan action.
      type: object
      required:
      - actionId
      properties:
        actionId:
          description: Specifies the action identifier on which the teardown operation needs to be performed. For specified action ID, if teardown action is not applicable then validation error will be returned.
          type:
          - integer
          - 'null'
          format: int64
    SCHealthCheck:
      description: Specifies the information about the health check.
      type: object
      allOf:
      - $ref: '#/components/schemas/SCInitiateHealthCheckParams'
      properties:
        status:
          description: Specifies the current status of the health check.
          type:
          - string
          - 'null'
          enum:
          - Scheduled
          - Running
          - Successful
          - Failed
        startTimeUsecs:
          description: Specifies the start time of the health check in microseconds.
          type:
          - integer
          - 'null'
          format: int64
        endTimeUsecs:
          description: Specifies the end time of the health check in microseconds.
          type:
          - integer
          - 'null'
          format: int64
        message:
          description: Specifies the message associated with the health check.
          type:
          - string
          - 'null'
    SCOriginalStaticIpConfig:
      description: Specifies the original static IP configuration.
      allOf:
      - $ref: '#/components/schemas/SCCommonDNSSettings'
    SCUserActionConfig:
      description: Specifies the user configuration which was used during the submission of the action.
      type: object
      properties:
        sourceConfig:
          description: Specifies the source configuration which was used during submission of the action. This configuration will contain the details such as source type, source identifier, resource profile etc. In case of vCenter source, resource profile array will always contain a single entry of the resource profile selected used during the submission of the DR action. This field will only be populated for actions such as Failover, Failback, TestFailover, and TestFailback.
          type: object
          $ref: '#/components/schemas/SCSourceConfig'
        objectSnapshots:
          description: Specifies the list of object and snapshot details that was provided at the time of action submission.
          type: array
          items:
            $ref: '#/components/schemas/SCObjectSnapshotUserConfig'
    SCActionAttempt:
      description: Specifies the attempt details for an action. A new attempt is created under following two conditions. <br> 1. When an top level action (Failover, Failback, Test Failover, Test Failback) is performed on a DR plan, a new attempt will be created. <br> 2. In case if action created from point 1 results into the failed state, then clients can execute operations such as resume or force finish to recover from errors. Each of these operations will create a new attempt and clients must use the latest attempt to track the progress of a DR action. <br>
      type: object
      properties:
        attemptId:
          description: Specifies the unique identifier for the attempt. This identifier is unique within the scope of the DR plan action.
          type:
          - integer
          - 'null'
          format: int64
        operationType:
          description: Specifies the current operation which is being performed on a DR plan action. This operation type will be populated only if the attempt is initiated by executing an operation on a DR action.
          type:
          - string
          - 'null'
          enum:
          - Resume
          - ForceFinish
        status:
          description: Specifies the current status of an attempt.
          type:
          - string
          - 'null'
          enum:
          - Running
          - Completed
          - Failed
          - Canceled
          - Canceling
        message:
          description: Specifies the message associated with the status. In case of errors/warnings, this field will be populated with appropriate message.
          type:
          - string
          - 'null'
        startTimeUsecs:
          description: Specifies the start time of an attempt in microseconds.
          type:
          - integer
          - 'null'
          format: int64
        endTimeUsecs:
          description: Specifies the end time of an attempt in microseconds.
          type:
          - integer
          - 'null'
          format: int64
        cancellationTimeUsecs:
          description: Specifies the time when cancel operation was initiated on the ongoing attempt. This field will be populated only if the operation type is 'Cancel'.
          type:
          - integer
          - 'null'
          format: int64
        steps:
          description: Specifies the list of steps associated with the attempt. Each step indicates the incremental progression of the attempt.
          type: array
          items:
            $ref: '#/components/schemas/SCAttemptStep'
    SCDataCenterComputeConfig:
      description: Specifies the compute settings for the data center located under a specific vCenter object hierarchy on Cohesity.
      type: object
      required:
      - id
      properties:
        id:
          description: Specifies the ID of the data center object.
          type:
          - integer
          - 'null'
          format: int64
        moRef:
          description: Specifies the Managed Object Reference (MoRef) of the data center object. This is a unique identifier inside vCenter.
          type:
          - string
          - 'null'
          readOnly: true
        name:
          description: Specifies the name of the data center object.
          type:
          - string
          - 'null'
          readOnly: true
    SCSourceConfig:
      description: Specifies the source details for DR plan configuration.
      type: object
      required:
      - environment
      properties:
        environment:
          description: Specifies the source environment.
          type: string
          enum:
          - vmware
        vmwareParams:
          description: Specifies the source for adding VMware data object parameters. Only vCenter is supported at this time.
          type: object
          $ref: '#/components/schemas/SCDRSourceVMwareParams'
    SCOperationOnActionParams:
      description: Specifies the parameters for an performing an operation on a DR plan action.
      type: object
      required:
      - operationType
      properties:
        operationType:
          description: Specifies the current operation type which is being performed on an action. <br> 'Cancel' is used to cancel any of the following in-flight actions - Activate, PrepareForFailover, PrepareForFailback, TestFailover, Failover, TestFailback, Failback. This operation will cancel the latest ongoing attempt. <br> 'Resume' resumes a failed/partially successful Failover or Failback action. This operation will create a new attempt to resume the respective DR plan action. <br> 'ForceFinish' forcefully finishes a partially successful Failover or Failback action without attempting to bring up the failed resources. This operation will create a new attempt to force finish the respective DR plan action. <br>
          type:
          - string
          - 'null'
          enum:
          - Cancel
          - Resume
          - ForceFinish
