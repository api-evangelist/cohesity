    SCDRPlansSummary:
      description: Specifies the summary of the DR Plans.
      type: object
      properties:
        totalPlans:
          description: Specifies the total number DR Plans.
          type:
          - integer
          - 'null'
          format: int32
        activePlans:
          description: Specifies the total number of active DR plans. This includes the plans that are either currently active, completed or failed due to an error.
          type:
          - integer
          - 'null'
          format: int32
        runningPlans:
          description: Specifies the  total number of DR Plans in running status. This includes the plans that are in failover running, failback running, teardown running or cancelling status.
          type:
          - integer
          - 'null'
          format: int32
        completedPlans:
          description: Specifies the total number of completed DR plans. This includes the plans that are currently either failover completed or failback completed.
          type:
          - integer
          - 'null'
          format: int32
        readyPlans:
          description: Specifies the total number of DR plans that are ready for any of the actions such as activation, failover, or failback.
          type:
          - integer
          - 'null'
          format: int32
        notReadyPlans:
          description: Specifies the total number of DR plans that are not ready for any of the actions such as activation, failover, or failback.
          type:
          - integer
          - 'null'
          format: int32
        failedPlans:
          description: Specifies the total number of plans that either failed a failover or failback operation, or have some configuration error.
          type:
          - integer
          - 'null'
          format: int32
        slaSatisfiedPlans:
          description: Specifies the total number of active DR plans where SLA is satisfied.
          type:
          - integer
          - 'null'
          format: int32
        slaNotSatisfiedPlans:
          description: Specifies the total number of active DR plans where SLA is not satisfied.
          type:
          - integer
          - 'null'
          format: int32
    SCStaticIpConfig:
