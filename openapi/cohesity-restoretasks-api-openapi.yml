openapi: 3.2.0
info:
  description: 'This API list provides operations for interfacing with the Cohesity

    Cluster.'
  title: Cohesity REST Restore Tasks API
  version: '1.0'
servers:
- url: https://<CLUSTER_VIP>/irisservices/api/v1
tags:
- name: RestoreTasks
paths:
  /public/restore/adDomainRootTopology:
    get:
      description: Returns the root topology for an AD domain.
      tags:
      - RestoreTasks
      summary: Gets Root Topology for an AD Domain
      operationId: GetAdDomainRootTopology
      parameters:
      - x-go-name: RestoreTaskId
        description: 'Specifies the restoreTaskId corresponding to which we need to

          get the ad topology.'
        name: restoreTaskId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/GetAdDomainRootTopologyResponse'
        default:
          $ref: '#/components/responses/Error'
  /public/restore/adObjectAttributes:
    post:
      description: 'Returns the list of AD Objects after comparing attributes of AD Object from

        both Snapshot and Production AD.'
      tags:
      - RestoreTasks
      summary: Compares the AD Object from both Snapshot and Production AD and returns the…
      operationId: CompareAdObjects
      responses:
        '200':
          $ref: '#/components/responses/CompareAdObjectsResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompareAdObjectsRequest'
        description: 'Specifies the Request to compare the AD Objects

          from both Snapshot and Production AD.'
        required: true
  /public/restore/adObjects:
    get:
      description: 'Returns the list of AD Objects along with status whether they are missing in

        Production AD, equal or not equal.'
      tags:
      - RestoreTasks
      summary: Searches for AD Objects in both Production and Snapshot AD from given search…
      operationId: SearchAdObjects
      parameters:
      - x-go-name: RestoreTaskId
        description: 'Specifies the restoreTaskId corresponding to which we need to search

          AD objects.'
        name: restoreTaskId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - x-go-name: NumObjects
        description: Specifies the number of AD Objects to be fetched.
        name: numObjects
        in: query
        schema:
          type: integer
          format: uint32
      - x-go-name: SearchBaseDn
        description: 'Specifies the search base distinguished name from where the search

          should begin in the hierarchy of the AD in both Production

          and Snapshot AD.'
        name: searchBaseDn
        in: query
        schema:
          type: string
      - x-go-name: SubtreeSearchScope
        description: 'Specifies the search scope for the request.

          If subtree search scope is true all the children of Search Base DN

          are returned from given offset. If subtree search scope is false

          only all objects which are one level from the Search Base DN are returned.'
        name: subtreeSearchScope
        in: query
        schema:
          type: boolean
      - x-go-name: CompareObjects
        description: 'Specifies the option to compare the properties from Snapshot AD and

          Production AD if specifed and sets kNotEqual flag in the result when

          there is mismatch.'
        name: compareObjects
        in: query
        schema:
          type: boolean
      - x-go-name: ExcludeSystemProperties
        description: 'Specifies the option to exclude the system attributes while comparing the

          the objects from the Production AD and Snapshot AD.'
        name: excludeSystemProperties
        in: query
        schema:
          type: boolean
      - x-go-name: Filter
        description: 'Specifies the filter which can be used for searching the AD Objects from

          given Search Base DN.

          There are two types of filters supported. They are:

          1) If the string does not contain LDAP delimiters ''('' and '')'', then it is

          assumed to be ANR search "(anr=<ldap_filter>)"

          Eg: "a" will result in query to return all ANR fields with "a" characters

          (case insensitive) in them

          2) Search with OR and AND combination:

          "(|(&(objectClass=user)(distinguishedName=CN=Jone

          Doe,OU=Users,DC=corp,DC=cohesity,DC=com))(&(objectClass=user)

          (sAMAccountName=jdoe)))"'
        name: filter
        in: query
        schema:
          type: string
      - x-go-name: RecordOffset
        description: 'Specifies the offset from which AD objects should be searched in both

          the Snapshot and Production AD.'
        name: recordOffset
        in: query
        schema:
          type: integer
          format: uint32
      responses:
        '200':
          $ref: '#/components/responses/SearchAdObjectsResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      description: 'Returns the list of AD Objects that match the list of object guids,

        sam account names and distinguished names provided in the request.'
      tags:
      - RestoreTasks
      summary: Searches for AD Objects that match the list of object guids, sam account names…
      operationId: SearchProductionAdObjects
      responses:
        '200':
          $ref: '#/components/responses/SearchAdObjectsResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchProductionAdObjectsRequest'
        description: Specifies the Request to search the AD Objects from Production AD.
        required: true
  /public/restore/adObjects/searchResults:
    get:
      description: 'Search for AD objects to recover that match the specified search and filter criterias

        provided in the request.'
      tags:
      - RestoreTasks
      operationId: GetAdObjects
      parameters:
      - x-go-name: Name
        description: Specifies the name of the AD object.
        name: name
        in: query
        schema:
          type: string
      - x-go-name: SamAccountName
        description: Specifies the sam account name of the AD object.
        name: samAccountName
        in: query
        schema:
          type: string
      - x-go-name: ObjectType
        description: 'Specifies the type of the AD Object. The type may be user, computer,

          group or ou(organizational unit).'
        name: objectType
        in: query
        schema:
          type: string
      - x-go-name: Email
        description: Specifies the email of the AD object of type user or group.
        name: email
        in: query
        schema:
          type: string
      - x-go-name: RegisteredSourceIds
        description: 'Specifies the Active Directory Application Server Ids which contains

          the AD objects.'
        name: registeredSourceIds
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: JobIds
        description: 'Specifies the protection job Ids which have backed up Active Directory

          Application Server.'
        name: jobIds
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: ViewBoxIds
        description: 'Filter by a list of Domains (View Boxes) ids.

          Only items stored in the listed Domains (View Boxes) are returned.'
        name: viewBoxIds
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: Domain
        description: domain of the AD object.
        name: domain
        in: query
        schema:
          type: string
      - x-go-name: TenantId
        description: TenantId specifies the tenant whose action resulted in the audit log.
        name: tenantId
        in: query
        schema:
          type: string
      - x-go-name: AllUnderHierarchy
        description: 'AllUnderHierarchy specifies if logs of all the tenants under the hierarchy

          of tenant with id TenantId should be returned.'
        name: allUnderHierarchy
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/SearchRestoredFilesResponse'
        default:
          $ref: '#/components/responses/Error'
      summary: Get ad objects
      x-summary-source: derived
  /public/restore/adObjects/status:
    get:
      description: 'Returns the Restore status of the AD objects which were restored from the

        snapshot AD to production AD as part of the restore task id specified in the

        parameters.'
      tags:
      - RestoreTasks
      operationId: AdObjectsRestoreStatus
      parameters:
      - x-go-name: RestoreTaskId
        description: 'Specifies the restoreTaskId corresponding to which we need to get

          information about the restore of the AD objects.'
        name: restoreTaskId
        in: query
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/AdObjectsRestoreStatusResponse'
        default:
          $ref: '#/components/responses/Error'
      summary: Ad objects restore status
      x-summary-source: derived
  /public/restore/applicationsClone:
    post:
      description: Returns the created Restore Task.
      tags:
      - RestoreTasks
      summary: Create a Restore Task for cloning Applications like SQL Databases
      operationId: CreateApplicationsCloneTask
      responses:
        '201':
          $ref: '#/components/responses/CreateCloneTaskResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationsRestoreTaskRequest'
        description: Request to create a Restore Task for cloning Applications like SQL DB.
        required: true
  /public/restore/applicationsRecover:
    post:
      description: Returns the created Restore Task.
      tags:
      - RestoreTasks
      summary: Create a Restore Task for recovering Applications like SQL Databases
      operationId: CreateApplicationsRecoverTask
      responses:
        '201':
          $ref: '#/components/responses/CreateRecoverTaskResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationsRestoreTaskRequest'
        description: 'Request to create a Restore Task for recovering Applications like SQL DB.

          volumes to mount points.'
        required: true
  /public/restore/clone:
    post:
      description: Returns the created Restore Task that clones VMs or a View.
      tags:
      - RestoreTasks
      summary: Create a Restore Task for cloning VMs or a View
      operationId: CreateCloneTask
      responses:
        '201':
          $ref: '#/components/responses/CreateCloneTaskResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneTaskRequest'
        description: Request to create a Restore Task for cloning VMs or a View.
        required: true
  /public/restore/clone/{id}:
    delete:
      tags:
      - RestoreTasks
      summary: Destroy a clone task with specified id
      operationId: PublicDestroyCloneTask
      parameters:
      - x-go-name: Id
        description: Specifies a unique id of the Clone Task to destroy.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/Error'
  /public/restore/deploy:
    post:
      description: 'Returns the created Restore Task that deploys VMs on cloud. This operation

        returns the target where cloud is deployed. Currently, VMs can be deployed

        in either AWS target or Azure target.'
      tags:
      - RestoreTasks
      summary: Create a Restore Task for deploying VMs or a View on cloud
      operationId: CreateDeployTask
      responses:
        '201':
          $ref: '#/components/responses/CreateDeployTaskResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployTaskRequest'
        description: Request to create a Restore Task for deploying VMs or a View on cloud.
        required: true
  /public/restore/downloadFilesAndFolders:
    post:
      description: Returns the created download Task information that downloads files and folders.
      tags:
      - RestoreTasks
      summary: Create a Download Task for downloading files and folders
      operationId: CreateDownloadFilesAndFolders
      responses:
        '201':
          $ref: '#/components/responses/CreateDownloadFilesAndFoldersResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadFilesAndFoldersParams'
        description: 'Request to create a task for downloading list of files or

          folders.'
        required: true
  /public/restore/files:
    get:
      description: 'Use the files and folders returned by this operation to populate the

        list of files and folders to recover in the

        POST /public/restore/files operation.

        If no search pattern or filter parameters are specified, all files

        and folders currently found on the Cohesity Cluster are returned.

        Specify a search pattern or parameters to filter the results that

        are returned.


        The term "items" below refers to files and folders that are found

        in the source objects (such as VMs).'
      tags:
      - RestoreTasks
      summary: Search for files and folders to recover that match the specified search and…
      operationId: SearchRestoredFiles
      parameters:
      - x-go-name: MustHaveTags
        description: Specifies tags which must be all present in the document.
        name: mustHaveTags
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: MightHaveTags
        description: 'Specifies list of tags, one of which might be present in the document.

          These are OR''ed together and the resulting criteria AND''ed with the

          rest of the query.'
        name: mightHaveTags
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: MustHaveSnapshotTags
        description: Specifies snapshot tags which must be all present in the document.
        name: mustHaveSnapshotTags
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: MightHaveSnapshotTags
        description: 'Specifies list of snapshot tags, one of which might be present in the

          document. These are OR''ed together and the resulting criteria AND''ed

          with the rest of the query.'
        name: mightHaveSnapshotTags
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: Paginate
        description: 'Specifies bool to control pagination of search results. Only valid

          for librarian queries. If this is set to true and a pagination cookie

          is provided, search will be resumed.'
        name: paginate
        in: query
        schema:
          type: boolean
      - x-go-name: PageSize
        description: 'Specifies pagesize for pagination. Only valid for librarian queries.

          Effective only when Paginate is set to true.'
        name: pageSize
        in: query
        schema:
          type: integer
          format: int32
      - x-go-name: PaginationCookie
        description: 'Specifies cookie for resuming search if pagination is being used. Only

          valid for librarian queries. Effective only when Paginate is set to true.'
        name: paginationCookie
        in: query
        schema:
          type: string
      - x-go-name: Search
        description: 'Filter by searching for sub-strings in the item name. The specified

          string can match any part of the item name.

          For example: "vm" or "123" both match the item name of "vm-123".'
        name: search
        in: query
        schema:
          type: string
      - x-go-name: JobIds
        description: 'Filter by a list of Protection Job ids.

          Only items backed up by the specified Jobs are listed.'
        name: jobIds
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: RegisteredSourceIds
        description: 'Filter by a list of Registered Sources ids. Only items

          from the listed Registered Sources are returned.'
        name: registeredSourceIds
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: ViewBoxIds
        description: 'Filter by a list of Domains (View Boxes) ids.

          Only items stored in the listed Domains (View Boxes) are returned.'
        name: viewBoxIds
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: Environments
        description: 'Filter by environment types such as ''kVMware'', ''kView'', etc.

          Only items from the specified environment types are returned.

          NOTE: ''kPuppeteer'' refers to Cohesity''s Remote Adapter.'
        name: environments
        in: query
        schema:
          type: array
          items:
            enum:
            - kVMware
            - kHyperV
            - kSQL
            - kView
            - kPuppeteer
            - kPhysical
            - kPure
            - kAzure
            - kNetapp
            - kAgent
            - kGenericNas
            - kAcropolis
            - kPhysicalFiles
            - kIsilon
            - kGPFS
            - kKVM
            - kAWS
            - kExchange
            - kHyperVVSS
            - kOracle
            - kGCP
            - kFlashBlade
            - kAWSNative
            - kVCD
            - kO365
            - kO365Outlook
            - kHyperFlex
            - kGCPNative
            - kKubernetes
            - kElastifile
            type: string
      - x-go-name: StartTimeUsecs
        description: 'Filter by backup completion time by specifying a backup

          completion start and end times. Specified as a Unix epoch

          Timestamp (in microseconds).

          Only items created by backups that completed between the

          specified start and end times are returned.'
        name: startTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: EndTimeUsecs
        description: 'Filter by backup completion time by specify a backup

          completion start and end times. Specified as a Unix epoch

          Timestamp (in microseconds).

          Only items created by backups that completed between the

          specified start and end times are returned.'
        name: endTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: StartIndex
        description: 'Specifies an index number that can be used to return subsets of items

          in multiple requests.

          Break up the items to return into multiple requests

          by setting pageCount and using startIndex to return a subsets of items.

          For example, set startIndex to 0 to get the first set of items

          for the first request. Increment startIndex by pageCount

          to get the next set of items for a next request.

          Continue until all items are returned and therefore the total number of

          returned items is equal to totalCount.'
        name: startIndex
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: PageCount
        description: 'Limit the number of items to return in the response for pagination

          purposes.'
        name: pageCount
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: SourceIds
        description: 'Filter by source ids. Only files and folders found in the listed sources

          (such as VMs) are returned.'
        name: sourceIds
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: FolderOnly
        description: 'Filter by folders or files. If true, only folders are returned.

          If false, only files are returned. If not specified, both

          files and folders are returned.'
        name: folderOnly
        in: query
        schema:
          type: boolean
      - x-go-name: TenantId
        description: TenantId specifies the tenant whose action resulted in the audit log.
        name: tenantId
        in: query
        schema:
          type: string
      - x-go-name: AllUnderHierarchy
        description: 'AllUnderHierarchy specifies if logs of all the tenants under the hierarchy

          of tenant with id TenantId should be returned.'
        name: allUnderHierarchy
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/SearchRestoredFilesResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      description: Returns the created Restore Task that recovers files and folders.
      tags:
      - RestoreTasks
      summary: Create a Restore Task for recovering files and folders
      operationId: CreateRestoreFilesTask
      responses:
        '201':
          $ref: '#/components/responses/CreateRestoreFilesTaskResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreFilesTaskRequest'
        description: Request to create a Restore Task for recovering files or folders.
        required: true
  /public/restore/files/fstats:
    get:
      tags:
      - RestoreTasks
      summary: Get the fstat information about file provided using query parameters
      operationId: GetFileFstatInformation
      parameters:
      - x-go-name: JobId
        description: 'JobId is the id of the local job that took the snapshot, which may or

          may not match the JobUidObjectId below depending on whether the object

          originally belonged to this local job or to a different remote job.'
        name: jobId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - x-go-name: JobUidObjectId
        description: 'JobUidObjectId is the globally unique id of the job that the object

          originally belonged to. If this object originally belonged to a job from a

          remote cluster, this field will contain the JobId of the remote job, else

          it will contain the JobId of the local job.'
        name: jobUidObjectId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - x-go-name: EntityId
        description: EntityId is the Id of the VM.
        name: entityId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - x-go-name: JobInstanceId
        description: JobInstanceId is the Id of the job run that backed up the entity.
        name: jobInstanceId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - x-go-name: JobStartTimeUsecs
        description: 'JobStartTimeUsecs is the start time in usecs of the job run that backed up

          the entity.'
        name: jobStartTimeUsecs
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - x-go-name: AttemptNum
        description: 'AttemptNum is the attempt number of the run that successfully created the

          snapshot.'
        name: attemptNum
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: VolumeName
        description: 'VolumeName is the name of the volume that needs to be browsed. This should

          match the name returned in VolumeInfo.'
        name: volumeName
        in: query
        schema:
          type: string
      - x-go-name: ViewBoxId
        description: Id of the View Box if a View is being browsed.
        name: viewBoxId
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: ViewName
        description: Name of the View if a View is being browsed.
        name: viewName
        in: query
        schema:
          type: string
      - x-go-name: VolumeInfoCookie
        description: 'VolumeInfoCookie is the cookie to be passed in calls to reading a VM dir

          for this volume.'
        name: volumeInfoCookie
        in: query
        schema:
          type: integer
          format: uint64
      - x-go-name: FilePath
        description: FilePath is the full path of the file or directory whose stat needed.
        name: filePath
        in: query
        required: true
        schema:
          type: string
      - x-go-name: UseLibrarian
        description: 'Specifies whether to use Librarian for file stat. This will be true if the

          browse is enabled via librarian.'
        name: useLibrarian
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/GetFileFstatInformationResponse'
        default:
          $ref: '#/components/responses/Error'
  /public/restore/files/snapshotsInformation:
    get:
      tags:
      - RestoreTasks
      summary: Get the information about snapshots that contain the specified file or folder.
      operationId: GetFileSnapshotsInformation
      parameters:
      - x-go-name: JobId
        description: 'Specifies the id of the Job that captured the snapshots.

          These snapshots are searched for the specified files or folders.

          This field is required.'
        name: jobId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - x-go-name: ClusterId
        description: 'Specifies the Cohesity Cluster id where the Job was created.

          This field is required.'
        name: clusterId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - x-go-name: ClusterIncarnationId
        description: 'Specifies the incarnation id of the Cohesity Cluster where the Job

          was created.

          An incarnation id is generated when a Cohesity Cluster is initially

          created. This field is required.'
        name: clusterIncarnationId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - x-go-name: SourceId
        description: 'Specifies the id of the Protection Source object (such as a VM) to search.

          When a Job Run executes, snapshots of the specified Protection Source

          object are captured. This operation searches the snapshots of the

          object for the file or folder. This field is required.'
        name: sourceId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - x-go-name: Filename
        description: 'Specifies the name of the file or folder to find in the snapshots.

          This field is required.'
        name: filename
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/GetFileSnapshotsInformationResponse'
        default:
          $ref: '#/components/responses/Error'
  /public/restore/objects:
    get:
      description: 'If no search pattern or filter parameters are specified, all backup objects

        currently found on the Cohesity Cluster are returned.

        Only leaf objects that have been protected by a Job are returned such as VMs,

        Views and databases.

        Specify a search pattern or parameters to filter the results that

        are returned.


        The term "items" below refers to leaf backup objects such as VMs,

        Views and databases.'
      tags:
      - RestoreTasks
      summary: Find backup objects that match the specified search and filter criteria on the…
      operationId: SearchObjects
      parameters:
      - x-go-name: Search
        description: 'Filter by searching for sub-strings in the item name. The specified

          string can match any part of the item name.

          For example: "vm" or "123" both match the item name of "vm-123".'
        name: search
        in: query
        schema:
          type: string
