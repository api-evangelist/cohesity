        description: DirPath is the full path of the directory whose contents need to be listed.
        name: dirPath
        in: query
        required: true
        schema:
          type: string
      - x-go-name: MaxEntries
        description: 'MaxEntries is the maximum number of entries to return in this call. If

          there are more entries, server will return a cookie in the response that

          can be used to continue enumeration from the last call.'
        name: maxEntries
        in: query
        schema:
          type: integer
          format: int32
      - x-go-name: VolumeInfoCookie
        description: 'VolumeInfoCookie is the cookie to be passed in calls to reading a VM dir

          for this volume.'
        name: volumeInfoCookie
        in: query
        schema:
          type: integer
          format: uint64
      - x-go-name: Cookie
        description: 'Cookie is used for paginating results. If ReadDirResult returned partial

          results, it will also return a cookie that can be used to resume the

          listing. The value returned in ReadDirResult should be passed in the next

          call. The first call should not have this value set. Note that this value

          is only a suggestion and server is free to do a short read (return fewer

          entries along with a cookie).'
