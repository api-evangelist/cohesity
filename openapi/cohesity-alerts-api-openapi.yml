openapi: 3.2.0
info:
  description: 'This API list provides operations for interfacing with the Cohesity

    Cluster.'
  title: Cohesity REST Alerts API
  version: '1.0'
servers:
- url: https://<CLUSTER_VIP>/irisservices/api/v1
tags:
- name: Alerts
paths:
  /public/alertCategories:
    get:
      description: Returns alert categories in Cohesity cluster.
      tags:
      - Alerts
      summary: Get alert categories in the Cohesity cluster
      operationId: GetAlertCategories
      responses:
        '200':
          $ref: '#/components/responses/GetAlertCategoriesResponse'
        default:
          $ref: '#/components/responses/Error'
  /public/alertNotificationRules:
    get:
      description: 'Gets all alert notification rules containing criteria to deliver notification

        to delivery targets such as email addresses, invoking external apis etc.'
      tags:
      - Alerts
      summary: Gets all alert notification rules
      operationId: GetNotificationRules
      responses:
        '200':
          $ref: '#/components/responses/GetNotificationRulesResponse'
        default:
          $ref: '#/components/responses/Error'
    put:
      description: 'Updates delivery targets such as email addresses and external apis in an

        existing notification rule.'
      tags:
      - Alerts
      summary: Updates an existing alert notification rule
      operationId: UpdateNotificationRule
      responses:
        '200':
          $ref: '#/components/responses/UpdateNotificationRulesResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      description: 'Creates a new notification rule with provided delivery targets such as email

        addresses and external apis.'
      tags:
      - Alerts
      summary: Creates a new alert notification rule
      operationId: CreateNotificationRule
      responses:
        '201':
          $ref: '#/components/responses/CreateNotificationRulesResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRule'
        description: Create Notification Rule argument.
  /public/alertNotificationRules/{ruleId}:
    delete:
      description: Deletes an existing alert notification rule matching the rule id.
      tags:
      - Alerts
      summary: Deletes an alert notification rule
      operationId: DeleteNotificationRule
      parameters:
      - x-go-name: RuleId
        description: Specifies the rule id.
        name: ruleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/Error'
  /public/alertResolutions:
    get:
      description: 'Returns all Alert Resolution objects found on the Cohesity Cluster

        that match the filter criteria specified using parameters.

        If no filter parameters are specified,

        all Alert Resolution objects are returned.

        Each object provides details about the Alert Resolution such as

        the resolution summary and details.'
      tags:
      - Alerts
      summary: List the Alert Resolutions on the Cohesity Cluster
      operationId: GetResolutions
      parameters:
      - x-go-name: ResolutionIdList
        description: Specifies list of Alert Resolution ids to filter resolutions by.
        name: resolutionIdList
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: AlertIdList
        description: Specifies list of Alert Resolution ids to filter resolutions by.
        name: alertIdList
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: StartTimeUsecs
        description: Specifies Start Time Unix epoch in microseconds to filter resolutions by.
        name: startDateUsecs
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: EndTimeUsecs
        description: Specifies End Time Unix epoch in microseconds to filter resolutions by.
        name: endDateUsecs
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: MaxResolutions
        description: 'Specifies the number of returned Resolutions to be returned. The newest

          Resolutions are returned.'
        name: maxResolutions
        in: query
        required: true
        schema:
          type: integer
          format: int32
      - x-go-name: TenantIds
        description: 'TenantIds contains ids of the tenants for which objects are to be

          returned.'
        name: tenantIds
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: AllUnderHierarchy
        description: 'AllUnderHierarchy specifies if objects of all the tenants under the

          hierarchy of the logged in user''s organization should be returned.'
        name: allUnderHierarchy
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/GetResolutionsResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      description: 'Create an Alert Resolution and apply it to one or more Alerts.

        Mark the Alerts as resolved.'
      tags:
      - Alerts
      summary: Create an Alert Resolution
      operationId: CreateResolution
      responses:
        '201':
          $ref: '#/components/responses/CreateResolutionResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertResolutionRequest'
        description: Request to create an Alert Resolution and apply it to the specified Alerts.
        required: true
  /public/alertResolutions/{id}:
    get:
      description: 'Returns the Alert Resolution object corresponding to passed in Alert

        Resolution Id.'
      tags:
      - Alerts
      summary: List details about a single Alert Resolution
      operationId: GetResolutionById
      parameters:
      - x-go-name: Id
        description: Unique id of the Alert Resolution to return.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/GetResolutionByIdResponse'
        default:
          $ref: '#/components/responses/Error'
    put:
      description: 'Apply an existing Alert Resolution to one or more additional Alerts.

        Mark those additional Alerts as resolved.'
      tags:
      - Alerts
      summary: Apply an existing Alert Resolution to additional Alerts
      operationId: UpdateResolution
      parameters:
      - x-go-name: Id
        description: Unique id of the Alert Resolution to return.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/UpdateResolutionResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResolutionParams'
        description: Request to apply an existing resolution to the specified Alerts.
        required: true
  /public/alertTypes:
    get:
      description: 'Returns registered alerts in the Cohesity cluster that match the filter

        criteria specified using parameters. If no filter parameters are specified,

        all registered alerts in the Cohesity cluster are returned.'
      tags:
      - Alerts
      summary: Get registered alerts in the Cohesity cluster
      operationId: GetAlertTypes
      responses:
        '200':
          $ref: '#/components/responses/GetAlertTypesResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetAlertTypesParams'
        description: Get alert types params.
        required: true
  /public/alerts:
    get:
      description: 'Returns all Alert objects found on the Cohesity Cluster that

        match the filter criteria specified using parameters.

        The Cohesity Cluster creates an Alert when a potential problem

        is found or when a threshold has been exceeded on the Cohesity Cluster.

        If no filter parameters are specified, all Alert objects are returned.

        Each object provides details about the Alert such as the Status and Severity.'
      tags:
      - Alerts
      summary: List the Alerts on the Cohesity Cluster
      operationId: GetAlerts
      parameters:
      - x-go-name: AlertIdList
        description: Specifies list of Alert ids to filter alerts by.
        name: alertIdList
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: AlertTypeList
        description: Specifies list of Alert Types to filter alerts by.
        name: alertTypeList
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int32
      - x-go-name: AlertCategoryList
        description: Specifies list of Alert Categories.
        name: alertCategoryList
        in: query
        schema:
          type: array
          items:
            enum:
            - kDisk
            - kNode
            - kCluster
            - kNodeHealth
            - kClusterHealth
            - kBackupRestore
            - kEncryption
            - kArchivalRestore
            - kRemoteReplication
            - kQuota
            type: string
      - x-go-name: PropertyKey
        description: Specifies name of the property to filter alerts by.
        name: propertyKey
        in: query
        schema:
          type: string
      - x-go-name: PropertyValue
        description: Specifies value of the property to filter alerts by.
        name: propertyValue
        in: query
        schema:
          type: string
      - x-go-name: StartTimeUsecs
        description: Specifies start time Unix epoch time in microseconds to filter alerts by.
        name: startDateUsecs
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: EndTimeUsecs
        description: Specifies end time Unix epoch time in microseconds to filter alerts by.
        name: endDateUsecs
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: AlertStateList
        description: Specifies list of Alert States to filter alerts by.
        name: alertStateList
        in: query
        schema:
          type: array
          items:
            enum:
            - kOpen
            - kResolved
            - kAlertSuppressed
            type: string
      - x-go-name: AlertSeverityList
        description: Specifies list of Alert severity to filter alerts by.
        name: alertSeverityList
        in: query
        schema:
          type: array
          items:
            enum:
            - kCritical
            - kWarning
            - kInfo
            type: string
      - x-go-name: AlertTypeBucketList
        description: 'Specifies the list of Alert type bucket.

          Specifies the Alert type bucket.

          kSoftware - Alerts which are related to Cohesity services.

          kHardware - Alerts related to hardware on which Cohesity software is running.

          kService - Alerts related to other external services.

          kOther - Alerts not of one of above categories.'
        name: alertTypeBucketList
        in: query
        schema:
          type: array
          items:
            enum:
            - kSoftware
            - kHardware
            - kService
            - kOther
            type: string
      - x-go-name: ResolutionIdList
        description: Specifies alert resolution ids to filter alerts by.
        name: resolutionIdList
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: MaxAlerts
        description: 'Specifies the number of returned Alerts to be returned. The newest Alerts

          are returned.'
        name: maxAlerts
        in: query
        required: true
        schema:
          type: integer
          format: int32
      - x-go-name: TenantIds
        description: 'TenantIds contains ids of the tenants for which objects are to be

          returned.'
        name: tenantIds
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: AllUnderHierarchy
        description: 'AllUnderHierarchy specifies if objects of all the tenants under the

          hierarchy of the logged in user''s organization should be returned.'
        name: allUnderHierarchy
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/GetAlertsResponse'
        default:
          $ref: '#/components/responses/Error'
  /public/alerts/{id}:
    get:
      description: Returns the Alert object corresponding to the specified id.
      tags:
      - Alerts
      summary: List details about a single Alert
      operationId: GetAlertById
      parameters:
      - x-go-name: Id
        description: Unique id of the Alert to return.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/GetAlertByIdResponse'
        default:
          $ref: '#/components/responses/Error'
components:
  schemas:
    RequestError:
      description: Details about the Error.
      type: object
      title: Error
      properties:
        errorCode:
          description: Operation response error code.
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: ErrorCode
        message:
          description: Description of the error.
          type:
          - string
          - 'null'
          x-go-name: Message
      x-go-package: cohesity/iris/server/data/public
    WebHookDeliveryTarget:
      description: 'WebHookDeliveryTarget

        Specifies the external api url to hit along with the related options for it.'
      type: object
      properties:
        curlOptions:
          description: Specifies curl options used to invoke external api url defined above.
          type:
          - string
          - 'null'
          x-go-name: CurlOptions
        externalApiUrl:
          type:
          - string
          - 'null'
          x-go-name: ExternalApiUrl
      x-go-package: cohesity/iris/server/data/public
    AlertResolution:
      description: 'Provides Resolution details and the list of Alerts resolved by a Resolution,

        which are specified by Alert Ids.'
      type: object
      title: Alert Resolution.
      properties:
        alertIdList:
          description: 'Specifies list of Alerts resolved by a Resolution, which are specified by

            Alert Ids.'
          type:
          - array
          - 'null'
          items:
            type: string
          x-go-name: AlertIdList
        resolutionDetails:
          description: 'Specifies information about the Alert Resolution such as a summary,

            id assigned by the Cohesity Cluster, user who resolved the Alerts, etc.'
          $ref: '#/components/schemas/AlertResolutionDetails'
        tenantIds:
          description: Specifies unique tenantIds of the alert contained in this resolution.
          type:
          - array
          - 'null'
          items:
            type: string
          x-go-name: TenantIds
      x-go-package: cohesity/iris/server/data/public
    EmailDeliveryTarget:
      description: 'EmailDeliveryTarget

        Specifies the email address and the locale setting for it.'
      type: object
      properties:
        emailAddress:
          type:
          - string
          - 'null'
          x-go-name: EmailAddress
        locale:
          description: 'Specifies the language in which the emails sent to the above defined

            mail address should be in.'
          type:
          - string
          - 'null'
          x-go-name: Locale
        recipientType:
          description: Specifies the recipient type on how the emails are to received.
          type:
          - integer
          - 'null'
          format: int32
          x-go-name: RecipientType
      x-go-package: cohesity/iris/server/data/public
    GetAlertTypesParams:
      description: Specifies params to get alert types.
      type: object
      title: Get Alert Types Params.
      properties:
        alertCategoryList:
          description: 'Specifies a list of Alert Categories to filter alert types by.

            Specifies the category of an Alert.

            kDisk - Alerts that are related to Disk.

            kNode - Alerts that are related to Node.

            kCluster - Alerts that are related to Cluster.

            kNodeHealth - Alerts that are related to Node Health.

            kClusterHealth - Alerts that are related to Cluster Health.

            kBackupRestore - Alerts that are related to Backup/Restore.

            kEncryption - Alerts that are related to Encryption.

            kArchivalRestore - Alerts that are related to Archival/Restore.

            kRemoteReplication - Alerts that are related to Remote Replication.

            kQuota - Alerts that are related to Quota.

            kLicense - Alerts that are related to License.

            kHeliosProActiveWellness - Alerts that are related to Helios ProActive Wellness.

            kHeliosAnalyticsJobs - Alerts that are related to Helios Analytics Jobs.

            kHeliosSignatureJobs - Alerts that are related to Helios Signature Jobs.

            kSecurity - Alerts that are related to Security.

            kAppsInfra - Alerts that are related to applications infra.

            kAntivirus - Alerts that are related to antivirus.

            kArchivalCopy - Alerts that are related to archival copies.'
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - kDisk
            - kNode
            - kCluster
            - kNodeHealth
            - kClusterHealth
            - kBackupRestore
            - kEncryption
            - kArchivalRestore
            - kRemoteReplication
            - kQuota
            - kLicense
            - kHeliosProActiveWellness
            - kHeliosAnalyticsJobs
            - kHeliosSignatureJobs
            - kSecurity
            - kAppsInfra
            - kAntivirus
            - kArchivalCopy
          x-go-name: AlertCategoryList
      x-go-package: cohesity/iris/server/data/public
    UpdateResolutionParams:
      description: 'Apply an existing Resolution to a new list of Alerts, which are specified by

        Alert Ids.'
      type: object
      title: Update Alert Resolution Request.
      properties:
        alertIdList:
          description: Specifies the Alerts to resolve, which are specified by Alert Ids.
          type:
          - array
          - 'null'
          items:
            type: string
          x-go-name: AlertIdList
      x-go-package: cohesity/iris/server/data/public
    AlertResolutionInfo:
      description: Short description and detailed notes about the Resolution.
      type: object
      title: Alert Resolution Info.
      properties:
        resolutionDetails:
          description: Specifies detailed notes about the Resolution.
          type:
          - string
          - 'null'
          x-go-name: ResolutionDetails
        resolutionSummary:
          description: Specifies short description about the Resolution.
          type:
          - string
          - 'null'
          x-go-name: ResolutionSummary
      x-go-package: cohesity/iris/server/data/public
    AlertMetadata:
      description: 'AlertMetadata specifies metadata for a given alert type. All the alerts of a

        given alert type share the same metadata.'
      type: object
      title: Alert Metadata
      properties:
        alertDocumentList:
          description: Specifies alert documentation one per each language supported.
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AlertDocument'
          x-go-name: AlertDocumentList
        alertTypeBucket:
          description: 'Specifies the Alert type bucket.

            Specifies the Alert type bucket.

            kSoftware - Alerts which are related to Cohesity services.

            kHardware - Alerts related to hardware on which Cohesity software is running.

            kService - Alerts related to other external services.

            kOther - Alerts not of one of above categories.'
          type:
          - string
          - 'null'
          enum:
          - kSoftware
          - kHardware
          - kService
          - kOther
          x-go-name: AlertTypeBucket
        alertTypeId:
          description: Specifies unique id for the alert type.
          type:
          - integer
          - 'null'
          format: int32
          x-go-name: AlertTypeId
        category:
          description: 'Specifies category of the alert type.

            Specifies the category of an Alert.

            kDisk - Alerts that are related to Disk.

            kNode - Alerts that are related to Node.

            kCluster - Alerts that are related to Cluster.

            kNodeHealth - Alerts that are related to Node Health.

            kClusterHealth - Alerts that are related to Cluster Health.

            kBackupRestore - Alerts that are related to Backup/Restore.

            kEncryption - Alerts that are related to Encryption.

            kArchivalRestore - Alerts that are related to Archival/Restore.

            kRemoteReplication - Alerts that are related to Remote Replication.

            kQuota - Alerts that are related to Quota.

            kLicense - Alerts that are related to License.

            kHeliosProActiveWellness - Alerts that are related to Helios ProActive Wellness.

            kHeliosAnalyticsJobs - Alerts that are related to Helios Analytics Jobs.

            kHeliosSignatureJobs - Alerts that are related to Helios Signature Jobs.

            kSecurity - Alerts that are related to Security.

            kAppsInfra - Alerts that are related to applications infra.

            kAntivirus - Alerts that are related to antivirus.

            kArchivalCopy - Alerts that are related to archival copies.'
          type:
          - string
          - 'null'
          enum:
          - kDisk
          - kNode
          - kCluster
          - kNodeHealth
          - kClusterHealth
          - kBackupRestore
          - kEncryption
          - kArchivalRestore
          - kRemoteReplication
          - kQuota
          - kLicense
          - kHeliosProActiveWellness
          - kHeliosAnalyticsJobs
          - kHeliosSignatureJobs
          - kSecurity
          - kAppsInfra
          - kAntivirus
          - kArchivalCopy
          x-go-name: Category
        dedupIntervalSeconds:
          description: 'Specifies dedup interval in seconds. If the same alert is raised multiple

            times by any client in this duration, only one of them will be reported.'
          type:
          - integer
          - 'null'
          format: int32
          x-go-name: DedupIntervalSeconds
        dedupUntilResolved:
          description: 'Specifies if the alerts are to be deduped until the current one (if

            any) is resolved.'
          type:
          - boolean
          - 'null'
          x-go-name: DedupUntilResolved
        hideAlertFromUser:
          description: Specifies whether to show the alert in the iris UI and CLI.
          type:
          - boolean
          - 'null'
          x-go-name: HideAlertFromUser
        ignoreDuplicateOccurrences:
          description: Specifies whether to ignore duplicate occurrences completely.
          type:
          - boolean
          - 'null'
          x-go-name: IgnoreDuplicateOccurrences
        primaryKeyList:
          description: Specifies properties that serve as primary keys.
          type:
          - array
          - 'null'
          items:
            type: string
          x-go-name: PrimaryKeyList
        propertyList:
          description: 'Specifies list of properties that the client is supposed to provide when

            alert of this type is raised.'
          type:
          - array
          - 'null'
          items:
            type: string
          x-go-name: PropertyList
        sendSupportNotification:
          description: Specifies whether to send support notification for the alert.
          type:
          - boolean
          - 'null'
          x-go-name: SendSupportNotification
        snmpNotification:
          description: Specifies whether an SNMP notification is sent when an alert is raised.
          type:
          - boolean
          - 'null'
          x-go-name: SnmpNotification
        syslogNotification:
          description: Specifies whether an syslog notification is sent when an alert is raised.
          type:
          - boolean
          - 'null'
          x-go-name: SyslogNotification
        version:
          description: Specifies version of the metadata.
          type:
          - integer
          - 'null'
          format: int32
          x-go-name: Version
      x-go-package: cohesity/iris/server/data/public
    Alert:
      description: 'Specifies information about an Alert such as the type, id assigned by

        the Cohesity Cluster, number of duplicates, severity, etc.'
      type: object
      title: Alert.
      properties:
        alertCategory:
          description: 'Specifies the category of an Alert.

            kDisk - Alerts that are related to Disk.

            kNode - Alerts that are related to Node.

            kCluster - Alerts that are related to Cluster.

            kNodeHealth - Alerts that are related to Node Health.

            kClusterHealth - Alerts that are related to Cluster Health.

            kBackupRestore - Alerts that are related to Backup/Restore.

            kEncryption - Alerts that are related to Encryption.

            kArchivalRestore - Alerts that are related to Archival/Restore.

            kRemoteReplication - Alerts that are related to Remote Replication.

            kQuota - Alerts that are related to Quota.

            kLicense - Alerts that are related to License.

            kHeliosProActiveWellness - Alerts that are related to Helios ProActive Wellness.

            kHeliosAnalyticsJobs - Alerts that are related to Helios Analytics Jobs.

            kHeliosSignatureJobs - Alerts that are related to Helios Signature Jobs.

            kSecurity - Alerts that are related to Security.

            kAppsInfra - Alerts that are related to applications infra.

            kAntivirus - Alerts that are related to antivirus.

            kArchivalCopy - Alerts that are related to archival copies.'
          type:
          - string
          - 'null'
          enum:
          - kDisk
          - kNode
          - kCluster
          - kNodeHealth
          - kClusterHealth
          - kBackupRestore
          - kEncryption
          - kArchivalRestore
          - kRemoteReplication
          - kQuota
          - kLicense
          - kHeliosProActiveWellness
          - kHeliosAnalyticsJobs
          - kHeliosSignatureJobs
          - kSecurity
          - kAppsInfra
          - kAntivirus
          - kArchivalCopy
          x-go-name: AlertCategory
        alertCode:
          description: 'Specifies a unique code that categorizes the Alert,

            for example: CE00200014, where CE stands for Cohesity Error, the alert

            state next 3 digits is the id of the Alert Category

            (e.g. 002 for ''kNode'') and the last 5 digits is the id of

            the Alert Type (e.g. 00014 for ''kNodeHighCpuUsage'').'
          type:
          - string
          - 'null'
          x-go-name: AlertCode
        alertDocument:
          description: 'Specifies documentation about the Alert such as name, description, cause

            and how to resolve the Alert.'
          $ref: '#/components/schemas/AlertDocument'
        alertState:
          description: 'Specifies the current state of the Alert.

            kAlertNote - Alerts that are just for note.

            kAlertOpen - Alerts that are unresolved.

            kAlertResolved - Alerts that are already marked as resolved.

            kAlertSuppressed - Alerts that are suppressed due to snooze settings.'
          type:
          - string
          - 'null'
          enum:
          - kNote
          - kOpen
          - kResolved
          - kSuppressed
          x-go-name: AlertState
        alertType:
          description: 'Specifies a 5 digit unique digital id for the Alert Type, such as 00014

            for ''kNodeHighCpuUsage''. This id is used in alertCode.'
          type:
          - integer
          - 'null'
          format: int32
          x-go-name: AlertType
        alertTypeBucket:
          description: 'Specifies the Alert type bucket.

            Specifies the Alert type bucket.

            kSoftware - Alerts which are related to Cohesity services.

            kHardware - Alerts related to hardware on which Cohesity software is running.

            kService - Alerts related to other external services.

            kOther - Alerts not of one of above categories.'
          type:
          - string
          - 'null'
          enum:
          - kSoftware
          - kHardware
