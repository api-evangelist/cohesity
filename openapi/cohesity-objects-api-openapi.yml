  /objects/operations:
    post:
      description: 'Privileges: DRAAS_MODIFY


        Initiate operations to check, gather information and

        perform computations using objects.'
      tags:
      - Objects
      summary: Initiates asynchronous operations
      operationId: SCCreateObjectsOperation
      responses:
        201:
          $ref: '#/components/responses/SCCreateObjectsOperationResponse'
        default:
          $ref: '#/components/responses/SCErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SCCreateObjectsOperationParams'
        description: Specifies the parameters to perform operation using objects.
        required: true
      security:
      - ApiKeyAuth: []
    servers:
    - url: https://helios.cohesity.com/v2/mcm/site-continuity/v2
  /objects/operations/{operationId}:
    get:
      description: 'Privileges: DRAAS_VIEW


        Get results of operation using objects.'
      tags:
      - Objects
      summary: Returns an operation by ID
      operationId: SCGetObjectsOperationResults
      parameters:
      - name: operationId
        description: Specifies the operation id to track the progress of operation performed using objects.
        in: path
        required: true
        schema:
          type: string
      responses:
        200:
          $ref: '#/components/responses/SCGetObjectsOperationResultsResponse'
        default:
          $ref: '#/components/responses/SCErrorResponse'
      security:
      - ApiKeyAuth: []
    servers:
    - url: https://helios.cohesity.com/v2/mcm/site-continuity/v2
components:
  schemas:
    AwsCloudSpinParams:
      description: Specifies various resources when converting and deploying a VM to AWS.
      type: object
      title: AWS Parameters.
      required:
      - region
      properties:
        region:
          description: Specifies id of the AWS region in which to deploy the VM.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 0
        vpcId:
          description: Specifies id of the Virtual Private Cloud to chose for the instance type.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 1
        subnetId:
          description: Specifies id of the subnet within above VPC.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 2
    CommonVmwareObjectParams:
      description: Specifies the common object parameters required for VMware protection.
      type: object
      properties:
        excludeDisks:
          description: Specifies a list of disks to exclude from being protected. This is only applicable to VM objects.
          type: array
          items:
            $ref: '#/components/schemas/DiskInfo'
          x-order: 0
        truncateExchangeLogs:
          description: Specifies whether or not to truncate MS Exchange logs while taking an app consistent snapshot of this object. This is only applicable to objects which have a registered MS Exchange app.
          type:
          - boolean
          - 'null'
          x-order: 1
    CommonPostBackupScriptParams:
      description: Specifies the common params for PostBackup scripts.
      title: Common PostBackup Script Params
      allOf:
      - $ref: '#/components/schemas/CommonPrePostScriptParams'
    AzureTargetConfig:
      description: Specifies the configuration for adding Azure as replication target
      type: object
      title: Azure Target Configuration
      required:
      - sourceId
      properties:
        sourceId:
          description: Specifies the source id of the Azure protection source registered on Cohesity cluster.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 0
        name:
          description: Specifies the name of the Azure Replication target.
          type:
          - string
          - 'null'
          x-order: 1
          readOnly: true
        resourceGroup:
          description: Specifies id of the Azure resource group used to filter regions in UI.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 2
        resourceGroupName:
          description: Specifies name of the Azure resource group used to filter regions in UI.
          type:
          - string
          - 'null'
          x-order: 3
          readOnly: true
        storageAccount:
          description: Specifies id of the storage account of Azure replication target which will contain storage container.
          type:
          - integer
          - 'null'
          x-order: 4
          readOnly: true
        storageAccountName:
          description: Specifies name of the storage account of Azure replication target which will contain storage container.
          type:
          - string
          - 'null'
          x-order: 5
          readOnly: true
        storageContainer:
          description: Specifies id of the storage container of Azure Replication target.
          type:
          - integer
          - 'null'
          x-order: 6
          readOnly: true
        storageContainerName:
          description: Specifies name of the storage container of Azure Replication target.
          type:
          - string
          - 'null'
          x-order: 7
          readOnly: true
        storageResourceGroup:
          description: Specifies id of the storage resource group of Azure Replication target.
          type:
          - integer
          - 'null'
          x-order: 8
          readOnly: true
        storageResourceGroupName:
          description: Specifies name of the storage resource group of Azure Replication target.
          type:
          - string
          - 'null'
          x-order: 9
          readOnly: true
    Object:
      description: Specifies information about an object.
      title: Object information
      allOf:
      - $ref: '#/components/schemas/CommonObjectSummary'
      - type: object
        properties:
          vmwareParams:
            description: Specifies the parameters which are specific to VMware objects.
            type:
            - object
            - 'null'
            x-cohesity-discriminator-value: kVMware
            x-order: 0
            $ref: '#/components/schemas/VmwareObjectEntityParams'
          isilonParams:
            description: Specifies the parameters for Isilon object.
            allOf:
            - $ref: '#/components/schemas/IsilonObjectParams'
            - {}
            x-order: 1
          netappParams:
            description: Specifies the parameters for NetApp object.
            allOf:
            - $ref: '#/components/schemas/NetappObjectParams'
            - {}
            x-order: 2
          genericNasParams:
            description: Specifies the parameters for GenericNas object.
            allOf:
            - $ref: '#/components/schemas/CommonNasObjectParams'
            - {}
            x-order: 3
          flashbladeParams:
            description: Specifies the parameters for Flashblade object.
            allOf:
            - $ref: '#/components/schemas/FlashbladeObjectParams'
            - {}
            x-order: 4
          elastifileParams:
            description: Specifies the parameters for Elastifile object.
            allOf:
            - $ref: '#/components/schemas/CommonNasObjectParams'
            - {}
            x-order: 5
          gpfsParams:
            description: Specifies the parameters for GPFS object.
            allOf:
            - $ref: '#/components/schemas/CommonNasObjectParams'
            - {}
            x-order: 6
          mssqlParams:
            description: Specifies the parameters for Msssql object.
            allOf:
            - $ref: '#/components/schemas/MssqlObjectEntityParams'
            - {}
            x-order: 7
          oracleParams:
            description: Specifies the parameters for Oracle object.
            allOf:
            - $ref: '#/components/schemas/OracleObjectEntityParams'
            - {}
            x-order: 8
    FlashbladeObjectParams:
      description: Specifies the common parameters for Flashblade objects.
      type: object
      properties:
        supportedNasMountProtocols:
          description: Specifies a list of NAS mount protocols supported by this object.
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - kNfs
            - kCifs2
            - kHttp
          x-order: 0
    RecoveryTimeRangeInfo:
      description: Specifies a valid time range to which this object can be recovered.
      type: object
      title: Time range.
      properties:
        startTimeUsecs:
          description: Specifies the start time of this time range.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 0
        endTimeUsecs:
          description: Specifies the end time of this time range.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 1
        protectionGroupId:
          description: Specifies id of the Protection Group corresponding to this time range.
          type:
          - string
          - 'null'
          pattern: ^\d+:\d+:\d+$
          x-order: 2
    Group:
      description: Specifies a user group object.
      type: object
      title: User Group
      properties:
        name:
          description: Specifies the name of the user group.
          type:
          - string
          - 'null'
          x-order: 0
        sid:
          description: Specifies the sid of the user group.
          type:
          - string
          - 'null'
          x-order: 1
        domain:
          description: Specifies the domain of the user group.
          type:
          - string
          - 'null'
          x-order: 2
    ObjectTypeVCenterParams:
      type: object
      title: Object Type VCenter Params
      properties:
        isCloudEnv:
          description: Specifies that registered vCenter source is a VMC (VMware Cloud) environment or not.
          type:
          - boolean
          - 'null'
          x-order: 0
    CommonObjectsActionParams:
      description: Specifies the comon action params needed for performing bulk actions on list of objects.
      type: object
      properties:
        objectMap:
          description: Specifies the objectMap that will be used to perform bulk actions such as linking and unlinking.
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ActionObjectMapping'
          x-order: 0
    IndexedObjectSnapshot:
      description: Specifies a snapshot containing the indexed object.
      type: object
      properties:
        indexedObjectName:
          description: Specifies the indexed object name.
          type:
          - string
          - 'null'
          x-order: 0
        objectSnapshotid:
          description: Specifies snapshot id of the object containing this indexed object.
          type:
          - string
          - 'null'
          x-order: 1
        snapshotTimestampUsecs:
          description: Specifies a unix timestamp when the object snapshot was taken in micro seconds.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 2
        runType:
          description: Specifies the type of protection run created this snapshot.
          type:
          - string
          - 'null'
          enum:
          - kRegular
          - kFull
          - kLog
          - kSystem
          - kHydrateCDP
          x-order: 3
        protectionGroupId:
          description: Specifies the protection group id which contains this snapshot.
          type:
          - string
          - 'null'
          x-order: 4
        protectionGroupName:
          description: Specifies the protection group name which contains this snapshot.
          type:
          - string
          - 'null'
          x-order: 5
        storageDomainId:
          description: Specifies the storage domain id containing this snapshot.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 6
        attempts:
          description: Specifies the number of runs have been executed before the run completed successfully.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 7
        sizeBytes:
          description: Specifies the indexed object size in bytes.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 8
        lastModifiedTimeUsecs:
          description: Specifies the last time file was modified in unix timestamp.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 9
        externalTargetInfo:
          description: Specifies the external target information if this is an archival snapshot.
          allOf:
          - $ref: '#/components/schemas/ArchivalTargetSummaryInfo'
          - {}
          x-order: 10
    CommonMSSQLProtectionGroupParams:
      description: Specifies the common params to create a MSSQL Protection Group.
      type: object
      title: Common MSSQL Protection Group Request Params.
      properties:
        userDbBackupPreferenceType:
          description: Specifies the preference type for backing up user databases on the host.
          type:
          - string
          - 'null'
          enum:
          - kBackupAllDatabases
          - kBackupAllExceptAAGDatabases
          - kBackupOnlyAAGDatabases
          x-order: 0
        backupSystemDbs:
          description: Specifies whether to backup system databases. If not specified then parameter is set to true.
          type:
          - boolean
          - 'null'
          x-order: 1
        useAagPreferencesFromServer:
          description: Specifies whether or not the AAG backup preferences specified on the SQL Server host should be used.
          type:
          - boolean
          - 'null'
          x-order: 2
        aagBackupPreferenceType:
          description: Specifies the preference type for backing up databases that are part of an AAG. If not specified, then default preferences of the AAG server are applied. This field wont be applicable if user DB preference is set to skip AAG databases.
          type:
          - string
          - 'null'
          enum:
          - kPrimaryReplicaOnly
          - kSecondaryReplicaOnly
          - kPreferSecondaryReplica
          - kAnyReplica
          x-order: 3
        fullBackupsCopyOnly:
          description: Specifies whether full backups should be copy-only.
          type:
          - boolean
          - 'null'
          x-order: 4
        prePostScript:
          description: Specifies the pre and post script parameters associated with a protection group.
          type:
          - object
          - 'null'
          x-order: 5
          $ref: '#/components/schemas/PrePostScriptParams'
        excludeFilters:
          description: Specifies the list of exclusion filters applied during the group creation or edit. These exclusion filters can be wildcard supported strings or regular expressions. Objects satisfying the will filters will be excluded during backup and also auto protected objects will be ignored if filtered by any of the filters.
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Filter'
          x-order: 6
    CommonMssqlFileObjectProtectionParams:
      description: Specifies the common params to create a File based MSSQL Object Protection.
      allOf:
      - $ref: '#/components/schemas/CommonMSSQLProtectionGroupParams'
    GoogleTiers:
      description: Specifies Google tiers.
      type: object
      required:
      - tiers
      properties:
        tiers:
          description: Specifies the tiers that are used to move the archived backup from current tier to next tier. The order of the tiers determines which tier will be used next for moving the archived backup. The first tier input should always be default tier where backup will be acrhived. Each tier specifies how much time after the backup will be moved to next tier from the current tier.
          type:
          - array
          - 'null'
          minLength: 1
          items:
            $ref: '#/components/schemas/GoogleTier'
          x-order: 0
    CommonObjectSummary:
      description: Specifies an Common summary properties for an object.
      type: object
      title: Common Object Entity Summary.
