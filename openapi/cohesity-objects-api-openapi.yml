openapi: 3.2.0
info:
  title: Cohesity Objects API
  version: '1.0'
  description: 'Operations tagged Objects across 2 of this provider''s published API definitions: cohesity-cluster-v2-openapi-original.yml, cohesity-site-continuity-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /v2
- url: https://helios.cohesity.com/v2/mcm/site-continuity/v2
tags:
- name: Objects
paths:
  /data-protect/objects:
    get:
      description: Get Objects Configurations.
      tags:
      - Objects
      summary: Get Objects
      operationId: GetProtectedObjectsOfAnyType
      parameters:
      - description: Filter by a list of Object ids.
        name: ids
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - description: Filter by Policy ids that are associated with Protected Objects.
        name: policyIds
        in: query
        schema:
          type: array
          items:
            type: string
      - description: Filter by Parent Id. Parent id is a unique object Id which may contain protected objects underneath in the source tree.
        name: parentId
        in: query
        schema:
          type: integer
          format: int64
      - description: If true, the response will include only objects which have been protected.
        name: onlyProtectedObjects
        in: query
        schema:
          type: boolean
      - description: Filter by Storage Domain id. Only Objects protected to this Storage Domain will be returned.
        name: storageDomainId
        in: query
        schema:
          type: integer
          format: int64
      - description: Filter by environment types such as 'kVMware', 'kView', etc. Only Protected objects protecting the specified environment types are returned.
        name: environments
        in: query
        schema:
          type: array
          items:
            enum:
            - kVMware
            - kHyperV
            - kAzure
            - kGCP
            - kKVM
            - kAcropolis
            - kAWS
            - kPhysical
            - kGPFS
            - kElastifile
            - kNetapp
            - kGenericNas
            - kIsilon
            - kFlashBlade
            - kPure
            - kSQL
            - kExchange
            - kAD
            - kOracle
            - kView
            - kRemoteAdapter
            - kO365
            - kKubernetes
            - kCassandra
            - kMongoDB
            - kCouchbase
            - kHdfs
            - kHive
            - kHBase
            - kUDA
            type: string
      - description: TenantIds contains ids of the tenants for which objects are to be returned.
        name: tenantIds
        in: query
        schema:
          type: array
          items:
            type: string
      - description: If true, the response will include Objects which were protected by all tenants which the current user has permission to see. If false, then only objects protected by the current user will be returned.
        name: includeTenants
        in: query
        schema:
          type: boolean
      - description: If true, the response will include information about the last protection run on this object.
        name: includeLastRunInfo
        in: query
        schema:
          type: boolean
      - description: If true, the response will include only the auto protected objects.
        name: onlyAutoProtectedObjects
        in: query
        schema:
          type: boolean
      - description: If true, the response will include only the leaf level objects.
        name: onlyLeafObjects
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/GetProtectedObjectsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    servers:
    - url: /v2
  /data-protect/objects/actions:
    post:
      description: Specifies the request to perform various actions on multiple objects.
      tags:
      - Objects
      summary: Actions on Objects
      operationId: ObjectsActions
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectsActionRequest'
        description: Specifies the paramteres to execute actions on given list of objects.
        required: true
    servers:
    - url: /v2
  /data-protect/objects/last-run:
    get:
      description: Get last protection run of objects.
      tags:
      - Objects
      summary: Get last protection run of objects
      operationId: GetObjectsLastRun
      parameters:
      - description: Specifies a list of object ids, only last runs for these objects will be returned.
        name: ids
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - description: TenantIds contains ids of the tenants for which objects are to be returned.
        name: tenantIds
        in: query
        schema:
          type: array
          items:
            type: string
      - description: If true, the response will include Objects which belongs to all tenants which the current user has permission to see.
        name: includeTenants
        in: query
        schema:
          type: boolean
      - description: Specifies the pagination cookie with which subsequent parts of the response can be fetched.
        name: paginationCookie
        in: query
        schema:
          type: string
      - description: Specifies the number of objects to be fetched for the specified pagination cookie.
        name: count
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          $ref: '#/components/responses/GetObjectsLastRunResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    servers:
    - url: /v2
  /data-protect/objects/runs/cancel:
    post:
      description: Cancel object runs for object based protection. This does not apply to Group based protection.
      tags:
      - Objects
      summary: Cancel object runs
      operationId: CancelObjectRuns
      responses:
        '207':
          $ref: '#/components/responses/CancelObjectRunsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelObjectRunsRequest'
        description: Specifies the parameters to cancel object runs.
        required: true
    servers:
    - url: /v2
  /data-protect/objects/{id}:
    get:
      description: Get Object configrations for given object id.
      tags:
      - Objects
      summary: Get an Object
      operationId: GetProtectedObjectOfAnyTypeById
      parameters:
      - description: Specifies the id of the Object.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - description: If true, the response will include only objects which have been protected.
        name: onlyProtectedObjects
        in: query
        schema:
          type: boolean
      - description: Filter by Storage Domain id. Only Objects protected to this Storage Domain will be returned.
        name: storageDomainId
        in: query
        schema:
          type: integer
          format: int64
      - description: Filter by environment types such as 'kVMware', 'kView', etc. Only Protected objects protecting the specified environment types are returned.
        name: environments
        in: query
        schema:
          type: array
          items:
            enum:
            - kVMware
            - kHyperV
            - kAzure
            - kGCP
            - kKVM
            - kAcropolis
            - kAWS
            - kPhysical
            - kGPFS
            - kElastifile
            - kNetapp
            - kGenericNas
            - kIsilon
            - kFlashBlade
            - kPure
            - kSQL
            - kExchange
            - kAD
            - kOracle
            - kView
            - kRemoteAdapter
            - kO365
            - kKubernetes
            - kCassandra
            - kMongoDB
            - kCouchbase
            - kHdfs
            - kHive
            - kHBase
            - kUDA
            type: string
      - description: TenantIds contains ids of the tenants for which objects are to be returned.
        name: tenantIds
        in: query
        schema:
          type: array
          items:
            type: string
      - description: If true, the response will include Objects which were protected by all tenants which the current user has permission to see. If false, then only objects protected by the current user will be returned.
        name: includeTenants
        in: query
        schema:
          type: boolean
      - description: If true, the response will include information about the last protection run on this object.
        name: includeLastRunInfo
        in: query
        schema:
          type: boolean
      - description: If true, the response will include only the auto protected objects.
        name: onlyAutoProtectedObjects
        in: query
        schema:
          type: boolean
      - description: If true, the response will include only the leaf level objects.
        name: onlyLeafObjects
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/ProtectedObjectResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    servers:
    - url: /v2
  /data-protect/objects/{id}/actions:
    post:
      description: Perform an action on an object. Depending on the object environment type, different actions are available.
      tags:
      - Objects
      summary: Perform an action on an object
      operationId: PerformActionOnObject
      parameters:
      - description: Specifies the id of the Object.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              x-cohesity-discriminator-ref: CommonObjectActionRequest
              $ref: '#/components/schemas/CommonObjectActionRequest29deb3fe-3bb8-42f6-a5c7-b42ed20de014'
        description: Specifies the parameters to perform an action on an object.
        required: true
    servers:
    - url: /v2
  /data-protect/objects/{id}/pit-ranges:
    get:
      description: Returns the time ranges within which the specified protected object can be restored to any Point in time.
      tags:
      - Objects
      summary: Get PIT ranges for an object
      operationId: GetPITRangesForProtectedObject
      parameters:
      - description: Specifies the ID of the protected object.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - description: If specified, return the time ranges that lie after this timestamp. This parameter is specified as the timestamp in Unix time epoch in microseconds.
        name: fromTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: If specified, return the time ranges that lie before this timestamp. This parameter is specified as the timestamp in Unix time epoch in microseconds.
        name: toTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: If specified, return only the points in time corresponding to these protection group IDs.
        name: protectionGroupIds
        in: query
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/GetPITRangesProtectedObjectResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    servers:
    - url: /v2
  /data-protect/objects/{id}/runs:
    get:
      description: Get the runs for a particular object.
      tags:
      - Objects
      summary: Get the list of runs for an object
      operationId: GetObjectRuns
      parameters:
      - description: Specifies a unique id of the object.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - description: Specifies a unique id of the run.
        name: runId
        in: query
        schema:
          type: string
      - description: Filter by a start time when the run starts. Specify the start time as a Unix epoch Timestamp (in microseconds).
        name: startTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: Filter by a end time when the run starts. Specify the start time as a Unix epoch Timestamp (in microseconds).
        name: endTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: TenantIds contains ids of the tenants for which objects are to be returned.
        name: tenantIds
        in: query
        schema:
          type: array
          items:
            type: string
      - description: If true, the response will include Protection Group Runs which were created by all tenants which the current user has permission to see. If false, then only Protection Group Runs created by the current user will be returned.
        name: includeTenants
        in: query
        schema:
          type: boolean
      - description: Filter by run type. Only protection run matching the specified types will be returned.
        name: runTypes
        in: query
        schema:
          type: array
          items:
            enum:
            - kAll
            - kLog
            - kSystem
            - kIncremental
            - kFull
            type: string
          uniqueItems: true
      - description: Specifies a list of status for the object in the backup run.
        name: localBackupObjectStatus
        in: query
        schema:
          type: array
          items:
            enum:
            - kInProgress
            - kSuccessful
            - kFailed
            - kWaitingForNextAttempt
            - kWarning
            type: string
      - description: Specifies a list of status for the object in the replication run.
        name: replicationObjectStatus
        in: query
        schema:
          type: array
          items:
            enum:
            - kInProgress
            - kSuccessful
            - kFailed
            - kWaitingForNextAttempt
            - kWarning
            type: string
      - description: Specifies a list of status for the object in the archival run.
        name: archivalObjectStatus
        in: query
        schema:
          type: array
          items:
            enum:
            - kInProgress
            - kSuccessful
            - kFailed
            - kWaitingForNextAttempt
            - kWarning
            type: string
      - description: Specifies a list of status for the object in the cloud spin run.
        name: cloudSpinRunStatus
        in: query
        schema:
          type: array
          items:
            enum:
            - kInProgress
            - kSuccessful
            - kFailed
            - kWaitingForNextAttempt
            - kWarning
            type: string
      - description: Specifies the max number of runs. If not specified, at most 100 runs will be returned.
        name: numRuns
        in: query
        schema:
          type: integer
          format: int64
      - description: Specifies the pagination cookie with which subsequent parts of the response can be fetched. Users can use this to get next runs
        name: paginationCookie
        in: query
        schema:
          type: string
      - description: Specifies whether to exclude non restorable runs. Run is treated restorable only if there is atleast one object snapshot (which may be either a local or an archival snapshot) which is not deleted or expired. Default value is false.
        name: excludeNonRestorableRuns
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          $ref: '#/components/responses/GetObjectRunsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    servers:
    - url: /v2
  /data-protect/objects/{id}/runs/{runId}:
    get:
      description: Get a run for an object.
      tags:
      - Objects
      summary: Get a run for an object
      operationId: GetObjectRunByRunId
      parameters:
      - description: Specifies a unique id of the object.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - description: Specifies the id of the run.
        name: runId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/GetObjectRunResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    servers:
    - url: /v2
  /data-protect/objects/{id}/snapshots:
    get:
      description: List the snapshots for a given object.
      tags:
      - Objects
      summary: List the snapshots for a given object
      operationId: GetObjectSnapshots
      parameters:
      - description: Specifies the id of the Object.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - description: Specifies the timestamp in Unix time epoch in microseconds to filter Object's snapshots which were taken after this value.
        name: fromTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: Specifies the timestamp in Unix time epoch in microseconds to filter Object's snapshots which were taken before this value.
        name: toTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: Specifies the timestamp in Unix time epoch in microseconds to filter Object's snapshots which were run after this value.
        name: runStartFromTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: Specifies the timestamp in Unix time epoch in microseconds to filter Object's snapshots which were run before this value.
        name: runStartToTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: Filter by run type. Only protection run matching the specified types will be returned. By default, CDP hydration snapshots are not included, unless explicitly queried using this field.
        name: runTypes
        in: query
        schema:
          type: array
          items:
            enum:
            - kRegular
            - kFull
            - kLog
            - kSystem
            - kHydrateCDP
            type: string
          uniqueItems: true
      - description: If specified, this returns only the snapshots of the specified object ID, which belong to the provided protection group IDs.
        name: protectionGroupIds
        in: query
        schema:
          type: array
          items:
            type: string
      - description: Filter by a list run instance ids. If specified, only snapshots created by these protection runs will be returned.
        name: runInstanceIds
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      responses:
        '200':
          $ref: '#/components/responses/GetObjectSnapshotsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    servers:
    - url: /v2
  /data-protect/objects/{id}/snapshots/{snapshotId}:
    put:
      description: Update an object snapshot.
      tags:
      - Objects
      summary: Update an object snapshot
      operationId: UpdateObjectSnapshot
      parameters:
      - description: Specifies the id of the Object.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - description: 'Specifies the id of the snapshot.<br> Note: 1. If the snapshotid of one of the apps is specified, it applies for all the databases in the Protection Run.<br> 2. In case of volume based jobs, please specify the snapshotid of the source not the database. if source snapshot is specified, applied to source snapshot. if database snapshotid is specified in case of volume based jobs, then it is applicable for host''s snapshot.'
        name: snapshotId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/UpdateObjectSnapshotResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateObjectSnapshotRequest'
        description: Specifies the parameters update an object snapshot.
        required: true
    servers:
    - url: /v2
  /data-protect/objects/{id}/stats:
    get:
      description: Get stats for a given object.
      tags:
      - Objects
      summary: Get stats for a given object
      operationId: GetObjectStats
      parameters:
      - description: Specifies the id of the Object.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/GetObjectStatsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    servers:
    - url: /v2
  /data-protect/objects/{id}/tree:
    get:
      description: Get the objects tree hierarchy for for an Object. If the object does not have a hierarchy then a single object will be returned.
      tags:
      - Objects
      summary: Get the objects tree hierarchy for for an Object
      operationId: GetObjectTree
      parameters:
      - description: Specifies the id of the Object.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/ObjectTreeResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    servers:
    - url: /v2
  /data-protect/objects/{objectId}/indexed-objects/snapshots:
    get:
      description: Get snapshots of indexed object.
      tags:
      - Objects
      summary: Get snapshots of indexed object
      operationId: GetAllIndexedObjectSnapshots
      parameters:
      - description: Specifies the object id.
        name: objectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - description: Specifies the indexed object name.
        name: indexedObjectName
        in: query
        required: true
        schema:
          type: string
      - description: Specifies the protection group id.
        name: protectionGroupId
        in: query
        schema:
          type: string
      - description: Specifies whether to only return snapshots which are indexed. In an indexed snapshot files are guaranteed to exist, while in a non-indexed snapshot files may not exist.
        name: includeIndexedSnapshotsOnly
        in: query
        schema:
          type: boolean
          default: false
      - description: Specifies the timestamp in Unix time epoch in microseconds to filter indexed object's snapshots which are taken after this value.
        name: fromTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: Specifies the timestamp in Unix time epoch in microseconds to filter indexed object's snapshots which are taken before this value.
        name: toTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: Filter by run type. Only protection run matching the specified types will be returned. By default, CDP hydration snapshots are not included, unless explicitly queried using this field.
        name: runTypes
        in: query
        schema:
          type: array
          items:
            enum:
            - kRegular
            - kFull
            - kLog
            - kSystem
            - kHydrateCDP
            type: string
          uniqueItems: true
      responses:
        '200':
          $ref: '#/components/responses/GetIndexedObjectSnapshotsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    servers:
    - url: /v2
  /data-protect/objects/{objectId}/protection-groups/{protectionGroupId}/indexed-objects/snapshots:
    get:
      description: Get snapshots of indexed object.
      tags:
      - Objects
      summary: Get snapshots of indexed object
      operationId: GetIndexedObjectSnapshots
      parameters:
      - description: Specifies the protection group id.
        name: protectionGroupId
        in: path
        required: true
        schema:
          type: string
      - description: Specifies the object id.
        name: objectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - description: Specifies the indexed object name.
        name: indexedObjectName
        in: query
        required: true
        schema:
          type: string
      - description: Specifies whether to only return snapshots which are indexed. In an indexed snapshots file are guaranteened to exist, while in a non-indexed snapshots file may not exist.
        name: includeIndexedSnapshotsOnly
        in: query
        schema:
          type: boolean
          default: false
      - description: Specifies the timestamp in Unix time epoch in microseconds to filter indexed object's snapshots which are taken after this value.
        name: fromTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: Specifies the timestamp in Unix time epoch in microseconds to filter indexed object's snapshots which are taken before this value.
        name: toTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: Filter by run type. Only protection run matching the specified types will be returned. By default, CDP hydration snapshots are not included, unless explicitly queried using this field.
        name: runTypes
        in: query
        schema:
          type: array
          items:
            enum:
            - kRegular
            - kFull
            - kLog
            - kSystem
            - kHydrateCDP
            type: string
          uniqueItems: true
      responses:
        '200':
          $ref: '#/components/responses/GetIndexedObjectSnapshotsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    servers:
    - url: /v2
  /data-protect/snapshots/{snapshotId}:
    get:
      description: Get details of object snapshot.
      tags:
      - Objects
      summary: Get details of object snapshot
      operationId: GetObjectSnapshotInfo
      parameters:
      - description: Specifies the snapshot id.
        name: snapshotId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/GetObjectSnapshotInfoResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    servers:
    - url: /v2
  /data-protect/snapshots/{snapshotId}/metaInfo:
    post:
      description: Construct meta info from object snapshot and some additional params.
      tags:
      - Objects
      summary: Construct meta info for any workflow from object snapshot and some other…
      operationId: ConstructMetaInfo
      parameters:
      - description: Specifies the snapshot id.
        name: snapshotId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ConstructMetaInfoResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
