openapi: 3.2.0
info:
  title: Cohesity Stats API
  version: '1.0'
  description: 'Operations tagged Stats across 3 of this provider''s published API definitions: cohesity-cluster-v1-openapi-original.yml, cohesity-cluster-v2-openapi-original.yml, cohesity-site-continuity-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://<CLUSTER_VIP>/irisservices/api/v1
- url: /v2
- url: https://helios.cohesity.com/v2/mcm/site-continuity/v2
tags:
- name: Stats
paths:
  /public/stats/alerts:
    get:
      description: Compute the statistics on the active Alerts generated on the cluster based on the provided time interval.
      tags:
      - Stats
      summary: Compute the statistics on the active Alerts generated on the cluster
      operationId: GetActiveAlertsStats
      parameters:
      - x-go-name: StartTimeUsecs
        description: Specifies the start time Unix time epoch in microseconds from which the active alerts stats are computed.
        name: startTimeUsecs
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - x-go-name: EndTimeUsecs
        description: Specifies the end time Unix time epoch in microseconds to which the active alerts stats are computed.
        name: endTimeUsecs
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/GetActiveAlertsStatsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/stats/consumers:
    get:
      tags:
      - Stats
      summary: Gets the statistics of consumers
      operationId: GetConsumerStats
      parameters:
      - x-go-name: ConsumerType
        description: 'Specifies the consumer type.

          Type of the consumer can be one of the following three,


          ''kViews'', indicates the stats info of Views used per organization (tenant)

          per view box (storage domain).

          ''kProtectionRuns'', indicates the stats info of Protection Runs used per

          organization (tenant) per view box (storage domain).

          ''kReplicationRuns'', indicates the stats info of Replication In used per

          organization (tenant) per view box (storage domain).

          ''kViewProtectionRuns'', indicates the stats info of View Protection Runs used

          per organization (tenant) per view box (storage domain).'
        name: consumerType
        in: query
        schema:
          type: string
          enum:
          - kViews
          - kProtectionRuns
          - kReplicationRuns
          - kViewProtectionRuns
      - x-go-name: MaxCount
        description: Specifies a limit on the number of stats groups returned.
        name: maxCount
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: Cookie
        description: 'Specifies the opaque string returned in the previous response.

          If this is set, next set of active opens just after the previous

          response are returned. If this is not set, first set of active opens

          are returned.'
        name: cookie
        in: query
        schema:
          type: string
      - x-go-name: ConsumerIdList
        description: Specifies a list of consumer ids.
        name: consumerIdList
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: ConsumerEntityIdList
        description: 'Specifies a list of consumer entity ids. If this field is specified, each

          entity id must corresponds to the id in ''ConsumerIdList'' in the same

          index, and the length of ''ConsumerEntityIdList'' and ''ConsumerIdList'' must

          be the same.'
        name: consumerEntityIdList
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: FetchViewBoxName
        description: 'Specifies whether to fetch view box (storage domain) name for each

          consumer.'
        name: fetchViewBoxName
        in: query
        schema:
          type: boolean
      - x-go-name: FetchTenantName
        description: Specifies whether to fetch tenant (organization) name for each consumer.
        name: fetchTenantName
        in: query
        schema:
          type: boolean
      - x-go-name: FetchProtectionPolicy
        description: 'Specifies whether to fetch protection policy for each consumer. This field

          is applicable only if ''consumerType'' is ''kProtectionRuns'' or

          ''kReplicationRuns''.'
        name: fetchProtectionPolicy
        in: query
        schema:
          type: boolean
      - x-go-name: FetchProtectionEnvironment
        description: 'Specifies whether to fetch protection environment for each consumer. This

          field is applicable only if ''consumerType'' is ''kProtectionRuns'' or

          ''kReplicationRuns''.'
        name: fetchProtectionEnvironment
        in: query
        schema:
          type: boolean
      - x-go-name: ViewBoxesIdList
        description: Specifies a list of view boxes (storage domain) id.
        name: viewBoxesIdList
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: TenantsIdList
        description: Specifies a list of organizations (tenant) id.
        name: organizationsIdList
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: TenantIds
        description: 'Specifies a list of organizations (tenant) id. This field is added to

          allow tenantIds json tag. This list will be concatenated with

          TenantsIdList to form full list of tenantsIdList.'
        name: tenantIds
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: IncludeServiceProvider
        description: 'Specifies whether to fetch the consumption of external service providers.

          These information will be listed as a unique organization (tenant) in

          response. By default it is false.'
        name: includeServiceProvider
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/GetConsumerStatsResponse'
        default:
          $ref: '#/components/responses/Error'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/stats/files:
    get:
      description: Compute the file distribution statistics on a given entity like cluster or storage domain.
      tags:
      - Stats
      summary: Compute the file distribution statistics on a given entity like cluster or…
      operationId: GetFileDistributionStats
      parameters:
      - x-go-name: EntityType
        description: Specifies the entity type on which file distribution stats are computed.
        name: entityType
        in: query
        required: true
        schema:
          type: string
          enum:
          - kCluster
          - kStorageDomain
      responses:
        '200':
          $ref: '#/components/responses/GetFileDistributionStatsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/stats/protectionRuns:
    get:
      description: Compute the statistics of the Protection Runs based on the input filters. This endpoint provides a snapshot of count of Protection Runs of a specified status on a specified time interval.
      tags:
      - Stats
      summary: Compute the statistics on the Protection Runs for the cluster
      operationId: GetProtectionRunsStats
      parameters:
      - x-go-name: Status
        description: Specifies the Protection Run status for which stats has to be computed.
        name: status
        in: query
        required: true
        schema:
          type: string
          enum:
          - kSuccess
          - kFailure
          - kCanceled
          - kWarning
      - x-go-name: StartTimeUsecs
        description: Specifies the start time in Unix timestamp epoch in microseconds where the end time of the Protection Run is greater than the specified value.
        name: startTimeUsecs
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - x-go-name: EndTimeUsecs
        description: Specifies the end time in Unix timestamp epoch in microseconds where the end time of the Protection Run is lesser than the specified value.
        name: endTimeUsecs
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/GetProtectionRunsStatsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/stats/protectionRuns/lastRun:
    get:
      description: Compute stats on last Protection Run for every job.
      tags:
      - Stats
      summary: Compute stats on last Protection Run for every job
      operationId: GetLastProtectionRunStats
      responses:
        '200':
          $ref: '#/components/responses/GetLastProtectionRunStatsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/stats/protectionSummary:
    get:
      description: Computes the protected objects summary on the cluster.
      tags:
      - Stats
      summary: Computes the protected objects summary on the cluster
      operationId: GetProtectedObjectsSummary
      parameters:
      - x-go-name: ExcludeTypes
        description: Specifies the environment types to exclude.
        name: excludeTypes
        in: query
        schema:
          type: array
          items:
            enum:
            - kVMware
            - kHyperV
            - kSQL
            - kView
            - kPuppeteer
            - kPhysical
            - kPure
            - kNimble
            - kAzure
            - kNetapp
            - kAgent
            - kGenericNas
            - kAcropolis
            - kPhysicalFiles
            - kIsilon
            - kGPFS
            - kKVM
            - kAWS
            - kExchange
            - kHyperVVSS
            - kOracle
            - kGCP
            - kFlashBlade
            - kAWSNative
            - kVCD
            - kO365
            - kO365Outlook
            - kHyperFlex
            - kGCPNative
            - kAzureNative
            - kAD
            - kAWSSnapshotManager
            type: string
      responses:
        '200':
          $ref: '#/components/responses/GetProtectedObjectsSummaryResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/stats/restores:
    get:
      description: Compute the statistics on the Restore tasks on the cluster based on the provided time interval.
      tags:
      - Stats
      summary: Compute the statistics on the Restore tasks on the cluster
      operationId: GetRestoreStats
      parameters:
      - x-go-name: StartTimeUsecs
        description: Specifies the start time Unix time epoch in microseconds from which the restore stats are computed.
        name: startTimeUsecs
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - x-go-name: EndTimeUsecs
        description: Specifies the end time Unix time epoch in microseconds to which the restore stats are computed.
        name: endTimeUsecs
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/GetRestoreStatsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/stats/storage:
    get:
      description: Computes the storage stats on the cluster.
      tags:
      - Stats
      summary: Computes the storage stats on the cluster
      operationId: GetStorageStats
      responses:
        '200':
          $ref: '#/components/responses/GetStorageStatsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/stats/tenants:
    get:
      tags:
      - Stats
      summary: Gets the statistics of organizations (tenant)
      operationId: GetTenantStats
      parameters:
      - x-go-name: ConsumerType
        description: 'Specifies the consumer type.

          Type of the consumer can be one of the following three,


          ''kViews'', indicates the stats info of Views used per organization (tenant)

          per view box (storage domain).

          ''kProtectionRuns'', indicates the stats info of Protection Runs used per

          organization (tenant) per view box (storage domain).

          ''kReplicationRuns'', indicates the stats info of Replication In used per

          organization (tenant) per view box (storage domain).

          ''kViewProtectionRuns'', indicates the stats info of View Protection Runs used

          per organization (tenant) per view box (storage domain).'
        name: consumerType
        in: query
        schema:
          type: string
          enum:
          - kViews
          - kProtectionRuns
          - kReplicationRuns
          - kViewProtectionRuns
      - x-go-name: SkipGroupByTenant
        description: 'Specifies if we should skip grouping by tenant. If false, and tenant has

          multiple storage domains, then the stats for the storage domains will be

          aggregated. If true, then the response will return each storage domain

          cross tenant independently.'
        name: skipGroupByTenant
        in: query
        schema:
          type: boolean
      - x-go-name: MaxCount
        description: Specifies a limit on the number of stats groups returned.
        name: maxCount
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: Cookie
        description: 'Specifies the opaque string returned in the previous response.

          If this is set, next set of active opens just after the previous

          response are returned. If this is not set, first set of active opens

          are returned.'
        name: cookie
        in: query
        schema:
          type: string
      - x-go-name: OutputFormat
        description: 'Specifies what format to return the data in. Defaults to proto, but can

          select other options like csv.'
        name: outputFormat
        in: query
        schema:
          type: string
      - x-go-name: ViewBoxesIdList
        description: Specifies a list of view boxes (storage domain) id.
        name: viewBoxesIdList
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: TenantsIdList
        description: Specifies a list of organizations (tenant) id.
        name: organizationsIdList
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: TenantIds
        description: 'Specifies a list of organizations (tenant) id. This field is added to

          allow tenantIds json tag. This list will be concatenated with

          TenantsIdList to form full list of tenantsIdList.'
        name: tenantIds
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: IncludeServiceProvider
        description: 'Specifies whether to fetch the consumption of external service providers.

          These information will be listed as a unique organization (tenant) in

          response. By default it is false.'
        name: includeServiceProvider
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/GetTenantStatsResponse'
        default:
          $ref: '#/components/responses/Error'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/stats/vaults:
    get:
      description: Compute the statistics on vaults.
      tags:
      - Stats
      summary: Compute the statistics on vaults
      operationId: GetVaultStats
      responses:
        '200':
          $ref: '#/components/responses/GetVaultStatsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/stats/vaults/providers:
    get:
      description: Compute the size and count of entities on vaults.
      tags:
      - Stats
      summary: Compute the size and count of entities on vaults
      operationId: GetVaultProviderStats
      parameters:
      - x-go-name: RunType
        description: Specifies the type of the runs.
        name: runType
        in: query
        required: true
        schema:
          type: string
          enum:
          - kArchived
          - kRestored
      responses:
        '200':
          $ref: '#/components/responses/GetVaultProviderStatsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/stats/vaults/runs:
    get:
      description: Compute the statistics on protection runs to or from a vault and return a trend line of the result.
      tags:
      - Stats
      summary: Compute the statistics on protection runs to or from a vault
      operationId: GetVaultRunStats
      parameters:
      - x-go-name: RunType
        description: Specifies the type of the run.
        name: runType
        in: query
        required: true
        schema:
          type: string
          enum:
          - kArchive
          - kRestore
          - kCloudSpin
      - x-go-name: StartTimeUsecs
        description: Specifies the start time Unix time epoch in microseconds from which the vault run stats are computed.
        name: startTimeUsecs
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - x-go-name: EndTimeUsecs
        description: Specifies the end time Unix time epoch in microseconds to which the vault run stats are computed.
        name: endTimeUsecs
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - x-go-name: Interval
        description: Specifies the interval by which runs will be grouped together in the returned trend line.
        name: interval
        in: query
        required: true
        schema:
          type: string
          enum:
          - kHour
          - kDay
          - kWeek
      responses:
        '200':
          $ref: '#/components/responses/GetVaultRunStatsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/stats/viewBoxes:
    get:
      tags:
      - Stats
      summary: Gets the statistics of view boxes (storage domain)
      operationId: GetViewBoxStats
      parameters:
      - x-go-name: ViewBoxesIdList
        description: Specifies a list of view boxes (storage domain) id.
        name: viewBoxesIdList
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: TenantsIdList
        description: Specifies a list of organizations (tenant) id.
        name: organizationsIdList
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: TenantIds
        description: 'Specifies a list of organizations (tenant) id. This field is added to

          allow tenantIds json tag. This list will be concatenated with

          TenantsIdList to form full list of tenantsIdList.'
        name: tenantIds
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: IncludeServiceProvider
        description: 'Specifies whether to fetch the consumption of external service providers.

          These information will be listed as a unique organization (tenant) in

          response. By default it is false.'
        name: includeServiceProvider
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/GetViewBoxStatsResponse'
        default:
          $ref: '#/components/responses/Error'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/stats/views:
    get:
      description: Compute the statistics on Views.
      tags:
      - Stats
      summary: Compute the statistics on Views
      operationId: GetViewStats
      parameters:
      - x-go-name: Metric
        description: Specifies the metric to which stats has to be sorted.
        name: metric
        in: query
        schema:
          type: string
          enum:
          - kSystemUsageBytes
          - kChunkBytesPhysical
          - kNumBytesWritten
          - kNumBytesRead
          - kPeakReadThroughput
          - kPeakWriteThroughput
      - x-go-name: NumTopViews
        description: Specifies the number of views for which stats has to be computed. Specifying this field will return the Views sorted in the descending order on the metric specified. If specified, minimum value is 1. If not specified, all views will be returned. If metric is not specified, this parameter must also not be specified.
        name: numTopViews
        in: query
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          $ref: '#/components/responses/GetViewStatsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/stats/views/protocols:
    get:
      description: Compute the protocol statistics on Views.
      tags:
      - Stats
      summary: Compute the protocol statistics on Views
      operationId: GetViewProtocolStats
      responses:
        '200':
          $ref: '#/components/responses/GetViewProtocolStatsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /stats/protection-runs:
    get:
      description: Get statistics of protection runs.
      tags:
      - Stats
      summary: Get statistics of protection runs
      operationId: GetProtectionRunsStats
      parameters:
      - description: Specify the start time as a Unix epoch Timestamp (in microseconds), only runs executing after this time will be counted. By default it is current time minus a day.
        name: startTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: Specify the end time as a Unix epoch Timestamp (in microseconds), only runs executing before this time will be counted. By default it is current time.
        name: endTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: Specifies a list of status, runs matching the status will be returned. 'Running' indicates that the run is still running. 'Canceled' indicates that the run has been canceled. 'Failed' indicates that the run has failed. 'Succeeded' indicates that the run has finished successfully. 'SucceededWithWarning' indicates that the run finished successfully, but there were some warning messages.
        name: runStatus
        in: query
        schema:
          type: array
          items:
            enum:
            - Running
            - Canceled
            - Failed
            - Succeeded
            - SucceededWithWarning
            type: string
      responses:
        '200':
          $ref: '#/components/responses/GetProtectionRunsStatusResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    servers:
    - url: /v2
  /stats:
    post:
      description: 'Privileges: DRAAS_VIEW


        Fetch detailed stats about DR Plans, sites and applications

        to power custom dashboards.'
      tags:
      - Stats
      summary: Returns detailed statistics
      operationId: SCGetStats
      responses:
        200:
          $ref: '#/components/responses/SCGetStatsResponse'
        default:
          $ref: '#/components/responses/SCErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SCGetStatsParams'
        description: Specifies the parameters to get the stats.
        required: true
      security:
      - ApiKeyAuth: []
    servers:
    - url: https://helios.cohesity.com/v2/mcm/site-continuity/v2
components:
  schemas:
    RequestError:
      description: Details about the Error.
      type: object
      title: Error
      properties:
        errorCode:
          description: Operation response error code.
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: ErrorCode
        message:
          description: Description of the error.
          type:
          - string
          - 'null'
          x-go-name: Message
      x-go-package: cohesity/iris/server/data/public
    StatsGroup:
      description: 'StatsGroup describes the details of a stats group. A stats group is a basic

        group of usage stats, it is the usage of a tenant within a storage domain

        may also for a specific consumer type.'
      type: object
      title: StatsGroup.
      properties:
        consumer:
          description: Specifies the consumer information of this group.
          $ref: '#/components/schemas/Consumer'
        entityId:
          description: Specifies the entity id of the group.
          type:
          - string
          - 'null'
          x-go-name: EntityId
        id:
          description: Specifies the id of the group.
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: Id
        name:
          description: Specifies the name of the group.
          type:
          - string
          - 'null'
          x-go-name: Name
        tenantId:
          description: Specifies the id of the organization (tenant) with respect to this group.
          type:
          - string
          - 'null'
          x-go-name: TenantId
        tenantName:
          description: 'Specifies the name of the organization (tenant) with respect to this

            group.'
          type:
          - string
          - 'null'
          x-go-name: TenantName
        viewBoxId:
          description: 'Specifies the id of the view box (storage domain) with respect to this

            group.'
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: ViewBoxId
        viewBoxName:
          description: 'Specifies the name of the view box (storage domain) with respect to this

            group.'
          type:
          - string
          - 'null'
          x-go-name: ViewBoxName
      x-go-package: cohesity/iris/server/data/public
    StorageStats:
      description: Specifies the storage statistics of the cluster.
      type: object
      title: Storage Statistics
      properties:
        dataProtectionLogicalUsageBytes:
          description: Specifies the logical size of protected objects in bytes.
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: DataProtectionLogicalUsageBytes
        dataProtectionPhysicalUsageBytes:
          description: Specifies the physical size of protected objects in bytes.
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: DataProtectionPhysicalUsageBytes
        fileServicesLogicalUsageBytes:
          description: Specifies the logical size consumed by file services in bytes.
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: FileServicesLogicalUsageBytes
        fileServicesPhysicalUsageBytes:
          description: Specifies the physical size consumed by file services in bytes.
          type:
          - integer
