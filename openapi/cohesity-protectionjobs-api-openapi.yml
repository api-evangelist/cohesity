        type:
          description: 'Specifies the type of the entity in an Elastifile file system

            like ''kCluster'', ''kContainer''.

            ''kCluster'' indicates an Elastifile Cluster.

            ''kContainer'' indicates a container on Elastifile cluster.'
          type:
          - string
          - 'null'
          enum:
          - kCluster
          - kContainer
          x-go-name: Type
