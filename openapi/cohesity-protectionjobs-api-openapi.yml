        archivalTarget:
          description: 'Specifies the Archival External Target for storing a copied Snapshot.

            If the type is not ''kLocal'', either a replicationTarget,

            archivalExternalTarget or cloudReplicationTarget must be specified.'
          $ref: '#/components/schemas/ArchivalExternalTarget'
        cloudReplicationTarget:
          description: 'Specifies the cloud replication target for storing a copied Snapshot.

            If the type is not ''kLocal'', either a replicationTarget,

            archivalExternalTarget or cloudReplicationTarget must be specified.'
          $ref: '#/components/schemas/CloudDeployTargetDetails'
        daysToKeep:
