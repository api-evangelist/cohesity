openapi: 3.2.0
info:
  description: 'This API list provides operations for interfacing with the Cohesity

    Cluster.'
  title: Cohesity REST Principals API
  version: '1.0'
servers:
- url: https://<CLUSTER_VIP>/irisservices/api/v1
tags:
- name: Principals
paths:
  /public/principals/protectionSources:
    get:
      description: 'From the passed in list principals (specified by SIDs),

        return the list of Protection Sources objects and View names that each

        principal has permission to access.'
      tags:
      - Principals
      summary: Returns the Protection Sources objects and View names that the principals have…
      operationId: ListSourcesForPrincipals
      parameters:
      - x-go-name: Sids
        description: 'Specifies a list of security identifiers (SIDs) that specify user or

          group principals.'
        name: sids
        in: query
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ListSourcesForPrincipalsResponse'
        default:
          $ref: '#/components/responses/Error'
    put:
      description: 'Specify the security identifier (SID) of the principal to grant access

        permissions for.'
      tags:
      - Principals
      summary: Set the Protection Sources and Views that the specified principal has…
      operationId: UpdateSourcesForPrincipals
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSourcesForPrincipalsParams'
        description: 'Request to set access permissions to Protection Sources and Views

          for a principal.'
        required: true
  /public/principals/searchPrincipals:
    get:
      description: 'Optionally, limit the search results by specifying security identifiers (SIDs),

        an object class (user or group) or a substring.

        You can specify SIDs or a substring but not both.'
      tags:
      - Principals
      summary: List the user and group principals that match the filter criteria specified…
      operationId: SearchPrincipals
      parameters:
      - x-go-name: Domain
        description: 'Specifies the domain name of the principals to search. If specified

          the principals in that domain are searched. Domain could be an

          Active Directory domain joined by the Cluster or any one of the

          trusted domains of the Active Directory domain or the LOCAL domain.

          If not specified, all the domains are searched.'
        name: domain
        in: query
        schema:
          type: string
      - x-go-name: ObjectClass
        description: 'Optionally filter by a principal object class such as ''kGroup'' or ''kUser''.

          If ''kGroup'' is specified, only group principals are returned.

          If ''kUser'' is specified, only user principals are returned.

          If not specified, both group and user principals are returned.

          ''kUser'' specifies a user object class.

          ''kGroup'' specifies a group object class.

          ''kComputer'' specifies a computer object class.

          ''kWellKnownPrincipal'' specifies a well known principal.'
        name: objectClass
        in: query
        schema:
          type: string
          enum:
          - kUser
          - kGroup
          - kComputer
          - kWellKnownPrincipal
      - x-go-name: Search
        description: 'Optionally filter by matching a substring. Only principals in

          the with a name or sAMAccountName that matches

          part or all of the specified substring are returned.

          If specified, a ''sids'' parameter should not be specified.'
        name: search
        in: query
        schema:
          type: string
      - x-go-name: Sids
        description: 'Optionally filter by a list of security identifiers (SIDs) found

          in the specified domain. Only principals matching

          the specified SIDs are returned.

          If specified, a ''search'' parameter should not be specified.'
        name: sids
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: IncludeComputers
        description: Specifies if Computer/GMSA accounts need to be included in this search.
        name: includeComputers
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/SearchPrincipalsResponse'
        default:
          $ref: '#/components/responses/Error'
  /public/sessionUser:
    get:
      tags:
      - Principals
      summary: Get the information of the logged in user
      operationId: GetSessionUser
      responses:
        '200':
          $ref: '#/components/responses/GetSessionUserResponse'
        default:
          $ref: '#/components/responses/Error'
  /public/users:
    get:
      description: 'If no parameters are specified, all users currently on the Cohesity Cluster

        are returned. Specifying parameters filters the results that are returned.'
      tags:
      - Principals
      summary: List the users on the Cohesity Cluster that match the filter criteria specified…
      operationId: GetUsers
      parameters:
      - x-go-name: TenantIds
        description: 'TenantIds contains ids of the tenants for which objects are to be

          returned.'
        name: tenantIds
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: AllUnderHierarchy
        description: 'AllUnderHierarchy specifies if objects of all the tenants under the

          hierarchy of the logged in user''s organization should be returned.'
        name: allUnderHierarchy
        in: query
        schema:
          type: boolean
      - x-go-name: Usernames
        description: 'Optionally specify a list of usernames to filter by. All users containing

          username will be returned.'
        name: usernames
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: EmailAddresses
        description: Optionally specify a list of email addresses to filter by.
        name: emailAddresses
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: Domain
        description: 'Optionally specify a domain to filter by.

          If no domain is specified, all users on the Cohesity Cluster are searched.

          If a domain is specified, only users on the Cohesity Cluster

          associated with that domain are searched.'
        name: domain
        in: query
        schema:
          type: string
      - x-go-name: PartialMatch
        description: 'Optionally specify whether to enable partial match. If set, all users

          with name containing Usernames will be returned. If set to false, only

          users with exact the same name as Usernames will be returned. By default

          this parameter is set to true.'
        name: partialMatch
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/GetUsersResponse'
        default:
          $ref: '#/components/responses/Error'
    put:
      description: Returns the user that was updated on the Cohesity Cluster.
      tags:
      - Principals
      summary: Update an existing user on the Cohesity Cluster.
      operationId: UpdateUser
      responses:
        '200':
          $ref: '#/components/responses/UpdateUserResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
        description: Request to update an existing user.
    post:
      description: 'If an Active Directory domain is specified, a new user is added to the

        Cohesity Cluster for the specified Active Directory user principal.

        If the LOCAL domain is specified, a new user is created directly in

        the default LOCAL domain on the Cohesity Cluster.


        Returns the created or added user.'
      tags:
      - Principals
      summary: Create or add a new user to the Cohesity Cluster
      operationId: CreateUser
      responses:
        '201':
          $ref: '#/components/responses/CreateUserResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserParameters'
        description: Request to add or create a new user.
    delete:
      description: 'Only users from the same domain can be deleted by a single request.

        If the Cohesity user was created for an Active Directory user, the referenced

        principal user on the Active Directory domain is NOT deleted.

        Only the user on the Cohesity Cluster is deleted.

        Returns Success if the specified users are deleted.'
      tags:
      - Principals
      summary: Delete one or more users on the Cohesity Cluster
      operationId: DeleteUsers
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDeleteParameters'
        description: Request to delete one or more users on the Cohesity Cluster.
  /public/users/privileges:
    get:
      tags:
      - Principals
      summary: List the privileges of the session user
      operationId: GetUserPrivileges
      responses:
        '200':
          $ref: '#/components/responses/GetUserPrivilegesResponse'
        default:
          $ref: '#/components/responses/Error'
  /public/users/s3SecretKey:
    post:
      description: Returns the new key that was generated.
      tags:
      - Principals
      summary: Reset the S3 secret access key for the specified user on the Cohesity Cluster
      operationId: ResetS3SecretKey
      responses:
        '200':
          $ref: '#/components/responses/ResetS3SecretKeyResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetS3SecretKeyParameters'
        description: Request to reset the S3 secret access key for the specified Cohesity user.
  /public/users/{sid}/apiKeys:
    get:
      tags:
      - Principals
      summary: Fetch API keys for user
      operationId: GetUserApiKeys
      parameters:
      - x-go-name: Ids
        description: Specifies a list of API key ids.
        name: ids
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: Sid
        description: Specifies the user sid.
        name: sid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/GetApiKeysResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Principals
      summary: Create an API key for user
      operationId: CreateUserApiKey
      parameters:
      - x-go-name: Sid
        description: Specifies the user sid.
        name: sid
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/CreateApiKeyResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyParams'
        description: Request to create an API key.
        required: true
  /public/users/{sid}/apiKeys/{id}:
    get:
      tags:
      - Principals
      summary: Fetch an API key for user by its id
      operationId: GetUserApiKeyById
      parameters:
      - x-go-name: Sid
        description: Specifies the user sid.
        name: sid
        in: path
        required: true
        schema:
          type: string
      - x-go-name: Id
        description: Specifies the API key id.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/GetApiKeyByIdResponse'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - Principals
      summary: Update an API key
      operationId: UpdateUserApiKey
      parameters:
      - x-go-name: Sid
        description: Specifies the user sid.
        name: sid
        in: path
        required: true
        schema:
          type: string
      - x-go-name: Id
        description: Specifies the API key id.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/CreateApiKeyResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApiKeyParams'
        description: Request to update an API key.
        required: true
    delete:
      tags:
      - Principals
      summary: Delete an API key for user
      operationId: DeleteUserApiKey
      parameters:
      - x-go-name: Sid
        description: Specifies the user sid.
        name: sid
        in: path
        required: true
        schema:
          type: string
      - x-go-name: Id
        description: Specifies the API key id.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/Error'
  /public/users/{sid}/apiKeys/{id}/rotate:
    post:
      tags:
      - Principals
      summary: Fetch an API key for user by its id
      operationId: RotateUserApiKey
      parameters:
      - x-go-name: Sid
        description: Specifies the user sid.
        name: sid
        in: path
        required: true
        schema:
          type: string
      - x-go-name: Id
        description: Specifies the API key id.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/RotateUserApiKeyResponse'
        default:
          $ref: '#/components/responses/Error'
  /public/usersApiKeys:
    get:
      tags:
      - Principals
      summary: Fetch API keys across all users
      operationId: GetAllUserApiKeys
      parameters:
      - x-go-name: UserSids
        description: Specifies a list of user sids.
        name: userSids
        in: query
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/GetApiKeysResponse'
        default:
          $ref: '#/components/responses/Error'
components:
  schemas:
    NfsSquash:
      type: object
      title: NfsSquash specifies the squash config for client subnet whitelist.
      properties:
        gid:
          description: GID mapped for all clients.
          type:
          - integer
          - 'null'
          format: uint32
          x-go-name: Gid
        uid:
          description: UID mapped for all clients.
          type:
          - integer
          - 'null'
          format: uint32
          x-go-name: Uid
      x-go-package: cohesity/iris/server/data/public
    GoogleAccountInfo:
      description: Google Account Information of a Helios BaaS user.
      type: object
      title: Google Account Information.
      properties:
        accountId:
          description: Specifies the Account Id assigned by Google.
          type:
          - string
          - 'null'
          x-go-name: AccountId
        userId:
          description: Specifies the User Id assigned by Google.
          type:
          - string
          - 'null'
          x-go-name: UserId
      x-go-package: cohesity/iris/server/data/public
    NetappVserverInfo:
      description: Specifies information about a NetApp Vserver in a NetApp Protection Source.
      type: object
      title: NetApp Vserver Information.
      properties:
        dataProtocols:
          description: 'Array of Data Protocols.


            Specifies the set of data protocols supported by this Vserver.

            The kManagement protocol is not supported for this case.

            ''kNfs'' indicates NFS connections.

            ''kCifs'' indicates SMB (CIFS) connections.

            ''kIscsi'' indicates iSCSI connections.

            ''kFc'' indicates Fiber Channel connections.

            ''kFcache'' indicates Flex Cache connections.

            ''kHttp'' indicates HTTP connections.

            ''kNdmp'' indicates NDMP connections.

            ''kManagement'' indicates non-data connections used for management purposes.

            ''kNvme'' indicates NVMe connections.'
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - kNfs
            - kCifs
            - kIscsi
            - kFc
            - kFcache
            - kHttp
            - kNdmp
            - kManagement
            - kNvme
          x-go-name: DataProtocols
        interfaces:
          description: 'Array of Interfaces.


            Specifies information about all interfaces on this Vserver.'
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/VserverNetworkInterface'
          x-go-name: Interfaces
        rootCifsShare:
          description: 'Specifies the root ''c$'' CIFS share of this Vserver.

            If it exists, it can be used to mount all CIFS volumes that are

            junctioned under ''/'' on this Vserver.'
          $ref: '#/components/schemas/CifsShareInfo'
        type:
          description: 'Specifies the type of this Vserver.

            Specifies the type of the NetApp Vserver.

            ''kData'' indicates the Vserver is used for data backup and restore.

            ''kAdmin'' indicates the Vserver is used for cluster-wide management.

            ''kSystem'' indicates the Vserver is used for cluster-scoped communications

            in an IPspace.

            ''kNode'' indicates the Vserver is used as the physical controller.

            ''kUnknown'' indicates the Vserver is used for an unknown purpose.'
          type:
          - string
          - 'null'
          enum:
          - kData
          - kAdmin
          - kSystem
          - kNode
          - kUnknown
          x-go-name: Type
      x-go-package: cohesity/iris/server/data/public
    Office365UserInfo:
      description: Specifies information about an Office365 user.
      type: object
      title: Office 365 User Info.
      properties:
        city:
          description: Specifies the city in which the Office365 user is located.
          type:
          - string
          - 'null'
          x-go-name: City
        country:
          description: Specifies the country/region in which the Office365 user is located.
          type:
          - string
          - 'null'
          x-go-name: Country
        department:
          description: Specifies the department within the enterprise of the Office365 user.
          type:
          - string
          - 'null'
          x-go-name: Department
        designation:
          description: Specifies the designation of the Office365 user.
          type:
          - string
          - 'null'
          x-go-name: Designation
        graphUuid:
          description: Specifies the MS Graph UUID for the given user entity.
          type:
          - string
          - 'null'
          x-go-name: GraphUuid
        mailboxSize:
          description: 'Specifies the size of the Outlook Mailbox associated with this Office365

            entity.'
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: MailboxSize
        oneDriveId:
          description: 'Specifies the Id of the OneDrive associated with the this Office 365

            entity.'
          type:
          - string
          - 'null'
          x-go-name: OneDriveId
        oneDriveSize:
          description: Specifies the size of the OneDrive associated with this Office365 entity.
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: OneDriveSize
      x-go-package: cohesity/iris/server/data/public
    HiveTable:
      description: Specifies an Object containing information about a Hive table.
      type: object
      title: Hive Table Info.
      properties:
        approxSizeBytes:
          description: Specifies the approx size of the table in bytes.
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: ApproxSizeBytes
        createdOn:
          description: Specifies the created on, epoch millis.
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: CreatedOn
        isTransactionalTable:
          description: Specifies if this is a transactional table.
          type:
          - boolean
          - 'null'
          x-go-name: IsTransactionalTable
        owner:
          description: Specifies the owner of the table.
          type:
          - string
          - 'null'
          x-go-name: Owner
        tableType:
          description: 'Specifies the type of table ex. MANAGED,VIRTUAL etc.

            Specifies the type of an Hive table.

            ''kManaged'' indicates a MANAGED Hive table.

            ''kExternal'' indicates a EXTERNAL Hive table.

            ''kVirtual'' indicates a VIRTUAL Hive tablet.

            ''kIndex'' indicates a INDEX Hive table.'
          type:
          - string
          - 'null'
          enum:
          - kManaged
          - kExternal
          - kVirtual
          - kIndex
          x-go-name: TableType
      x-go-package: cohesity/iris/server/data/public
    FlashBladeFileSystem:
      description: Specifies information about a Flash Blade File System in a Storage Array.
      type: object
      title: Flash Blade File System.
      properties:
        backupEnabled:
          description: 'Specifies whether the .snapshot directory exists on the file system.

            Backup is enabled only if the directory exists.'
          type:
          - boolean
          - 'null'
          x-go-name: BackupEnabled
        createdTimeMsecs:
          description: 'Specifies the time when the filesystem was created in Unix epoch time

            in milliseconds.'
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: CreatedTimeMsecs
        logicalCapacityBytes:
          description: Specifies the total capacity in bytes of the file system.
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: LogicalCapacityBytes
        logicalUsedBytes:
          description: 'Specifies the size of logical data currently represented on the

            file system in bytes.'
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: LogicalUsedBytes
        nfsInfo:
          description: 'Specifies information about an NFS export. This field is set if the file

            system supports protocol type ''kNfs''.'
          $ref: '#/components/schemas/FlashBladeNfsInfo'
        physicalUsedBytes:
          description: 'Specifies the size of physical data currently consumed by the file

            system. This includes the space used for the snapshots.'
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: PhysicalUsedBytes
        protocols:
          description: 'List of Protocols.


            Specifies the list of protocols enabled on the file system.

            ''kNfs'' indicates NFS exports are supported on Pure FlashBlade File System.

            ''kCifs2'' indicates CIFS/SMB Shares are supported on Pure FlashBlade File

            System.

            ''kHttp'' indicates object protocol over HTTP and HTTPS are supported.'
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - kNfs
            - kCifs2
            - kHttp
          x-go-name: Protocols
        uniqueUsedBytes:
          description: 'Specifies the size of physical data consumed by the file system

            itself not including the size of the snapshots.'
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: UniqueUsedBytes
      x-go-package: cohesity/iris/server/data/public
    HypervVirtualMachine:
      description: Specifies information about a VirtualMachine Object in HyperV environment.
      type: object
      title: HyperV VirtualMachine Object.
      properties:
        isHighlyAvailable:
          description: Specifies whether the VM is Highly Available or not.
          type:
          - boolean
          - 'null'
          x-go-name: IsHighlyAvailable
        version:
          description: Specifies the version of the VM. For example, 8.0, 5.0 etc.
          type:
          - string
          - 'null'
          x-go-name: Version
        vmBackupStatus:
          description: 'Specifies the status of the VM for backup purpose.

            overrideDescription: true

            Specifies the backup status of a HyperV Virtual Machine object.

            ''kSupported'' indicates the agent on the VM can do backup.

            ''kUnsupportedConfig'' indicates the agent on the VM cannot do backup.

            ''kMissing'' indicates the VM is not found in SCVMM.'
          type:
          - string
          - 'null'
          enum:
          - kSupported
          - kUnsupportedConfig
          - kMissing
          x-go-name: VmBackupStatus
        vmBackupType:
          description: 'Specifies the type of backup supported by the VM.

            overrideDescription: true

            Specifies the type of an HyperV datastore object.

            ''kRctBackup'' indicates backup is done using RCT/checkpoints.

            ''kVssBackup'' indicates backup is done using VSS.'
          type:
          - string
          - 'null'
          enum:
          - kRctBackup
          - kVssBackup
          x-go-name: VmBackupType
      x-go-package: cohesity/iris/server/data/public
    CassandraSecurityInfo:
      description: Specifies an Object containing information on Cassandra security.
      type: object
      title: CassandraSecurityInfo Cassandra security info.
      properties:
        cassandraAuthRequired:
          description: Is Cassandra authentication required ?
          type:
          - boolean
          - 'null'
          x-go-name: CassandraAuthRequired
        cassandraAuthType:
          description: 'Cassandra Authentication type.

            Enum: [PASSWORD KERBEROS LDAP]

            Specifies the Cassandra auth type.

            ''PASSWORD''

            ''KERBEROS''

            ''LDAP'''
          type:
          - string
          - 'null'
          enum:
          - PASSWORD
          - KERBEROS
          - LDAP
          x-go-name: CassandraAuthType
        cassandraAuthorizer:
          description: Cassandra Authenticator/Authorizer.
          type:
          - string
          - 'null'
          x-go-name: CassandraAuthorizer
        clientEncryption:
          description: Is Client Encryption enabled for this cluster ?
          type:
          - boolean
          - 'null'
          x-go-name: ClientEncryption
        dseAuthorization:
          description: Is DSE Authorization enabled for this cluster ?
          type:
          - boolean
          - 'null'
          x-go-name: DseAuthorization
        serverEncryptionReqClientAuth:
          description: Is 'Server encryption request client authentication' enabled for this cluster ?
          type:
          - boolean
          - 'null'
          x-go-name: ServerEncryptionReqClientAuth
        serverInternodeEncryptionType:
          description: '''Server internal node Encryption'' type for this cluster.'
          type:
          - string
          - 'null'
          x-go-name: ServerInternodeEncryptionType
      x-go-package: cohesity/iris/server/data/public
    CouchbaseConnectParams:
      description: 'Specifies an Object containing information about a registered couchbase

        source.'
      type: object
      title: Couchbase Connect Params.
      properties:
        carrierDirectPort:
