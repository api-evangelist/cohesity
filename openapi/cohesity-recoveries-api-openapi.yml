    RecoverHyperVVmStandaloneClusterSourceConfig:
      description: Specifies the new destination Source configuration where the VMs will be recovered.
      type: object
      title: Recover HyperV VMs New Standalone Cluster Source Config.
      required:
      - source
      - host
      - volume
      properties:
        source:
          description: Specifies the id of the parent source to recover the VMs.
          allOf:
          - $ref: '#/components/schemas/RecoveryObjectIdentifier'
          - {}
          x-order: 0
        host:
          description: Specifies the HyperV host where the recovered VMs will be attached. For standalone host targets, the host must be the same as the source.
          allOf:
          - $ref: '#/components/schemas/RecoveryObjectIdentifier'
          - {}
          x-order: 1
        volume:
          description: Specifies the datastore object where the VMs' files should be recovered to.
          allOf:
          - $ref: '#/components/schemas/RecoveryObjectIdentifier'
          - {}
          x-order: 2
        networkConfig:
          description: Specifies the networking configuration to be applied to the recovered VMs.
          allOf:
          - $ref: '#/components/schemas/RecoverHyperVVmNewSourceNetworkConfig'
          - {}
          x-order: 3
    OriginalGpfsTargetParams:
      description: Specifies the params of the original GPFS recovery target.
      type: object
      title: Recover To Original GPFS NAS Volume Target Params.
      properties:
        overwriteExistingFile:
          description: Specifies whether to overwrite existing file/folder during recovery.
          type:
          - boolean
          - 'null'
          x-order: 0
        preserveFileAttributes:
          description: Specifies whether to preserve file/folder attributes during recovery.
          type:
          - boolean
          - 'null'
          x-order: 1
        continueOnError:
          description: Specifies whether to continue recovering other volumes if one of the volumes fails to recover. Default value is false.
          type:
          - boolean
          - 'null'
          x-order: 2
        encryptionEnabled:
          description: Specifies whether encryption should be enabled during recovery.
          type:
          - boolean
          - 'null'
          x-order: 3
        filterIpConfig:
          description: Specifies the list of IP addresses that are allowed or denied during recovery. Allowed IPs and Denied IPs cannot be used together.
          type:
          - object
          - 'null'
          x-order: 4
          $ref: '#/components/schemas/FilterIpConfig'
        vlanConfig:
          description: 'Specifies VLAN settings associated with the restore. If this is not specified, then the VLAN params will be automatically selected from one of the below options: a. If VLANs are configured on Cohesity, then the VLAN host/VIP will be automatically based on the client''s (e.g. ESXI host) IP address. b. If VLANs are not configured on Cohesity, then the partition hostname or VIPs will be used for restores.'
          x-order: 5
          $ref: '#/components/schemas/RecoveryVlanConfig'
    VmwareVmRecoveryTargetConfig:
      description: Specifies the target object parameters to recover VMware vms.
      type: object
      title: Vmware VMs Recovery Target Config.
      required:
      - recoverToNewSource
      properties:
        recoverToNewSource:
          description: Specifies the parameter whether the recovery should be performed to a new or an existing Source Target.
          type: boolean
          x-order: 0
        newSourceConfig:
          description: Specifies the new destination Source configuration parameters where the VMs will be recovered. This is mandatory if recoverToNewSource is set to true.
          allOf:
          - $ref: '#/components/schemas/RecoverVmwareVmNewSourceConfig'
          - {}
          x-order: 1
        originalSourceConfig:
          description: Specifies the Source configuration if VM's are being recovered to Original Source. If not specified, all the configuration parameters will be retained.
          allOf:
          - $ref: '#/components/schemas/RecoverVmwareVmOriginalSourceConfig'
          - {}
          x-order: 2
    RecoveryObjectIdentifier:
      description: Specifies the object identifier to perform recovery.
      type: object
      title: Recovery Object Identifier.
      required:
      - id
      properties:
        id:
          description: Specifies the id of the object.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 0
        name:
          description: Specifies the name of the object.
          type:
          - string
          - 'null'
          x-order: 1
          readOnly: true
    AwsTargetParamsForRecoverVm:
      description: Specifies the parameters for an AWS recovery target.
      type: object
      title: AWS Recovery Target Params
      properties:
        renameRecoveredVmsParams:
          description: Specifies params to rename the VMs that are recovered. If not specified, the original names of the VMs are preserved.
          allOf:
          - $ref: '#/components/schemas/RecoveredOrClonedVmsRenameConfig'
          - {}
          x-order: 0
        recoveryTargetConfig:
          description: Specifies the recovery target configuration if recovery has to be done to a different location which is different from original source or to original Source with different configuration. If not specified, then the recovery of the vms will be performed to original location with all configuration parameters retained.
          allOf:
          - $ref: '#/components/schemas/AwsVmRecoveryTargetConfig'
          - {}
          x-order: 1
        fleetConfig:
          description: Specifies the fleet params.
          allOf:
          - $ref: '#/components/schemas/FleetConfig'
          - {}
          x-order: 2
        powerOnVms:
          description: Specifies whether to power on vms after recovery. If not specified, or false, recovered vms will be in powered off state.
          type:
          - boolean
          - 'null'
          x-order: 3
        continueOnError:
          description: Specifies whether to continue recovering other vms if one of vms failed to recover. Default value is false.
          type:
          - boolean
          - 'null'
          x-order: 4
    KubernetesNamespaceRecoveryNewSourceConfig:
      description: Specifies the new source configuration if a Kubernetes Namespace is being restored to a different source than the one from which it was protected.
      type: object
      title: Kubernetes Namespace Recovery New Source Config
      required:
      - source
      properties:
        source:
          description: Specifies the id of the parent source to recover the Namespaces.
          allOf:
          - $ref: '#/components/schemas/RecoveryObjectIdentifier'
          - {}
          x-order: 0
    RecoverUdaParams:
      description: Specifies the parameters to recover Universal Data Adapter objects.
      type: object
      title: Recover Universal Data Adapter params.
      required:
      - snapshots
      properties:
        recoverTo:
          description: Specifies the 'Source Registration ID' of the source where the objects are to be recovered. If this is not specified, the recovery job will recover to the original location.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 0
        concurrency:
          description: Specifies the maximum number of concurrent IO Streams that will be created to exchange data with the cluster. If not specified, the default value is taken as 1.
          type:
          - integer
          - 'null'
          format: int32
          default: 1
          x-order: 1
        mounts:
          description: Specifies the maximum number of view mounts per host. If not specified, the default value is taken as 1.
          type:
          - integer
          - 'null'
          format: int32
          default: 1
          x-order: 2
        recoveryArgs:
          description: Specifies the arguments for recovery of Universal Data Adapter objects.
          type:
          - string
          - 'null'
          x-order: 3
        snapshots:
          description: Specifies the local snapshot ids and other details of the objects to be recovered.
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RecoverUdaSnapshotParams'
          x-order: 4
        warnings:
          description: This field will hold the warnings in cases where the job status is SucceededWithWarnings.
          type:
          - array
          - 'null'
          items:
            type: string
          x-order: 5
          readOnly: true
