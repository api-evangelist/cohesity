openapi: 3.2.0
info:
  description: Cohesity API provides a RESTful interface to access the various data management operations on Cohesity cluster and Helios.
  title: Cohesity REST Recoveries API
  version: '2.0'
servers:
- url: /v2
tags:
- name: Recoveries
paths:
  /data-protect/recoveries:
    get:
      description: Lists the Recoveries.
      tags:
      - Recoveries
      summary: Lists the Recoveries
      operationId: GetRecoveries
      parameters:
      - description: Filter Recoveries for given ids.
        name: ids
        in: query
        schema:
          type: array
          items:
            pattern: ^\d+:\d+:\d+$
            type: string
      - description: 'Returns only child recoveries if passed as true. This filter should always be used along with ''ids'' filter. '
        name: returnOnlyChildRecoveries
        in: query
        schema:
          type: boolean
      - description: TenantIds contains ids of the organizations for which recoveries are to be returned.
        name: tenantIds
        in: query
        schema:
          type: array
          items:
            type: string
      - description: Specifies if objects of all the organizations under the hierarchy of the logged in user's organization should be returned.
        name: includeTenants
        in: query
        schema:
          type: boolean
      - description: Returns the recoveries which are started after the specific time. This value should be in Unix timestamp epoch in microseconds.
        name: startTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: Returns the recoveries which are started before the specific time. This value should be in Unix timestamp epoch in microseconds.
        name: endTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: Filter by Storage Domain id. Only recoveries writing data to this Storage Domain will be returned.
        name: storageDomainId
        in: query
        schema:
          type: integer
          format: int64
      - description: Specifies the snapshot's target type from which recovery has been performed.
        name: snapshotTargetType
        in: query
        schema:
          type: array
          items:
            enum:
            - Local
            - Archival
            type: string
          uniqueItems: true
      - description: Specifies the snapshot's archival target type from which recovery has been performed. This parameter applies only if 'snapshotTargetType' is 'Archival'.
        name: archivalTargetType
        in: query
        schema:
          type: array
          items:
            enum:
            - Tape
            - Cloud
            - Nas
            type: string
          uniqueItems: true
      - description: Specifies the list of snapshot environment types to filter Recoveries. If empty, Recoveries related to all environments will be returned.
        name: snapshotEnvironments
        in: query
        schema:
          type: array
          items:
            enum:
            - kVMware
            - kHyperV
            - kAzure
            - kGCP
            - kKVM
            - kAcropolis
            - kAWS
            - kPhysical
            - kGPFS
            - kElastifile
            - kNetapp
            - kGenericNas
            - kIsilon
            - kFlashBlade
            - kPure
            - kSQL
            - kExchange
            - kAD
            - kOracle
            - kView
            - kRemoteAdapter
            - kO365
            - kKubernetes
            - kCassandra
            - kMongoDB
            - kCouchbase
            - kHdfs
            - kHive
            - kHBase
            - kUDA
            type: string
          uniqueItems: true
      - description: Specifies the list of run status to filter Recoveries. If empty, Recoveries with all run status will be returned.
        name: status
        in: query
        schema:
          type: array
          items:
            enum:
            - Accepted
            - Running
            - Canceled
            - Canceling
            - Failed
            - Missed
            - Succeeded
            - SucceededWithWarning
            - OnHold
            type: string
          uniqueItems: true
      - description: Specifies the list of recovery actions to filter Recoveries. If empty, Recoveries related to all actions will be returned.
        name: recoveryActions
        in: query
        schema:
          type: array
          items:
            enum:
            - RecoverVMs
            - RecoverFiles
            - InstantVolumeMount
            - RecoverVmDisks
            - RecoverVApps
            - RecoverVAppTemplates
            - RecoverRDS
            - RecoverAurora
            - RecoverApps
            - RecoverNasVolume
            - RecoverPhysicalVolumes
            - RecoverSystem
            - CloneAppView
            - RecoverSanVolumes
            - RecoverMailbox
            - RecoverOneDrive
            - RecoverSharePoint
            - RecoverPublicFolders
            - RecoverMsGroup
            - RecoverMsTeam
            - RecoverNamespaces
            - RecoverObjects
            - DownloadFilesAndFolders
            type: string
      responses:
        '200':
          $ref: '#/components/responses/GetRecoveries'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    post:
      description: Performs a Recovery.
      tags:
      - Recoveries
      summary: Performs a Recovery
      operationId: CreateRecovery
      responses:
        '201':
          $ref: '#/components/responses/CreateRecoveryResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              x-cohesity-discriminator-ref: CommonRecoveryRequestParams
              $ref: '#/components/schemas/CommonRecoveryRequestParams35493c9a-e370-4716-8cfd-4d811134265e'
        description: Specifies the parameters to create a Recovery.
        required: true
  /data-protect/recoveries/downloadFilesAndFoldersRecovery:
    post:
      description: Creates a download files and folders recovery.
      tags:
      - Recoveries
      summary: Create a download files and folders recovery
      operationId: CreateDownloadFilesAndFoldersRecovery
      responses:
        '201':
          $ref: '#/components/responses/CreateDownloadFilesAndFoldersRecoveryResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadFilesAndFoldersRequestParams'
        description: Specifies the parameters to create a download files and folder recovery.
        required: true
  /data-protect/recoveries/{id}:
    get:
      description: Get Recovery for a given id.
      tags:
      - Recoveries
      summary: Get Recovery for a given id
      operationId: GetRecoveryById
      parameters:
      - description: Specifies the id of a Recovery.
        name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d+:\d+:\d+$
      - description: Specifies if objects of all the organizations under the hierarchy of the logged in user's organization should be returned.
        name: includeTenants
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/GetRecovery'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
  /data-protect/recoveries/{id}/cancel:
    post:
      description: Cancel Recovery for a given id.
      tags:
      - Recoveries
      summary: Cancel Recovery for a given id
      operationId: CancelRecoveryById
      parameters:
      - description: Specifies the id of a Recovery.
        name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d+:\d+:\d+$
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
  /data-protect/recoveries/{id}/debug-logs:
    get:
      description: Get the debug logs for a particular recovery operation.
      tags:
      - Recoveries
      summary: Get the debug logs for a particular recovery operation
      operationId: GetRecoveryDebugLogs
      parameters:
      - description: Specifies the id of a Recovery job.
        name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d+:\d+:\d+$
      responses:
        '200':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
  /data-protect/recoveries/{id}/downloadFiles:
    get:
      description: Download files from the given download file recovery.
      tags:
      - Recoveries
      summary: Download files from the given download file recovery
      operationId: DownloadFilesFromRecovery
      parameters:
      - description: Specifies the id of a Recovery.
        name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d+:\d+:\d+$
      - description: Specifies the start offset of file chunk to be downloaded.
        name: startOffset
        in: query
        schema:
          type: integer
          format: int64
      - description: Specifies the length of bytes to download. This can not be greater than 8MB (8388608 byets)
        name: length
        in: query
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
  /data-protect/recoveries/{id}/tearDown:
    post:
      description: Tear down Recovery for a given id.
      tags:
      - Recoveries
      summary: Tear down Recovery for a given id
      operationId: TearDownRecoveryById
      parameters:
      - description: Specifies the id of a Recovery.
        name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d+:\d+:\d+$
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
  /data-protect/snapshots/{snapshotsId}/downloadFile:
    get:
      description: Download an indexed file from a snapshot.
      tags:
      - Recoveries
      summary: Download an indexed file
      operationId: DownloadIndexedFile
      parameters:
      - description: Specifies the snapshot id to download from.
        name: snapshotsId
        in: path
        required: true
        schema:
          type: string
      - description: Specifies the path to the file to download. If no path is specified and snapshot environment is kVMWare, VMX file for VMware will be downloaded. For other snapshot environments, this field must be specified.
        name: filePath
        in: query
        schema:
          type: string
      - description: Specifies the number of attempts the protection run took to create this file.
        name: retryAttempt
        in: query
        schema:
          type: integer
          format: int64
      - description: Specifies the start offset of file chunk to be downloaded.
        name: startOffset
        in: query
        schema:
          type: integer
          format: int64
      - description: Specifies the length of bytes to download. This can not be greater than 8MB (8388608 byets)
        name: length
        in: query
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
components:
  schemas:
    FilterDocumentsParams:
      description: Specifies the parameters to filter documents to be restored.
      title: Recover Couchbase Object Params.
      required:
      - documentFilterType
      properties:
        documentFilterType:
          description: Specifies the filter type for Documents to be restored.
          type:
          - string
          - 'null'
          enum:
          - NONE
          - ID
          - CONTENT
          x-order: 0
        idRegex:
          description: A regular expression to match Documents ID's to be restored.
          type:
          - string
          - 'null'
          x-order: 1
        filterExpression:
          description: A filter expression to match Documents content to be restored.
          type:
          - string
          - 'null'
          x-order: 2
    VmwareRecoverDisksTargetSourceConfig:
      description: Specifies the configuration for restoring disks to a different VM than the one from which the snapshot was taken.
      type: object
      required:
      - disks
      - sourceId
      properties:
        sourceId:
          description: Specifies the source ID of the VM to which the disks will be restored.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 0
        disks:
          description: Specifies the disks to be recovered and the location to which they will be recovered.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/VmwareRecoverTargetSourceDiskParams'
          x-order: 1
    VmwareRecoverDisksOriginalSourceConfig:
      description: Specifies the configuration for restoring a disk to the original VM from which the snapshot was taken.
      type: object
      required:
      - disks
      properties:
        disks:
          description: Specifies the disks to be recovered and the location to which they will be recovered.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/VmwareRecoverOriginalSourceDiskParams'
          x-order: 0
    CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093:
      description: Specifies the common response parameters to create a Recovery
      type: object
      title: Common Recovery Response Params.
      properties:
        id:
          description: Specifies the id of the Recovery.
          type:
          - string
          - 'null'
          pattern: ^\d+:\d+:\d+$
          x-order: 0
        name:
          description: Specifies the name of the Recovery.
          type:
          - string
          - 'null'
          x-order: 1
        startTimeUsecs:
          description: Specifies the start time of the Recovery in Unix timestamp epoch in microseconds.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 2
        endTimeUsecs:
          description: Specifies the end time of the Recovery in Unix timestamp epoch in microseconds. This field will be populated only after Recovery is finished.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 3
        status:
          description: Status of the Recovery. 'Running' indicates that the Recovery is still running. 'Canceled' indicates that the Recovery has been cancelled. 'Canceling' indicates that the Recovery is in the process of being cancelled. 'Failed' indicates that the Recovery has failed. 'Succeeded' indicates that the Recovery has finished successfully. 'SucceededWithWarning' indicates that the Recovery finished successfully, but there were some warning messages.
          type:
          - string
          - 'null'
          enum:
          - Accepted
          - Running
          - Canceled
          - Canceling
          - Failed
          - Missed
          - Succeeded
          - SucceededWithWarning
          - OnHold
          x-order: 4
        progressTaskId:
          description: Progress monitor task id for Recovery.
          type:
          - string
          - 'null'
          x-order: 5
        snapshotEnvironment:
          description: Specifies the type of snapshot environment for which the Recovery was performed.
          type: string
          enum:
          - kVMware
          - kHyperV
          - kAzure
          - kGCP
          - kKVM
          - kAcropolis
          - kAWS
          - kPhysical
          - kGPFS
          - kElastifile
          - kNetapp
          - kGenericNas
          - kIsilon
          - kFlashBlade
          - kPure
          - kSQL
          - kExchange
          - kAD
          - kOracle
          - kView
          - kRemoteAdapter
          - kO365
          - kKubernetes
          - kCassandra
          - kMongoDB
          - kCouchbase
          - kHdfs
          - kHive
          - kHBase
          - kUDA
          x-order: 6
        recoveryAction:
          description: Specifies the type of recover action.
          type: string
          enum:
          - RecoverVMs
          - RecoverFiles
          - InstantVolumeMount
          - RecoverVmDisks
          - RecoverVApps
          - RecoverVAppTemplates
          - RecoverRDS
          - RecoverAurora
          - RecoverApps
          - RecoverNasVolume
          - RecoverPhysicalVolumes
          - RecoverSystem
          - CloneAppView
          - RecoverSanVolumes
          - RecoverMailbox
          - RecoverOneDrive
          - RecoverSharePoint
          - RecoverPublicFolders
          - RecoverMsGroup
          - RecoverMsTeam
          - RecoverNamespaces
          - RecoverObjects
          - DownloadFilesAndFolders
          x-order: 7
        permissions:
          description: Specifies the list of tenants that have permissions for this recovery.
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Tenant'
          x-order: 8
        creationInfo:
          description: Specifies the information about the creation of the recovery.
          type:
          - object
          - 'null'
          x-order: 9
          $ref: '#/components/schemas/CreationInfo'
        canTearDown:
          description: Specifies whether it's possible to tear down the objects created by the recovery.
          type:
          - boolean
          - 'null'
          x-order: 10
        tearDownStatus:
          description: Specifies the status of the tear down operation. This is only set when the canTearDown is set to true. 'DestroyScheduled' indicates that the tear down is ready to schedule. 'Destroying' indicates that the tear down is still running. 'Destroyed' indicates that the tear down succeeded. 'DestroyError' indicates that the tear down failed.
          type:
          - string
          - 'null'
          enum:
          - DestroyScheduled
          - Destroying
          - Destroyed
          - DestroyError
          x-order: 11
        tearDownMessage:
          description: Specifies the error message about the tear down operation if it fails.
          type:
          - string
          - 'null'
          x-order: 12
        messages:
          description: Specifies messages about the recovery.
          type:
          - array
          - 'null'
          items:
            type: string
          x-order: 13
        isParentRecovery:
          description: Specifies whether the current recovery operation has created child recoveries. This is currently used in SQL recovery where multiple child recoveries can be tracked under a common/parent recovery.
          type:
          - boolean
          - 'null'
          x-order: 14
        parentRecoveryId:
          description: If current recovery is child recovery triggered by another parent recovery operation, then this field willt specify the id of the parent recovery.
          type:
          - string
          - 'null'
          pattern: ^\d+:\d+:\d+$
          x-order: 15
      x-cohesity-discriminator-details:
        propertyName: snapshotEnvironment
      x-discriminator:
        mapping:
          kVMware: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093RecoverVmwareParamsWrapper'
          kAWS: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093RecoverAwsParamsWrapper'
          kGCP: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093RecoverGcpParamsWrapper'
          kAzure: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093RecoverAzureParamsWrapper'
          kKVM: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093RecoverKvmParamsWrapper'
          kAcropolis: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093RecoverAcropolisParamsWrapper'
          kSQL: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093RecoverSqlParamsWrapper'
          kNetapp: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093RecoverNetappParamsWrapper'
          kGenericNas: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093RecoverGenericNasParamsWrapper'
          kIsilon: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093RecoverIsilonParamsWrapper'
          kFlashBlade: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093RecoverFlashbladeParamsWrapper'
          kElastifile: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093RecoverElastifileParamsWrapper'
          kGPFS: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093RecoverGpfsParamsWrapper'
          kPhysical: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093RecoverPhysicalParamsWrapper'
          kHyperV: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093RecoverHyperVParamsWrapper'
          kExchange: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093RecoverExchangeParamsWrapper'
          kCassandra: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093CassandraParamsWrapper'
          kUDA: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093UdaParamsWrapper'
          kCouchbase: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093CouchbaseParamsWrapper'
          kHbase: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093HbaseParamsWrapper'
          kHdfs: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093HdfsParamsWrapper'
          kHive: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093HiveParamsWrapper'
          kMongoDB: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093MongodbParamsWrapper'
          kPure: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093RecoverPureParamsWrapper'
          kO365: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093RecoverO365ParamsWrapper'
          kKubernetes: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093RecoverKubernetesParamsWrapper'
          kOracle: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093RecoverOracleParamsWrapper'
          kView: '#/definitions/CommonRecoveryResponseParams335b0a6c-58b8-45e8-b7c1-9a65fb375093RecoverViewParamsWrapper'
        propertyName: snapshotEnvironment
    ObjectTypeVCenterParams:
      type: object
      title: Object Type VCenter Params
      properties:
        isCloudEnv:
          description: Specifies that registered vCenter source is a VMC (VMware Cloud) environment or not.
          type:
          - boolean
          - 'null'
          x-order: 0
    DownloadFilesAndFoldersRequestParams:
      description: Specifies the parameters to create a download files and folders Recovery.
      type: object
      title: Download Files And Folders Recovery Params.
      required:
      - name
      - object
      - filesAndFolders
      properties:
        name:
          description: Specifies the name of the recovery task. This field must be set and must be a unique name.
          type:
          - string
          - 'null'
          x-order: 0
        object:
          description: Specifies the snapshot object from which to download files and folders.
          type:
          - object
          - 'null'
          x-order: 1
          $ref: '#/components/schemas/CommonRecoverObjectSnapshotParams'
        filesAndFolders:
          description: Specifies the list of files and folders to download.
          type:
          - array
          - 'null'
          minItems: 1
          items:
            $ref: '#/components/schemas/FilesAndFoldersObject'
          x-order: 2
    RecoverGenericNasToGenericNasFilesTargetParams:
      description: Specifies the params of the Generic Nas recovery target.
      type: object
      title: Recover Generic Nas To Generic Nas Files Target Params.
      required:
      - recoverToNewSource
      properties:
        recoverToNewSource:
          description: Specifies the parameter whether the recovery should be performed to a new or the original Generic Nas target.
          type: boolean
          x-order: 0
        newSourceConfig:
          description: Specifies the new destination Source configuration parameters where the files will be recovered. This is mandatory if recoverToNewSource is set to true.
          allOf:
          - $ref: '#/components/schemas/RecoverOtherNasToGenericNasFilesTargetParams'
          - {}
          x-order: 1
        originalSourceConfig:
          description: Specifies the Source configuration if files are being recovered to original Source. If not specified, all the configuration parameters will be retained.
          allOf:
          - $ref: '#/components/schemas/OriginalGenericNasFilesTargetParams'
          - {}
          x-order: 2
    NoSqlObjectProperty:
      description: Specifies an Object property as a set of key-value pair for NoSQL objects.
      required:
      - key
      - value
      properties:
        key:
          description: Specifies the key of the property.
          type:
          - string
          - 'null'
          x-order: 0
        value:
          description: specifies the value of the property.
          type:
          - string
          - 'null'
          x-order: 1
    RecoverOracleParams:
      description: Specifies the recovery options specific to oracle environment.
      type: object
      title: Recover Oracle environment params.
      required:
      - objects
      - recoveryAction
      properties:
        objects:
          description: Specifies the list of parameters for list of objects to be recovered.
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RecoverOracleDbSnapshotParams'
          x-order: 0
        recoveryAction:
          description: Specifies the type of recover action to be performed.
          type: string
          enum:
          - RecoverApps
          - CloneAppView
          x-order: 1
        recoverAppParams:
          description: Specifies the parameters to recover Oracle databases.
          allOf:
