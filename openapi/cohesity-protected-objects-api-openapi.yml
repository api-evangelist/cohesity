            type:
            - integer
            - 'null'
            format: int64
            x-order: 12
          failedObjectsCount:
            description: Specifies the count of objects for which backup failed.
            type:
            - integer
            - 'null'
            format: int64
            x-order: 13
          cancelledObjectsCount:
            description: Specifies the count of objects for which backup was cancelled.
            type:
            - integer
            - 'null'
            format: int64
            x-order: 14
