openapi: 3.2.0
info:
  description: Cohesity API provides a RESTful interface to access the various data management operations on Cohesity cluster and Helios.
  title: Cohesity REST Protected Objects API
  version: '2.0'
servers:
- url: /v2
tags:
- name: Protected Objects
paths:
  /data-protect/protected-objects:
    post:
      description: Create Protect Objects Backup.
      tags:
      - Protected Objects
      summary: Create Object Backup
      operationId: ProtectObjectsOfAnyType
      responses:
        '207':
          $ref: '#/components/responses/CreateProtectedObjectsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProtectedObjectsRequest'
        description: Specifies the parameters to protect objects.
        required: true
  /data-protect/protected-objects/actions:
    post:
      description: Perform actions on Protected Objects.
      tags:
      - Protected Objects
      summary: Perform Actions on Protect Objects
      operationId: PerformActionOnProtectObjects
      responses:
        '202':
          $ref: '#/components/responses/ProtectedObjectActionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtectdObjectsActionRequest'
        description: Specifies the parameters to perform an action on an already protected object.
        required: true
  /data-protect/protected-objects/{id}:
    put:
      description: Update Protected object backup configuration given a object id.
      tags:
      - Protected Objects
      summary: Update Object Backup
      operationId: UpdateProtectedObjectsOfAnyType
      parameters:
      - description: Specifies the id of the Protected Object.
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/GetProtectedObjectResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProtectedObjectsRequest'
        description: Specifies the parameters to perform an update on protected objects.
        required: true
components:
  schemas:
    CommonVmwareObjectParams:
      description: Specifies the common object parameters required for VMware protection.
      type: object
      properties:
        excludeDisks:
          description: Specifies a list of disks to exclude from being protected. This is only applicable to VM objects.
          type: array
          items:
            $ref: '#/components/schemas/DiskInfo'
          x-order: 0
        truncateExchangeLogs:
          description: Specifies whether or not to truncate MS Exchange logs while taking an app consistent snapshot of this object. This is only applicable to objects which have a registered MS Exchange app.
          type:
          - boolean
          - 'null'
          x-order: 1
    AwsCloudSpinParams:
      description: Specifies various resources when converting and deploying a VM to AWS.
      type: object
      title: AWS Parameters.
      required:
      - region
      properties:
        region:
          description: Specifies id of the AWS region in which to deploy the VM.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 0
        vpcId:
          description: Specifies id of the Virtual Private Cloud to chose for the instance type.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 1
        subnetId:
          description: Specifies id of the subnet within above VPC.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 2
    CommonPostBackupScriptParams:
      description: Specifies the common params for PostBackup scripts.
      title: Common PostBackup Script Params
      allOf:
      - $ref: '#/components/schemas/CommonPrePostScriptParams'
    AzureTargetConfig:
      description: Specifies the configuration for adding Azure as replication target
      type: object
      title: Azure Target Configuration
      required:
      - sourceId
      properties:
        sourceId:
          description: Specifies the source id of the Azure protection source registered on Cohesity cluster.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 0
        name:
          description: Specifies the name of the Azure Replication target.
          type:
          - string
          - 'null'
          x-order: 1
          readOnly: true
        resourceGroup:
          description: Specifies id of the Azure resource group used to filter regions in UI.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 2
        resourceGroupName:
          description: Specifies name of the Azure resource group used to filter regions in UI.
          type:
          - string
          - 'null'
          x-order: 3
          readOnly: true
        storageAccount:
          description: Specifies id of the storage account of Azure replication target which will contain storage container.
          type:
          - integer
          - 'null'
          x-order: 4
          readOnly: true
        storageAccountName:
          description: Specifies name of the storage account of Azure replication target which will contain storage container.
          type:
          - string
          - 'null'
          x-order: 5
          readOnly: true
        storageContainer:
          description: Specifies id of the storage container of Azure Replication target.
          type:
          - integer
          - 'null'
          x-order: 6
          readOnly: true
        storageContainerName:
          description: Specifies name of the storage container of Azure Replication target.
          type:
          - string
          - 'null'
          x-order: 7
          readOnly: true
        storageResourceGroup:
          description: Specifies id of the storage resource group of Azure Replication target.
          type:
          - integer
          - 'null'
          x-order: 8
          readOnly: true
        storageResourceGroupName:
          description: Specifies name of the storage resource group of Azure Replication target.
          type:
          - string
          - 'null'
          x-order: 9
          readOnly: true
    GenericNasObjectProtectionUpdateRequestParams:
      description: Specifies the update parameters which are specific to Generic NAS object protection.
      type: object
      allOf:
      - $ref: '#/components/schemas/CommonNasProtectionParams'
    ObjectTypeVCenterParams:
      type: object
      title: Object Type VCenter Params
      properties:
        isCloudEnv:
          description: Specifies that registered vCenter source is a VMC (VMware Cloud) environment or not.
          type:
          - boolean
          - 'null'
          x-order: 0
    MssqlObjectProtectionParams:
      description: Specifies the parameters specific to MSSQL Object Protection.
      type: object
      required:
      - objectProtectionType
      properties:
        objectProtectionType:
          description: Specifies the MSSQL Object Protection type.
          type: string
          enum:
          - kFile
          - kVolume
          - kNative
          x-order: 0
        fileObjectProtectionTypeParams:
          description: Specifies the File based MSSQL Object Protection params.
          type:
          - object
          - 'null'
          x-order: 1
          $ref: '#/components/schemas/MssqlFileObjectProtectionParams'
        nativeObjectProtectionTypeParams:
          description: Specifies the Native based MSSQL Object Protection params.
          type:
          - object
          - 'null'
          x-order: 2
          $ref: '#/components/schemas/MssqlNativeObjectProtectionParams'
    EnvSpecificObjectProtectionUpdateRequestParams:
      description: Specifies the update parameters which are specific to adapter identified by enviournment.
      type: object
      properties:
        environment:
          description: Specifies the environment for current object.
          type:
          - string
          - 'null'
          enum:
          - kVMware
          - kHyperV
          - kAzure
          - kGCP
          - kKVM
          - kAcropolis
          - kAWS
          - kPhysical
          - kGPFS
          - kElastifile
          - kNetapp
          - kGenericNas
          - kIsilon
          - kFlashBlade
          - kPure
          - kSQL
          - kExchange
          - kAD
          - kOracle
          - kView
          - kRemoteAdapter
          - kO365
          - kKubernetes
          - kCassandra
          - kMongoDB
          - kCouchbase
          - kHdfs
          - kHive
          - kHBase
          - kUDA
          x-order: 0
        vmwareParams:
          description: Specifies the parameters which are specific to VMware related Object Backup.
          type:
          - object
          - 'null'
          x-order: 1
          $ref: '#/components/schemas/VmwareObjectProtectionUpdateRequestParams'
        genericNasParams:
          description: Specifies the parameters which are specific to Generic Nas related Object Backup.
          type:
          - object
          - 'null'
          x-order: 2
          $ref: '#/components/schemas/GenericNasObjectProtectionUpdateRequestParams'
        gpfsParams:
          description: Specifies the parameters which are specific to Gpfs related Object Backup.
          type:
          - object
          - 'null'
          x-order: 3
          $ref: '#/components/schemas/GpfsObjectProtectionUpdateRequestParams'
        elastifileParams:
          description: Specifies the parameters which are specific to Elastifile related Object Backup.
          type:
          - object
          - 'null'
          x-order: 4
          $ref: '#/components/schemas/ElastifileObjectProtectionUpdateRequestParams'
        netappParams:
          description: Specifies the parameters which are specific to Netapp related Object Backup.
          type:
          - object
          - 'null'
          x-order: 5
          $ref: '#/components/schemas/NetappObjectProtectionUpdateRequestParams'
        isilonParams:
          description: Specifies the parameters which are specific to Isilon related Object Backup.
          type:
          - object
          - 'null'
          x-order: 6
          $ref: '#/components/schemas/IsilonObjectProtectionUpdateRequestParams'
        flashbladeParams:
          description: Specifies the parameters which are specific to Flashblade related Object Backup.
          type:
          - object
          - 'null'
          x-order: 7
          $ref: '#/components/schemas/FlashbladeObjectProtectionUpdateRequestParams'
        mssqlParams:
          description: Specifies the parameters which are specific to Mssql related Object Backup.
          type:
          - object
          - 'null'
          x-order: 8
          $ref: '#/components/schemas/MssqlObjectProtectionUpdateRequestParams'
        office365UserMailboxParams:
          description: Specifies the parameters which are specific to Microsoft 365 user mailbox related Object Backup.
          type:
          - object
          - 'null'
          x-order: 9
          $ref: '#/components/schemas/Office365UserMailboxObjectProtectionUpdateRequestParams'
    NetappObjectProtectionUpdateRequestParams:
      description: Specifies the update parameters which are specific to Netapp object protection.
      type: object
      allOf:
      - $ref: '#/components/schemas/CommonNasProtectionParams'
      - $ref: '#/components/schemas/NetappObjectProtectionParams'
    CommonMSSQLProtectionGroupParams:
      description: Specifies the common params to create a MSSQL Protection Group.
      type: object
      title: Common MSSQL Protection Group Request Params.
      properties:
        userDbBackupPreferenceType:
          description: Specifies the preference type for backing up user databases on the host.
          type:
          - string
          - 'null'
          enum:
          - kBackupAllDatabases
          - kBackupAllExceptAAGDatabases
          - kBackupOnlyAAGDatabases
          x-order: 0
        backupSystemDbs:
          description: Specifies whether to backup system databases. If not specified then parameter is set to true.
          type:
          - boolean
          - 'null'
          x-order: 1
        useAagPreferencesFromServer:
          description: Specifies whether or not the AAG backup preferences specified on the SQL Server host should be used.
          type:
          - boolean
          - 'null'
          x-order: 2
        aagBackupPreferenceType:
          description: Specifies the preference type for backing up databases that are part of an AAG. If not specified, then default preferences of the AAG server are applied. This field wont be applicable if user DB preference is set to skip AAG databases.
          type:
          - string
          - 'null'
          enum:
          - kPrimaryReplicaOnly
          - kSecondaryReplicaOnly
          - kPreferSecondaryReplica
          - kAnyReplica
          x-order: 3
        fullBackupsCopyOnly:
          description: Specifies whether full backups should be copy-only.
          type:
          - boolean
          - 'null'
          x-order: 4
        prePostScript:
          description: Specifies the pre and post script parameters associated with a protection group.
          type:
          - object
          - 'null'
          x-order: 5
          $ref: '#/components/schemas/PrePostScriptParams'
        excludeFilters:
          description: Specifies the list of exclusion filters applied during the group creation or edit. These exclusion filters can be wildcard supported strings or regular expressions. Objects satisfying the will filters will be excluded during backup and also auto protected objects will be ignored if filtered by any of the filters.
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Filter'
          x-order: 6
    CommonMssqlFileObjectProtectionParams:
      description: Specifies the common params to create a File based MSSQL Object Protection.
      allOf:
      - $ref: '#/components/schemas/CommonMSSQLProtectionGroupParams'
    GoogleTiers:
      description: Specifies Google tiers.
      type: object
      required:
      - tiers
      properties:
        tiers:
          description: Specifies the tiers that are used to move the archived backup from current tier to next tier. The order of the tiers determines which tier will be used next for moving the archived backup. The first tier input should always be default tier where backup will be acrhived. Each tier specifies how much time after the backup will be moved to next tier from the current tier.
          type:
          - array
          - 'null'
          minLength: 1
          items:
            $ref: '#/components/schemas/GoogleTier'
          x-order: 0
    CommonPreBackupScriptParams:
      description: Specifies the common params for PreBackup scripts.
      title: Common PreBackup Script Params
      allOf:
      - $ref: '#/components/schemas/CommonPrePostScriptParams'
      - type: object
        properties:
          continueOnError:
            description: Specifies if the script needs to continue even if there is an occurence of an error. If this flag is set to true, then Backup Run will start even if the pre backup script fails. If not specified or false, then backup run will not start when script fails.
            type:
            - boolean
            - 'null'
            x-order: 0
    UnprotectActionObjectLevelResponse:
      description: Specifies the infomration about status of Unprotect action.
      type: object
      properties:
        error:
          description: If the action fails for this object, then error will be return here.
          x-order: 0
          $ref: '#/components/schemas/Error'
    EnvSpecificObjectProtectionResponseParams:
      description: Specifies the parameters which are specific to adapter identified by enviournment.
      type: object
      properties:
        environment:
          description: Specifies the environment for current object.
          type:
          - string
          - 'null'
          enum:
          - kVMware
          - kHyperV
          - kAzure
          - kGCP
          - kKVM
          - kAcropolis
          - kAWS
          - kPhysical
          - kGPFS
          - kElastifile
          - kNetapp
          - kGenericNas
          - kIsilon
          - kFlashBlade
          - kPure
          - kSQL
          - kExchange
          - kAD
          - kOracle
          - kView
          - kRemoteAdapter
          - kO365
          - kKubernetes
          - kCassandra
          - kMongoDB
          - kCouchbase
          - kHdfs
          - kHive
          - kHBase
          - kUDA
          x-order: 0
        vmwareParams:
          description: Specifies the parameters which are specific to VMware related Object Backup.
          type:
          - object
          - 'null'
          x-order: 1
          $ref: '#/components/schemas/VmwareObjectProtectionResponseParams'
        genericNasParams:
          description: Specifies the parameters which are specific to Generic Nas related Object Backup.
          type:
          - object
          - 'null'
          x-order: 2
          $ref: '#/components/schemas/GenericNasObjectProtectionResponseParams'
        gpfsParams:
          description: Specifies the parameters which are specific to Gpfs related Object Backup.
          type:
          - object
          - 'null'
          x-order: 3
          $ref: '#/components/schemas/GpfsObjectProtectionResponseParams'
        elastifileParams:
          description: Specifies the parameters which are specific to Elastifile related Object Backup.
          type:
          - object
          - 'null'
          x-order: 4
          $ref: '#/components/schemas/ElastifileObjectProtectionResponseParams'
        netappParams:
          description: Specifies the parameters which are specific to Netapp related Object Backup.
          type:
          - object
          - 'null'
          x-order: 5
          $ref: '#/components/schemas/NetappObjectProtectionResponseParams'
        isilonParams:
          description: Specifies the parameters which are specific to Isilon related Object Backup.
          type:
          - object
          - 'null'
          x-order: 6
          $ref: '#/components/schemas/IsilonObjectProtectionResponseParams'
        flashbladeParams:
          description: Specifies the parameters which are specific to Flashblade related Object Backup.
          type:
          - object
          - 'null'
          x-order: 7
          $ref: '#/components/schemas/FlashbladeObjectProtectionResponseParams'
        mssqlParams:
          description: Specifies the parameters which are specific to Mssql related Object Backup.
          type:
          - object
          - 'null'
          x-order: 8
          $ref: '#/components/schemas/MssqlObjectProtectionResponseParams'
        office365UserMailboxParams:
          description: Specifies the parameters which are specific to Microsoft 365 user mailbox related Object Backup.
          type:
          - object
          - 'null'
          x-order: 9
          $ref: '#/components/schemas/Office365UserMailboxObjectProtectionResponseParams'
    AzureCloudSpinParams:
      description: Specifies various resources when converting and deploying a VM to Azure.
      type: object
      title: Azure Parameters.
      properties:
        networkResourceGroupId:
          description: Specifies id of the resource group for the selected virtual network.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 0
        resourceGroupId:
          description: Specifies id of the Azure resource group. Its value is globally unique within Azure.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 1
        storageAccountId:
          description: Specifies id of the storage account that will contain the storage container within which we will create the blob that will become the VHD disk for the cloned VM.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 2
        storageContainerId:
          description: Specifies id of the storage container within the above storage account.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 3
        storageResourceGroupId:
          description: Specifies id of the resource group for the selected storage account.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 4
        availabilitySetId:
          description: Specifies the availability set.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 5
        tempVmResourceGroupId:
          description: Specifies id of the temporary Azure resource group.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 6
        tempVmStorageAccountId:
          description: Specifies id of the temporary VM storage account that will contain the storage container within which we will create the blob that will become the VHD disk for the cloned VM.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 7
        tempVmStorageContainerId:
          description: Specifies id of the temporary VM storage container within the above storage account.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 8
        tempVmSubnetId:
          description: Specifies Id of the temporary VM subnet within the above virtual network.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 9
        tempVmVirtualNetworkId:
          description: Specifies Id of the temporary VM Virtual Network.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 10
    FlashbladeObjectProtectionRequestParams:
      description: Specifies the parameters which are specific to Flashblade object protection.
      type: object
      allOf:
      - type: object
        required:
        - objects
        properties:
          objects:
            description: Specifies the objects to be protected.
            type: array
            minItems: 1
            uniqueItems: true
            items:
              $ref: '#/components/schemas/ProtectionObjectInput'
            x-order: 0
      - $ref: '#/components/schemas/CommonNasProtectionParams'
      - $ref: '#/components/schemas/FlashbladeObjectProtectionParams'
    GpfsObjectProtectionResponseParams:
      description: Specifies the parameters which are specific to Gpfs object protection.
      type: object
      allOf:
      - $ref: '#/components/schemas/CommonNasProtectionParams'
      - $ref: '#/components/schemas/GpfsObjectProtectionParams'
    ProtectedObjectActionResponse:
      description: Specifies the response upon performing an action on protected objects.
      type: object
      properties:
        action:
          description: Specifies the action type to be performed on object getting protected. Based on selected action, provide the action params.
          type: string
          enum:
          - Pause
          - Resume
          - UnProtect
          - ProtectNow
          x-order: 0
        objects:
          description: Specifies the list of objects on which the provided action was performed.
          type: array
          items:
            $ref: '#/components/schemas/ActionObjectLevelResponse'
          x-order: 1
    AWSTier:
      description: Specifies the settings for a aws tier.
      type: object
      allOf:
      - $ref: '#/components/schemas/CommonCloudTierSettings'
      - type: object
        required:
        - tierType
        properties:
          tierType:
            description: Specifies the AWS tier types.
            type:
            - string
            - 'null'
            enum:
            - kAmazonS3Standard
            - kAmazonS3StandardIA
            - kAmazonS3OneZoneIA
            - kAmazonS3IntelligentTiering
            - kAmazonS3Glacier
            - kAmazonS3GlacierDeepArchive
            x-order: 0
    Tenant:
      description: Specifies a tenant object.
      type: object
      title: Tenant
      properties:
        id:
          description: Specifies the id of the tenant.
          type:
          - string
          - 'null'
          x-order: 0
        name:
          description: Specifies the name of the tenant.
          type:
          - string
          - 'null'
          x-order: 1
    CreateProtectedObjectsRequest:
      description: Specifies the request for creating an object backup.
      type: object
      allOf:
      - type: object
        required:
        - objects
        properties:
          objects:
            description: Specifies the list of objects to be protected. Multiple objects from different adapters can be provided as input.
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/EnvSpecificObjectProtectionRequestParams'
            x-order: 0
      - $ref: '#/components/schemas/CommonObjectProtectParams'
    ProtectionObjectInput:
      description: Specifies an object protected by a Protection Group.
      type: object
      required:
      - id
      properties:
        id:
          description: Specifies the ID of the object.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 0
        name:
          description: Specifies the name of the object.
          type:
          - string
          - 'null'
          x-order: 1
          readOnly: true
    NetappObjectProtectionResponseParams:
      description: Specifies the parameters which are specific to Netapp object protection.
      type: object
      allOf:
      - $ref: '#/components/schemas/CommonNasProtectionParams'
      - $ref: '#/components/schemas/NetappObjectProtectionParams'
    ElastifileObjectProtectionResponseParams:
      description: Specifies the parameters which are specific to Elastifile object protection.
      type: object
      allOf:
      - $ref: '#/components/schemas/CommonNasProtectionParams'
      - $ref: '#/components/schemas/ElastifileObjectProtectionParams'
    IsilonObjectProtectionResponseParams:
      description: Specifies the parameters which are specific to Isilon object protection.
      type: object
      allOf:
      - $ref: '#/components/schemas/CommonNasProtectionParams'
      - $ref: '#/components/schemas/IsilonObjectProtectionParams'
    FlashbladeObjectProtectionResponseParams:
      description: Specifies the parameters which are specific to Flashblade object protection.
      type: object
      allOf:
      - $ref: '#/components/schemas/CommonNasProtectionParams'
      - $ref: '#/components/schemas/FlashbladeObjectProtectionParams'
    Office365UserMailboxObjectProtectionResponseParams:
      description: Specifies the response parameters specific to Microsoft 365 User Mailbox object protection.
      type: object
      allOf:
      - $ref: '#/components/schemas/Office365ObjectProtectionCommonParams'
    CommonVmwareProtectionParams:
      description: Specifies the common parameters which are specific to VMware related protection.
      type: object
      properties:
        appConsistentSnapshot:
          description: Specifies whether or not to quiesce apps and the file system in order to take app consistent snapshots.
          type:
          - boolean
          - 'null'
          x-order: 0
        fallbackToCrashConsistentSnapshot:
          description: Specifies whether or not to fallback to a crash consistent snapshot in the event that an app consistent snapshot fails. This parameter defaults to true and only changes the behavior of the operation if 'appConsistentSnapshot' is set to 'true'.
          type:
          - boolean
          - 'null'
          x-order: 1
        skipPhysicalRDMDisks:
          description: Specifies whether or not to skip backing up physical RDM disks. Physical RDM disks cannot be backed up, so if you attempt to backup a VM with physical RDM disks and this value is set to 'false', then those VM backups will fail.
          type:
          - boolean
          - 'null'
          x-order: 2
        indexingPolicy:
          description: Specifies the indexing policy for VMs in this group.
          x-order: 3
          $ref: '#/components/schemas/IndexingPolicy'
        prePostScript:
          description: Specifies the pre and post script parameters associated with a given backup.
          type:
          - object
          - 'null'
          x-order: 4
          $ref: '#/components/schemas/PrePostScriptParams'
        leverageSanTransport:
          description: If this field is set to true, then the backup for the objects will be performed using dedicated storage area network (SAN) instead of LAN or managment network.
          type:
          - boolean
          - 'null'
          x-order: 5
        enableNBDSSLFallback:
          description: If this field is set to true and SAN transport backup fails, then backup will fallback to use NBDSSL transport. This field only applies if 'leverageSanTransport' is set to true.
          type:
          - boolean
          - 'null'
          x-order: 6
    CdpObjectLastRunInfo:
      description: Specifies the last backup information for a given CDP object.
      type: object
