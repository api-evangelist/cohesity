    VmwareCdpObject:
      description: Specifies the VMware specific CDP object details.
      type: object
      allOf:
      - $ref: '#/components/schemas/CdpObjectInfo'
      - type: object
        properties:
          ioFilterStatus:
            description: Specifies the state of CDP IO filter. CDP IO filter is an agent which will be installed on the object for performing continuous backup. <br> 1. 'kNotInstalled' specifies that CDP is enabled on this object but filter is not installed. <br> 2. 'kInstallFilterInProgress' specifies that IO filter installation is triggered and in progress. <br> 3. 'kFilterInstalledIOInactive' specifies that IO filter is installed but IO streaming is disabled due to missing backup or explicitly disabled by the user. <br> 4. 'kIOActivationInProgress' specifies that IO filter is activated to start streaming. <br> 5. 'kIOActive' specifies that filter is attached to the object and started streaming. <br> 6. 'kIODeactivationInProgress' specifies that deactivation has been initiated to stop the IO streaming. <br> 7. 'kUninstallFilterInProgress' specifies that uninstallation of IO filter is in progress.
            type:
            - string
            - 'null'
            enum:
            - NotInstalled
            - InstallFilterInProgress
            - FilterInstalledIOInactive
            - FilterInstalled
            - IOInactive
            - IOActivationInProgress
            - IOActive
            - IODeactivationInProgress
            - UninstallFilterInProgress
            - UpgradeFilterInProgress
            - UpgradeFilterFailed
            x-order: 0
          ioFilterErrorMessage:
            description: Specifies the error message related to IO filter if there is any.
            type:
            - string
            - 'null'
            x-order: 1
