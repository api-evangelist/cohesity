    TierLevelSettings:
      description: 'Specifies the settings tier levels configured with each archival target. The tier settings need to be applied in specific order and default tier should always be passed as first entry in tiers array. The following example illustrates how to configure tiering input for AWS tiering. Same type of input structure applied to other cloud platforms also. <br>If user wants to achieve following tiering for backup, <br>User Desired Tiering- <br><t>1.Archive Full back up for 12 Months <br><t>2.Tier Levels <br><t><t>[1,12] [ <br><t><t><t>s3 (1 to 2 months), (default tier) <br><t><t><t>s3 Intelligent tiering (3 to 6 months), <br><t><t><t>s3 One Zone (7 to 9 months) <br><t><t><t>Glacier (10 to 12 months)] <br><t>API Input <br><t><t>1.tiers-[ <br><t><t><t>{''tierType'': ''S3'',''moveAfterUnit'':''months'', <br><t><t><t>''moveAfter'':2 - move from s3 to s3Inte after 2 months}, <br><t><t><t>{''tierType'': ''S3Inte'',''moveAfterUnit'':''months'', <br><t><t><t>''moveAfter'':4 - move from S3Inte to Glacier after 4 months}, <br><t><t><t>{''tierType'': ''Glacier'', ''moveAfterUnit'':''months'', <br><t><t><t>''moveAfter'': 3 - move from Glacier to S3 One Zone after 3 months }, <br><t><t><t>{''tierType'': ''S3 One Zone'', ''moveAfterUnit'': nil, <br><t><t><t>''moveAfter'': nil - For the last record, ''moveAfter'' and ''moveAfterUnit'' <br><t><t><t>will be ignored since there are no further tier for data movement } <br><t><t><t>}]'
      type: object
      required:
      - cloudPlatform
      properties:
        cloudPlatform:
          description: Specifies the cloud platform to enable tiering.
          type:
          - string
          - 'null'
          enum:
          - AWS
          - Azure
          - Oracle
          - Google
          x-order: 0
        awsTiering:
          description: Specifies the settings for AWS Tiers.
          type:
          - object
          - 'null'
          x-order: 1
          $ref: '#/components/schemas/AWSTiers'
        azureTiering:
          description: Specifies the settings for Azure Tiers.
          type:
          - object
          - 'null'
          x-order: 2
          $ref: '#/components/schemas/AzureTiers'
        googleTiering:
          description: Specifies the settings for Google Tiers.
          type:
          - object
          - 'null'
          x-order: 3
          $ref: '#/components/schemas/GoogleTiers'
        oracleTiering:
          description: Specifies the settings for Oracle Tiers.
          type:
          - object
          - 'null'
          x-order: 4
          $ref: '#/components/schemas/OracleTiers'
    BackupAttempt:
      description: Specifies a backup attempt for an object.
      type: object
      title: Attempt information for an object.
      properties:
        startTimeUsecs:
          description: Specifies the start time of attempt in Unix epoch Timestamp(in microseconds) for an object.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 0
        endTimeUsecs:
          description: Specifies the end time of attempt in Unix epoch Timestamp(in microseconds) for an object.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 1
        admittedTimeUsecs:
          description: Specifies the time at which the backup task was admitted to run in Unix epoch Timestamp(in microseconds) for an object.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 2
        permitGrantTimeUsecs:
          description: Specifies the time when gatekeeper permit is granted to the backup task. If the backup task is rescheduled due to errors, the field is updated to the time when permit is granted again.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 3
        queueDurationUsecs:
          description: Specifies the duration between the startTime and when gatekeeper permit is granted to the backup task. If the backup task is rescheduled due to errors, the field is updated considering the time when permit is granted again. Queue duration = PermitGrantTimeUsecs - StartTimeUsecs
          type:
          - integer
          - 'null'
          format: int64
          x-order: 4
        snapshotCreationTimeUsecs:
          description: Specifies the time at which the source snapshot was taken in Unix epoch Timestamp(in microseconds) for an object.
          type:
          - integer
          - 'null'
          format: int64
          x-order: 5
        status:
          description: Status of the attempt for an object. 'Running' indicates that the run is still running. 'Canceled' indicates that the run has been canceled. 'Canceling' indicates that the run is in the process of being canceled. 'Failed' indicates that the run has failed. 'Missed' indicates that the run was unable to take place at the scheduled time because the previous run was still happening. 'Succeeded' indicates that the run has finished successfully. 'SucceededWithWarning' indicates that the run finished successfully, but there were some warning messages.
          type:
          - string
          - 'null'
          enum:
          - Accepted
          - Running
          - Canceled
          - Canceling
          - Failed
          - Missed
          - Succeeded
          - SucceededWithWarning
          - OnHold
          x-order: 6
