        format: int64
      - name: toTimeUsecs
        in: query
        description: If specified, the tasks created before this value are returned.
          Value is epoch timestamp in microseconds.
        type: integer
        format: int64
      responses:
        200:
          $ref: '#/responses/GetTasksResponse'
        default:
          $ref: '#/responses/ErrorResponse'
  /public/tasks/{id}:
    get:
      description: Get a tasks for a given id.
      tags:
      - Tasks
      summary: Fetch a Task
      operationId: GetTaskById
      parameters:
      - name: id
        in: path
        description: Specifies the id of the task.
        type: string
        required: true
      responses:
        200:
          $ref: '#/responses/GetTaskByIdResponse'
        default:
          $ref: '#/responses/ErrorResponse'
  /public/artifacts/{taskId}/{format}:
    get:
      description: Get the report artifact associated with task.
      tags:
      - Artifacts
      summary: Fetch report artifact for task
      operationId: GetArtifactForTask
      parameters:
      - name: taskId
        in: path
        description: Specifies the task for which report must be fetched.
        type: string
        required: true
      - name: format
        in: path
        description: Specifies the format in which the report is requested.
        type: string
        enum: *id008
        required: true
      responses:
        200:
          $ref: '#/responses/GetArtifactForTaskResponse'
        default:
          $ref: '#/responses/ErrorResponse'
  /public/resources:
    post:
      description: Get different kinds of resources available which are discovered
        on Helios. These values can be used for filtering options
      tags:
      - Filters
      summary: Get resources
      operationId: GetResources
      parameters:
      - name: body
        description: Request body params to get available resources.
        required: true
        schema:
          $ref: '#/definitions/GetResourcesRequest'
        in: body
      responses:
        200:
          $ref: '#/responses/GetResourcesResponse'
        default:
          $ref: '#/responses/ErrorResponse'
