      - name: id
        in: path
        description: Specifies the id of the report component.
        type: string
        required: true
      responses:
        200:
          $ref: '#/responses/GetComponentByIdResponse'
        default:
          $ref: '#/responses/ErrorResponse'
  /public/components/preview:
    post:
