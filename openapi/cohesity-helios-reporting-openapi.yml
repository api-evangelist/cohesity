      responses:
        200:
          $ref: '#/responses/GetComponentsPreviewResponse'
        default:
          $ref: '#/responses/ErrorResponse'
  /public/components/{id}/preview:
    post:
      description: Get preview for a component specified by Id.
      tags:
      - Components
      summary: Fetch Preview of a component.
      operationId: GetComponentPreview
      parameters:
      - name: id
        in: path
        description: Specifies the id of the component.
        type: string
        required: true
      - name: body
        description: Request body params in order to preview a given component.
        required: true
        schema:
          $ref: '#/definitions/ComponentPreviewParams'
        in: body
      responses:
        200:
          $ref: '#/responses/GetComponentPreviewResponse'
        default:
          $ref: '#/responses/ErrorResponse'
