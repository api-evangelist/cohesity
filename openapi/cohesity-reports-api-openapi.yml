openapi: 3.2.0
info:
  title: Cohesity Reports API
  version: '1.0'
  description: 'Operations tagged Reports across 2 of this provider''s published API definitions: cohesity-cluster-v1-openapi-original.yml, cohesity-helios-reporting-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://<CLUSTER_VIP>/irisservices/api/v1
- url: https://helios.cohesity.com/heliosreporting/api/v1
tags:
- name: Reports
paths:
  /public/reports/agents:
    get:
      description: 'Get the list of all the installed agents which includes the health status and

        upgradability of the agent.'
      tags:
      - Reports
      operationId: GetAgentDeploymentReport
      parameters:
      - x-go-name: HostOsType
        description: 'Specifies the host type on which the Cohesity agent is installed.

          Setting this parameter will filter the response based on host OS type on

          which agent is running.

          ''kLinux'' indicates the Linux operating system.

          ''kWindows'' indicates the Microsoft Windows operating system.

          ''kAix'' indicates the IBM AIX operating system.

          ''kSolaris'' indicates the Oracle Solaris operating system.

          ''kSapHana'' indicates the Sap Hana database system developed by SAP SE.

          ''kOther'' indicates the other types of operating system.'
        name: hostOsType
        in: query
        schema:
          type: array
          items:
            enum:
            - kLinux
            - kWindows
            - kAix
            - kSolaris
            - kSapHana
            - kOther
            type: string
      - x-go-name: CompactVersion
        description: 'Specifies the compact version of Cohesity agent. For example, 6.0.1.

          Setting this parameter will filter the response based on installed agent

          version.'
        name: compactVersion
        in: query
        schema:
          type: string
      - x-go-name: OutputFormat
        description: 'Specifies the format for the output such as ''csv'' or ''json''.

          If not specified, the json format is returned.

          If ''csv'' is specified, a comma-separated list with a heading

          row is returned.'
        name: outputFormat
        in: query
        schema:
          type: string
      - x-go-name: HealthStatus
        description: 'Specifies the health status of the Cohesity agent. Setting this parameter

          will filter the response based on agent health status.

          Specifies the status of the agent running on a physical source.

          ''kUnknown'' indicates the Agent is not known. No attempt to connect

          to the Agent has occurred.

          ''kUnreachable'' indicates the Agent is not reachable.

          ''kHealthy'' indicates the Agent is healthy.

          ''kDegraded'' indicates the Agent is running but in a degraded state.'
        name: healthStatus
        in: query
        schema:
          type: array
          items:
            enum:
            - kUnknown
            - kUnreachable
            - kHealthy
            - kDegraded
            type: string
      responses:
        '200':
          $ref: '#/components/responses/GetAgentDeploymentReportResponse'
        default:
          $ref: '#/components/responses/Error'
      summary: Get agent deployment report
      x-summary-source: derived
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/reports/dataTransferFromVaults:
    get:
      description: 'A Vault can provide an additional Cloud Tier where cold data of the

        Cohesity Cluster is stored in the Cloud.

        A Vault can also provide archive storage for backup data.

        This archive data is stored on Tapes and in Cloud Vaults.'
      tags:
      - Reports
      summary: Get summary statistics about transferring data from Vaults (External Targets)…
      operationId: GetDataTransferFromVaultsReportRequest
      parameters:
      - x-go-name: StartTimeMsecs
        description: 'Filter by a start time. Specify the start time as a Unix epoch Timestamp

          (in milliseconds).

          If startTimeMsecs and endTimeMsecs are not specified,

          the time period is the last 7 days.'
        name: startTimeMsecs
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: EndTimeMsecs
        description: 'Filter by end time. Specify the end time as a Unix epoch Timestamp

          (in milliseconds).

          If startTimeMsecs and endTimeMsecs are not specified,

          the time period is the last 7 days.'
        name: endTimeMsecs
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: VaultIds
        description: Filter by a list of Vault ids.
        name: vaultIds
        in: query
        required: true
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: OutputFormat
        description: 'Specifies the format for the output such as ''csv'' or ''json''.

          If not specified, the json format is returned.

          If ''csv'' is specified, a comma-separated list with a heading

          row is returned.'
        name: outputFormat
        in: query
        schema:
          type: string
      - x-go-name: GroupBy
        description: 'Specifies wheather the report should be grouped by target when scheduled

          or downloaded. If not set or set to false, report is grouped by protection

          jobs. It is ignored if outformat is not "csv" and response contains whole

          report.'
        name: groupBy
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          $ref: '#/components/responses/GetDataTransferFromVaultsSummaryResponse'
        default:
          $ref: '#/components/responses/Error'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/reports/dataTransferToVaults:
    get:
      description: 'A Vault can provide an additional Cloud Tier where cold data of the

        Cohesity Cluster can be stored in the Cloud.

        A Vault can also provide archive storage for backup data.

        This archive data is stored on Tapes and in Cloud Vaults.'
      tags:
      - Reports
      summary: Get summary statistics about transferring data from the Cohesity Cluster to…
      operationId: GetDataTransferToVaultsReportRequest
      parameters:
      - x-go-name: StartTimeMsecs
        description: 'Filter by a start time. Specify the start time as a Unix epoch Timestamp

          (in milliseconds).

          If startTimeMsecs and endTimeMsecs are not specified,

          the time period is the last 7 days.'
        name: startTimeMsecs
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: EndTimeMsecs
        description: 'Filter by end time. Specify the end time as a Unix epoch Timestamp

          (in milliseconds).

          If startTimeMsecs and endTimeMsecs are not specified,

          the time period is the last 7 days.'
        name: endTimeMsecs
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: VaultIds
        description: Filter by a list of Vault ids.
        name: vaultIds
        in: query
        required: true
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: OutputFormat
        description: 'Specifies the format for the output such as ''csv'' or ''json''.

          If not specified, the json format is returned.

          If ''csv'' is specified, a comma-separated list with a heading

          row is returned.'
        name: outputFormat
        in: query
        schema:
          type: string
      - x-go-name: GroupBy
        description: 'Specifies wheather the report should be grouped by target when scheduled

          or downloaded. If not set or set to false, report is grouped by protection

          jobs. It is ignored if outformat is not "csv" and response contains whole

          report.'
        name: groupBy
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          $ref: '#/components/responses/GetDataTransferToVaultsSummaryResponse'
        default:
          $ref: '#/components/responses/Error'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/reports/gdpr:
    get:
      description: Returns the GDPR report information.
      tags:
      - Reports
      summary: Get gdpr report related information
      operationId: GetGdprReport
      parameters:
      - x-go-name: ObjectIds
        description: Specifies the objects for which to get the gdpr information.
        name: id
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: AccessibleUsers
        description: Specifies the users for which to get the accessible objects.
        name: accessibleUsers
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: ParentSourceId
        description: Specifies the parent sources of objects for which to get info for.
        name: parentSourceId
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: OutputFormat
        description: 'Specifies the format for the output such as ''csv'' or ''json''.

          If not specified, the json format is returned.

          If ''csv'' is specified, a comma-separated list with a heading

          row is returned.'
        name: outputFormat
        in: query
        schema:
          type: string
      - x-go-name: Actions
        description: Specifies the action for the audit logs.
        name: actions
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: Search
        description: Specifies the search string for the audit logs.
        name: search
        in: query
        schema:
          type: string
      - x-go-name: StartTimeUsecs
        description: 'Specifies the start time for the audit logs as a Unix epoch Timestamp

          (in microseconds).'
        name: startTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: EndTimeUsecs
        description: 'Specifies the end time for the audit logsas a Unix epoch Timestamp

          (in microseconds).'
        name: endTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/GetGdprReportResponse'
        default:
          $ref: '#/components/responses/Error'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/reports/protectedObjectsTrends:
    get:
      description: 'This gives a summary of protection trend for protected resources during the

        given time range.

        If no roll up is specified, then the trends will be grouped by days.'
      tags:
      - Reports
      summary: Get protected objects trends grouped by days/weeks/months
      operationId: GetProtectedObjectsTrendsReportRequest
      parameters:
      - x-go-name: JobIds
        description: 'Filter by a list of Job ids. Snapshots summary statistics

          for the specified Protection Jobs are reported.'
        name: jobIds
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: StartTimeUsecs
        description: 'Filter by a start time. Snapshot summary statistics

          for Job Runs that started after the specified time are reported.

          Specify the start time as a Unix epoch Timestamp (in microseconds).'
        name: startTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: Timezone
        description: 'Specifies the timezone to use when calculating day/week/month

          Specify the timezone in the following format: "Area/Location",

          for example: "America/New_York".'
        name: timezone
        in: query
        required: true
        schema:
          type: string
      - x-go-name: EndTimeUsecs
        description: 'Filter by end time. Snapshot summary statistics

          for Job Runs that ended before the specified time are returned.

          Specify the end time as a Unix epoch Timestamp (in microseconds).'
        name: endTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: Environments
        description: 'Filter by a list of environment types such as ''kVMware'', ''kView'', etc.

          Supported environment types such as ''kView'', ''kSQL'', ''kVMware'', etc.

          NOTE: ''kPuppeteer'' refers to Cohesity''s Remote Adapter.

          ''kVMware'' indicates the VMware Protection Source environment.

          ''kHyperV'' indicates the HyperV Protection Source environment.

          ''kSQL'' indicates the SQL Protection Source environment.

          ''kView'' indicates the View Protection Source environment.

          ''kPuppeteer'' indicates the Cohesity''s Remote Adapter.

          ''kPhysical'' indicates the physical Protection Source environment.

          ''kPure'' indicates the Pure Storage Protection Source environment.

          ''Nimble'' indicates the Nimble Storage Protection Source environment.

          ''kAzure'' indicates the Microsoft''s Azure Protection Source environment.

          ''kNetapp'' indicates the Netapp Protection Source environment.

          ''kAgent'' indicates the Agent Protection Source environment.

          ''kGenericNas'' indicates the Generic Network Attached Storage Protection

          Source environment.

          ''kAcropolis'' indicates the Acropolis Protection Source environment.

          ''kPhsicalFiles'' indicates the Physical Files Protection Source environment.

          ''kIsilon'' indicates the Dell EMC''s Isilon Protection Source environment.

          ''kGPFS'' indicates IBM''s GPFS Protection Source environment.

          ''kKVM'' indicates the KVM Protection Source environment.

          ''kAWS'' indicates the AWS Protection Source environment.

          ''kExchange'' indicates the Exchange Protection Source environment.

          ''kHyperVVSS'' indicates the HyperV VSS Protection Source

          environment.

          ''kOracle'' indicates the Oracle Protection Source environment.

          ''kGCP'' indicates the Google Cloud Platform Protection Source environment.

          ''kFlashBlade'' indicates the Flash Blade Protection Source environment.

          ''kAWSNative'' indicates the AWS Native Protection Source environment.

          ''kO365'' indicates the Office 365 Protection Source environment.

          ''kO365Outlook'' indicates Office 365 outlook Protection Source environment.

          ''kHyperFlex'' indicates the Hyper Flex Protection Source environment.

          ''kGCPNative'' indicates the GCP Native Protection Source environment.

          ''kAzureNative'' indicates the Azure Native Protection Source environment.

          ''kKubernetes'' indicates a Kubernetes Protection Source environment.

          ''kElastifile'' indicates Elastifile Protection Source environment.

          ''kAD'' indicates Active Directory Protection Source environment.

          ''kRDSSnapshotManager'' indicates AWS RDS Protection Source environment.

          ''kCassandra'' indicates Cassandra Protection Source environment.

          ''kMongoDB'' indicates MongoDB Protection Source environment.

          ''kCouchbase'' indicates Couchbase Protection Source environment.

          ''kHdfs'' indicates Hdfs Protection Source environment.

          ''kHive'' indicates Hive Protection Source environment.

          ''kHBase'' indicates HBase Protection Source environment.'
        name: environments
        in: query
        schema:
          type: array
          items:
            enum:
            - kVMware
            - kHyperV
            - kSQL
            - kView
            - kPuppeteer
            - kPhysical
            - kPure
            - kNimble
            - kAzure
            - kNetapp
            - kAgent
            - kGenericNas
            - kAcropolis
            - kPhysicalFiles
            - kIsilon
            - kGPFS
            - kKVM
            - kAWS
            - kExchange
            - kHyperVVSS
            - kOracle
            - kGCP
            - kFlashBlade
            - kAWSNative
            - kO365
            - kO365Outlook
            - kHyperFlex
            - kGCPNative
            - kAzureNative
            - kKubernetes
            - kElastifile
            - kAD
            - kRDSSnapshotManager
            - kCassandra
            - kMongoDB
            - kCouchbase
            - kHdfs
            - kHive
            - kHBase
            type: string
      - x-go-name: ProtectedObjectIds
        description: 'Filter by a list of leaf Protection Sources Objects (such as VMs).

          Snapshot summary statistics for the listed Protection Source Objects

          are reported.'
        name: protectedObjectIds
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: RegisteredEntityId
        description: 'Specifies an id of a top level Registered Source such as

          a vCenter Server. If specified, Snapshot summary statistics for all

          the leaf Protection Sources (such as VMs) that are children of this

          Registered Source are reported.

          NOTE: If specified, filtering by other fields is not supported.'
        name: registeredSourceId
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: RollUp
        description: Roll up type for grouping. Valid values are day, week, month
        name: rollup
        in: query
        schema:
          type: string
      - x-go-name: TenantIds
        description: 'TenantIds contains ids of the tenants for which objects are to be

          returned.'
        name: tenantIds
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: AllUnderHierarchy
        description: 'AllUnderHierarchy specifies if objects of all the tenants under the

          hierarchy of the logged in user''s organization should be returned.'
        name: allUnderHierarchy
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/ProtectedObjectsTrendsReportResponse'
        default:
          $ref: '#/components/responses/Error'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/reports/protectionSourcesJobRuns:
    get:
      description: 'Returns the Snapshots that contain backups of the specified

        Protection Source Objects and match the specified filter criteria.'
      tags:
      - Reports
      summary: Get protection details about the specified list of leaf Protection Source…
      operationId: GetProtectionSourcesJobRunsReportRequest
      parameters:
      - x-go-name: TenantIds
        description: 'TenantIds contains ids of the tenants for which objects are to be

          returned.'
        name: tenantIds
        in: query
        schema:
          type: array
          items:
            type: string
      - x-go-name: AllUnderHierarchy
        description: 'AllUnderHierarchy specifies if objects of all the tenants under the

          hierarchy of the logged in user''s organization should be returned.'
        name: allUnderHierarchy
        in: query
        schema:
          type: boolean
      - x-go-name: JobIds
        description: 'Filter by a list of Job ids. Snapshots for the specified

          Protection Jobs are listed.'
        name: jobIds
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: StartTimeUsecs
        description: 'Filter by a start time. Snapshots that started after the

          specified time are returned.

          Specify the start time as a Unix epoch Timestamp (in microseconds).'
        name: startTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: EndTimeUsecs
        description: 'Filter by a end time. Snapshots that ended before the

          specified time are returned.

          Specify the end time as a Unix epoch Timestamp (in microseconds).'
        name: endTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: Environments
        description: 'Filter by a list of environment types such as ''kVMware'', ''kView'', etc.

          NOTE: ''kPuppeteer'' refers to Cohesity''s Remote Adapter.'
        name: environments
        in: query
        schema:
          type: array
          items:
            enum:
            - kVMware
            - kHyperV
            - kSQL
            - kView
            - kPuppeteer
            - kPhysical
            - kPure
            - kNimble
            - kAzure
            - kNetapp
            - kAgent
            - kGenericNas
            - kAcropolis
            - kPhysicalFiles
            - kIsilon
            - kGPFS
            - kKVM
            - kAWS
            - kExchange
            - kHyperVVSS
            - kOracle
            - kGCP
            - kFlashBlade
            - kAWSNative
            - kVCD
            - kO365
            - kO365Outlook
            - kHyperFlex
            - kGCPNative
            - kKubernetes
            - kElastifile
            type: string
      - x-go-name: ProtectionSourceIds
        description: 'Filter by a list of leaf Protection Sources Objects (such as VMs).

          Snapshots of the specified Protection Source Objects are returned.'
        name: protectionSourceIds
        in: query
        required: true
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: OutputFormat
        description: 'Specifies the format for the output such as ''cvs'' or ''json''.

          If not specified, the json format is returned.

          If ''csv'' is specified, a comma-separated list with a heading

          row is returned.'
        name: outputFormat
        in: query
        schema:
          type: string
      - x-go-name: PageCount
        description: 'Specifies the number of Snapshots to return in the response for

          pagination purposes. Used in combination with the paginationCookie in

          the response to return multiple sets of Snapshots.'
        name: pageCount
        in: query
        schema:
          type: integer
          format: int32
      - x-go-name: RunStatus
        description: 'Filter by a list of run statuses such as ''kRunning'',

          ''kSuccess'', ''kFailure'' etc.

          Snapshots of Job Runs with the specified run statuses are reported.

          ''kSuccess'' indicates that the Job Run was successful.

          ''kRunning'' indicates that the Job Run is currently running.

          ''kWarning'' indicates that the Job Run was successful but warnings were

          issued.

          ''kCancelled'' indicates that the Job Run was canceled.

          ''kError'' indicates the Job Run encountered an error and did not run to

          completion.'
        name: runStatus
        in: query
        schema:
          type: array
          items:
            enum:
            - kSuccess
            - kRunning
            - kWarning
            - kCancelled
            - kError
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ProtectionSourcesJobRunsReportResponse'
        default:
          $ref: '#/components/responses/Error'
    servers:
    - url: https://<CLUSTER_VIP>/irisservices/api/v1
  /public/reports/protectionSourcesJobsSummary:
    get:
      description: 'For example, if two Job ids are passed in, Snapshot summary statistics about

        all the leaf Objects that have been protected by the two specified

        Jobs are reported.

        For example, if a top level registered Source id is passed in, summary

        statistics about all the Snapshots backing up leaf Objects in

        the specified Source are reported.'
      tags:
      - Reports
      summary: Get Job Run (Snapshot) summary statistics about the leaf Protection Sources…
      operationId: GetProtectionSourcesJobsSummaryReportRequest
      parameters:
      - x-go-name: JobIds
        description: 'Filter by a list of Job ids. Snapshots summary statistics

          for the specified Protection Jobs are reported.'
        name: jobIds
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: StartTimeUsecs
        description: 'Filter by a start time. Snapshot summary statistics

          for Job Runs that started after the specified time are reported.

          Specify the start time as a Unix epoch Timestamp (in microseconds).'
        name: startTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: EndTimeUsecs
        description: 'Filter by end time. Snapshot summary statistics

          for Job Runs that ended before the specified time are returned.

          Specify the end time as a Unix epoch Timestamp (in microseconds).'
        name: endTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: Environments
        description: 'Filter by a list of environment types such as ''kVMware'', ''kView'', etc.

          NOTE: ''kPuppeteer'' refers to Cohesity''s Remote Adapter.'
        name: environments
        in: query
        schema:
          type: array
          items:
            enum:
            - kVMware
            - kHyperV
            - kSQL
            - kView
            - kPuppeteer
            - kPhysical
            - kPure
            - kNimble
            - kAzure
            - kNetapp
            - kAgent
            - kGenericNas
            - kAcropolis
            - kPhysicalFiles
            - kIsilon
            - kGPFS
            - kKVM
            - kAWS
            - kExchange
            - kHyperVVSS
            - kOracle
            - kGCP
            - kFlashBlade
            - kAWSNative
            - kVCD
            - kO365
            - kO365Outlook
            - kHyperFlex
            - kGCPNative
            - kKubernetes
            - kElastifile
            type: string
      - x-go-name: ProtectionSourceIds
        description: 'Filter by a list of leaf Protection Sources Objects (such as VMs).

          Snapshot summary statistics for the listed Protection Source Objects

          are reported.'
        name: protectionSourceIds
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - x-go-name: Statuses
        description: 'Filter by a list of run statuses.

          ''kSuccess'' indicates that the Job Run was successful.

          ''kRunning'' indicates that the Job Run is currently running.

          ''kWarning'' indicates that the Job Run was successful but warnings were

          issued.

          ''kCancelled'' indicates that the Job Run was canceled.

          ''kError'' indicates the Job Run encountered an error and did not run to

          completion.'
        name: statuses
        in: query
        schema:
          type: array
          items:
            enum:
            - kSuccess
            - kRunning
            - kWarning
            - kCancelled
            - kError
            type: string
      - x-go-name: OutputFormat
        description: 'Specifies the format for the output such as ''csv'' or ''json''.

          If not specified, the json format is returned.

          If ''csv'' is specified, a comma-separated list with a heading

          row is returned.'
        name: outputFormat
        in: query
        schema:
          type: string
      - x-go-name: RegisteredEntityId
        description: 'Specifies an id of a top level Registered Source such as

          a vCenter Server. If specified, Snapshot summary statistics for all

          the leaf Protection Sources (such as VMs) that are children of this

          Registered Source are reported.

          NOTE: If specified, filtering by other fields is not supported.'
        name: registeredSourceId
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: ConsecutiveFailures
        description: 'Filters out those jobs which have number of consecutive run failures less

          than consecutiveFailures.'
        name: consecutiveFailures
        in: query
        schema:
          type: integer
          format: int32
      - x-go-name: ReportName
        description: Specifies the custom report name the user wants to set for this report.
        name: reportName
        in: query
        schema:
          type: string
      - x-go-name: ReportType
        description: 'Specifies the report type that will be used to set the right label &

          subject line for the report when downloaded or emailed because same API is

          used for 3 reports currently

          1. kAvailableLocalSnapshotsReport

          2. kFailedObjectsReport

          3. kProtectionSummaryByObjectTypeReport'
        name: reportType
        in: query
        schema:
          type: integer
          format: int32
      - x-go-name: TenantIds
