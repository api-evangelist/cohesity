    type: object
    properties:
      operationId:
        description: Specifies the operation id to perform operation using objects.
        type: string
      operationType:
        description: Specifies the operation type.<br>
          'CheckObjectCreds' initiates a verification check for object credentials.<br>
          'FetchResourcePoolInfo' initiates an operation to fetch information about
