openapi: 3.2.0
info:
  description: Cohesity API provides a RESTful interface to access the various data management operations on Cohesity cluster and Helios.
  title: Cohesity REST Protection Groups API
  version: '2.0'
servers:
- url: /v2
tags:
- name: Protection Groups
paths:
  /data-protect/protection-groups:
    get:
      description: Get the list of Protection Groups.
      tags:
      - Protection Groups
      summary: Get the list of Protection Groups
      operationId: GetProtectionGroups
      parameters:
      - description: Filter by a list of Protection Group ids.
        name: ids
        in: query
        schema:
          type: array
          items:
            type: string
      - description: Filter by a list of Protection Group names.
        name: names
        in: query
        schema:
          type: array
          items:
            type: string
      - description: Filter by Policy ids that are associated with Protection Groups. Only Protection Groups associated with the specified Policy ids, are returned.
        name: policyIds
        in: query
        schema:
          type: array
          items:
            type: string
      - description: Filter by Storage Domain id. Only Protection Groups writing data to this Storage Domain will be returned.
        name: storageDomainId
        in: query
        schema:
          type: integer
          format: int64
      - description: Whether to only return Protection Groups with a datalock.
        name: includeGroupsWithDatalockOnly
        in: query
        schema:
          type: boolean
      - description: Filter by environment types such as 'kVMware', 'kView', etc. Only Protection Groups protecting the specified environment types are returned.
        name: environments
        in: query
        schema:
          type: array
          items:
            enum:
            - kVMware
            - kHyperV
            - kAzure
            - kGCP
            - kKVM
            - kAcropolis
            - kAWS
            - kPhysical
            - kGPFS
            - kElastifile
            - kNetapp
            - kGenericNas
            - kIsilon
            - kFlashBlade
            - kPure
            - kSQL
            - kExchange
            - kAD
            - kOracle
            - kView
            - kRemoteAdapter
            - kO365
            - kKubernetes
            - kCassandra
            - kMongoDB
            - kCouchbase
            - kHdfs
            - kHive
            - kHBase
            - kUDA
            type: string
      - name: office365Workloads
        in: query
        schema:
          type: array
          items:
            enum:
            - kMailbox
            - kOneDrive
            - kSharePoint
            - kPublicFolders
            - kGroups
            - kTeams
            type: string
      - description: Filter by Inactive or Active Protection Groups. If not set, all Inactive and Active Protection Groups are returned. If true, only Active Protection Groups are returned. If false, only Inactive Protection Groups are returned. When you create a Protection Group on a Primary Cluster with a replication schedule, the Cluster creates an Inactive copy of the Protection Group on the Remote Cluster. In addition, when an Active and running Protection Group is deactivated, the Protection Group becomes Inactive.
        name: isActive
        in: query
        schema:
          type: boolean
      - description: If true, return only Protection Groups that have been deleted but still have Snapshots associated with them. If false, return all Protection Groups except those Protection Groups that have been deleted and still have Snapshots associated with them. A Protection Group that is deleted with all its Snapshots is not returned for either of these cases.
        name: isDeleted
        in: query
        schema:
          type: boolean
      - description: Filter by paused or non paused Protection Groups, If not set, all paused and non paused Protection Groups are returned. If true, only paused Protection Groups are returned. If false, only non paused Protection Groups are returned.
        name: isPaused
        in: query
        schema:
          type: boolean
      - description: Filter by last local backup run status.<br> 'Running' indicates that the run is still running.<br> 'Canceled' indicates that the run has been canceled.<br> 'Canceling' indicates that the run is in the process of being canceled.<br> 'Failed' indicates that the run has failed.<br> 'Missed' indicates that the run was unable to take place at the scheduled time because the previous run was still happening.<br> 'Succeeded' indicates that the run has finished successfully.<br> 'SucceededWithWarning' indicates that the run finished successfully, but there were some warning messages.
        name: lastRunLocalBackupStatus
        in: query
        schema:
          type: array
          items:
            enum:
            - Accepted
            - Running
            - Canceled
            - Canceling
            - Failed
            - Missed
            - Succeeded
            - SucceededWithWarning
            - OnHold
            type: string
      - description: Filter by last remote replication run status.<br> 'Running' indicates that the run is still running.<br> 'Canceled' indicates that the run has been canceled.<br> 'Canceling' indicates that the run is in the process of being canceled.<br> 'Failed' indicates that the run has failed.<br> 'Missed' indicates that the run was unable to take place at the scheduled time because the previous run was still happening.<br> 'Succeeded' indicates that the run has finished successfully.<br> 'SucceededWithWarning' indicates that the run finished successfully, but there were some warning messages.
        name: lastRunReplicationStatus
        in: query
        schema:
          type: array
          items:
            enum:
            - Accepted
            - Running
            - Canceled
            - Canceling
            - Failed
            - Missed
            - Succeeded
            - SucceededWithWarning
            - OnHold
            type: string
      - description: Filter by last cloud archival run status.<br> 'Running' indicates that the run is still running.<br> 'Canceled' indicates that the run has been canceled.<br> 'Canceling' indicates that the run is in the process of being canceled.<br> 'Failed' indicates that the run has failed.<br> 'Missed' indicates that the run was unable to take place at the scheduled time because the previous run was still happening.<br> 'Succeeded' indicates that the run has finished successfully.<br> 'SucceededWithWarning' indicates that the run finished successfully, but there were some warning messages.
        name: lastRunArchivalStatus
        in: query
        schema:
          type: array
          items:
            enum:
            - Accepted
            - Running
            - Canceled
            - Canceling
            - Failed
            - Missed
            - Succeeded
            - SucceededWithWarning
            - OnHold
            type: string
      - description: Filter by last cloud spin run status.<br> 'Running' indicates that the run is still running.<br> 'Canceled' indicates that the run has been canceled.<br> 'Canceling' indicates that the run is in the process of being canceled.<br> 'Failed' indicates that the run has failed.<br> 'Missed' indicates that the run was unable to take place at the scheduled time because the previous run was still happening.<br> 'Succeeded' indicates that the run has finished successfully.<br> 'SucceededWithWarning' indicates that the run finished successfully, but there were some warning messages.
        name: lastRunCloudSpinStatus
        in: query
        schema:
          type: array
          items:
            enum:
            - Accepted
            - Running
            - Canceled
            - Canceling
            - Failed
            - Missed
            - Succeeded
            - SucceededWithWarning
            - OnHold
            type: string
      - description: Filter by last any run status.<br> 'Running' indicates that the run is still running.<br> 'Canceled' indicates that the run has been canceled.<br> 'Canceling' indicates that the run is in the process of being canceled.<br> 'Failed' indicates that the run has failed.<br> 'Missed' indicates that the run was unable to take place at the scheduled time because the previous run was still happening.<br> 'Succeeded' indicates that the run has finished successfully.<br> 'SucceededWithWarning' indicates that the run finished successfully, but there were some warning messages.
        name: lastRunAnyStatus
        in: query
        schema:
          type: array
          items:
            enum:
            - Accepted
            - Running
            - Canceled
            - Canceling
            - Failed
            - Missed
            - Succeeded
            - SucceededWithWarning
            - OnHold
            type: string
      - description: If true, return Protection Groups for which last run SLA was violated.
        name: isLastRunSlaViolated
        in: query
        schema:
          type: boolean
      - description: TenantIds contains ids of the tenants for which objects are to be returned.
        name: tenantIds
        in: query
        schema:
          type: array
          items:
            type: string
      - description: If true, the response will include Protection Groups which were created by all tenants which the current user has permission to see. If false, then only Protection Groups created by the current user will be returned.
        name: includeTenants
        in: query
        schema:
          type: boolean
      - description: If true, the response will include last run info. If it is false or not specified, the last run info won't be returned.
        name: includeLastRunInfo
        in: query
        schema:
          type: boolean
      - description: If true, the response will not include the list of excluded source IDs in groups that contain this field. This can be set to true in order to improve performance if excluded source IDs are not needed by the user.
        name: pruneExcludedSourceIds
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/GetProtectionGroupsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    post:
      description: Create a Protection Group.
      tags:
      - Protection Groups
      summary: Create a Protection Group
      operationId: CreateProtectionGroup
      responses:
        '201':
          $ref: '#/components/responses/CreateOrUpdateProtectionGroupResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              x-cohesity-discriminator-ref: CommonProtectionGroupRequestParams
              $ref: '#/components/schemas/CommonProtectionGroupRequestParamse9ef605d-4350-4f91-93ca-9e8a25d0f659'
        description: Specifies the parameters to create a Protection Group.
        required: true
  /data-protect/protection-groups/states:
    post:
      description: Perform an action like pause, resume, active, deactivate on all specified Protection Groups. Note that the pause or resume actions will take effect from next Protection Run. Also, user can specify only one type of action on all the Protection Groups. Deactivate and activate actions are independent of pause and resume state. Deactivate and activate actions are useful in case of failover situations. Returns success if the state of all the Protection Groups state is changed successfully.
      tags:
      - Protection Groups
      summary: Perform an action like pause, resume, active, deactivate on all specified…
      operationId: UpdateProtectionGroupsState
      responses:
        '200':
          $ref: '#/components/responses/UpdateProtectionGroupsStateResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProtectionGroupsStateRequest'
        description: Specifies the parameters to perform an action of list of Protection Groups.
        required: true
  /data-protect/protection-groups/{id}:
    get:
      description: Returns the Protection Group corresponding to the specified Group id.
      tags:
      - Protection Groups
      summary: List details about single Protection Group
      operationId: GetProtectionGroupById
      parameters:
      - description: Specifies a unique id of the Protection Group.
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: If true, the response will include last run info. If it is false or not specified, the last run info won't be returned.
        name: includeLastRunInfo
        in: query
        schema:
          type: boolean
      - description: If true, the response will not include the list of excluded source IDs in groups that contain this field. This can be set to true in order to improve performance if excluded source IDs are not needed by the user.
        name: pruneExcludedSourceIds
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/GetProtectionGroupResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    put:
      description: Update the specified Protection Group.
      tags:
      - Protection Groups
      summary: Update a Protection Group
      operationId: UpdateProtectionGroup
      parameters:
      - description: Specifies the id of the Protection Group.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/CreateOrUpdateProtectionGroupResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              x-cohesity-discriminator-ref: CommonProtectionGroupRequestParams
              $ref: '#/components/schemas/CommonProtectionGroupRequestParamse9ef605d-4350-4f91-93ca-9e8a25d0f659'
        description: Specifies the parameters to update a Protection Group.
        required: true
    delete:
      description: Returns Success if the Protection Group is deleted.
      tags:
      - Protection Groups
      summary: Delete a Protection Group
      operationId: DeleteProtectionGroup
      parameters:
      - description: Specifies a unique id of the Protection Group.
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: Specifies if Snapshots generated by the Protection Group should also be deleted when the Protection Group is deleted.
        name: deleteSnapshots
        in: query
        schema:
          type: boolean
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
  /data-protect/protection-groups/{id}/runs:
    get:
      description: Get the runs for a particular Protection Group.
      tags:
      - Protection Groups
      summary: Get the list of runs for a Protection Group
      operationId: GetProtectionGroupRuns
      parameters:
      - description: Specifies a unique id of the Protection Group.
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: Specifies the protection run id.
        name: runId
        in: query
        schema:
          type: string
          pattern: ^\d+:\d+$
      - description: Filter by a start time. Specify the start time as a Unix epoch Timestamp (in microseconds).
        name: startTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: Filter by a end time. Specify the start time as a Unix epoch Timestamp (in microseconds).
        name: endTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: TenantIds contains ids of the tenants for which objects are to be returned.
        name: tenantIds
        in: query
        schema:
          type: array
          items:
            type: string
      - description: If true, the response will include Protection Group Runs which were created by all tenants which the current user has permission to see. If false, then only Protection Group Runs created by the current user will be returned.
        name: includeTenants
        in: query
        schema:
          type: boolean
      - description: Filter by run type. Only protection run matching the specified types will be returned.
        name: runTypes
        in: query
        schema:
          type: array
          items:
            enum:
            - kAll
            - kLog
            - kSystem
            - kIncremental
            - kFull
            type: string
          uniqueItems: true
      - description: Specifies if the result includes the object details for each protection run. If set to true, details of the protected object will be returned. If set to false or not specified, details will not be returned.
        name: includeObjectDetails
        in: query
        schema:
          type: boolean
      - description: Specifies a list of local backup status, runs matching the status will be returned.<br> 'Running' indicates that the run is still running.<br> 'Canceled' indicates that the run has been canceled.<br> 'Canceling' indicates that the run is in the process of being canceled.<br> 'Failed' indicates that the run has failed.<br> 'Missed' indicates that the run was unable to take place at the scheduled time because the previous run was still happening.<br> 'Succeeded' indicates that the run has finished successfully.<br> 'SucceededWithWarning' indicates that the run finished successfully, but there were some warning messages.
        name: localBackupRunStatus
        in: query
        schema:
          type: array
          items:
            enum:
            - Accepted
            - Running
            - Canceled
            - Canceling
            - Failed
            - Missed
            - Succeeded
            - SucceededWithWarning
            - OnHold
            type: string
      - description: Specifies a list of replication status, runs matching the status will be returned.<br> 'Running' indicates that the run is still running.<br> 'Canceled' indicates that the run has been canceled.<br> 'Canceling' indicates that the run is in the process of being canceled.<br> 'Failed' indicates that the run has failed.<br> 'Missed' indicates that the run was unable to take place at the scheduled time because the previous run was still happening.<br> 'Succeeded' indicates that the run has finished successfully.<br> 'SucceededWithWarning' indicates that the run finished successfully, but there were some warning messages.
        name: replicationRunStatus
        in: query
        schema:
          type: array
          items:
            enum:
            - Accepted
            - Running
            - Canceled
            - Canceling
            - Failed
            - Missed
            - Succeeded
            - SucceededWithWarning
            - OnHold
            type: string
      - description: Specifies a list of archival status, runs matching the status will be returned.<br> 'Running' indicates that the run is still running.<br> 'Canceled' indicates that the run has been canceled.<br> 'Canceling' indicates that the run is in the process of being canceled.<br> 'Failed' indicates that the run has failed.<br> 'Missed' indicates that the run was unable to take place at the scheduled time because the previous run was still happening.<br> 'Succeeded' indicates that the run has finished successfully.<br> 'SucceededWithWarning' indicates that the run finished successfully, but there were some warning messages.
        name: archivalRunStatus
        in: query
        schema:
          type: array
          items:
            enum:
            - Accepted
            - Running
            - Canceled
            - Canceling
            - Failed
            - Missed
            - Succeeded
            - SucceededWithWarning
            - OnHold
            type: string
      - description: Specifies a list of cloud spin status, runs matching the status will be returned.<br> 'Running' indicates that the run is still running.<br> 'Canceled' indicates that the run has been canceled.<br> 'Canceling' indicates that the run is in the process of being canceled.<br> 'Failed' indicates that the run has failed.<br> 'Missed' indicates that the run was unable to take place at the scheduled time because the previous run was still happening.<br> 'Succeeded' indicates that the run has finished successfully.<br> 'SucceededWithWarning' indicates that the run finished successfully, but there were some warning messages.
        name: cloudSpinRunStatus
        in: query
        schema:
          type: array
          items:
            enum:
            - Accepted
            - Running
            - Canceled
            - Canceling
            - Failed
            - Missed
            - Succeeded
            - SucceededWithWarning
            - OnHold
            type: string
      - description: Specifies the max number of runs. If not specified, at most 100 runs will be returned.
        name: numRuns
        in: query
        schema:
          type: integer
          format: int64
      - description: Specifies whether to exclude non restorable runs. Run is treated restorable only if there is atleast one object snapshot (which may be either a local or an archival snapshot) which is not deleted or expired. Default value is false.
        name: excludeNonRestorableRuns
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          $ref: '#/components/responses/GetProtectionGroupRunsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
    put:
      description: 'Update runs for a particular Protection Group. A user can perform the following actions: 1. Extend or reduce retention of a local, replication and archival snapshots. 2. Can perform resync operation on failed copy snapshots attempts in this Run. 3. Add new replication and archival snapshot targets to the Run. 4. Add or remove legal hold on the snapshots. Only a user with DSO role can perform this operation. 5. Delete the snapshots that were created as a part of this Run. 6. Apply datalock on existing snapshots where a user cannot manually delete snapshots before the expiry time.'
      tags:
      - Protection Groups
      summary: Update runs for a particular Protection Group
      operationId: UpdateProtectionGroupRun
      parameters:
      - description: Specifies a unique id of the Protection Group.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '207':
          $ref: '#/components/responses/UpdateProtectionGroupRunResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProtectionGroupRunRequestBody'
        description: Specifies the parameters to update a Protection Group Run.
        required: true
    post:
      description: Create a new protection run. This can be used to start a run for a Protection Group on demand, ignoring the schedule and retention specified in the protection policy.
      tags:
      - Protection Groups
      summary: Create a new protection run
      operationId: CreateProtectionGroupRun
      parameters:
      - description: Specifies a unique id of the Protection Group.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          $ref: '#/components/responses/CreateProtectionGroupRunResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProtectionGroupRunRequest'
        description: Specifies the parameters to start a protection run.
        required: true
  /data-protect/protection-groups/{id}/runs/{runId}:
    get:
      description: Get a run for a particular Protection Group.
      tags:
      - Protection Groups
      summary: Get a run for a Protection Group
      operationId: GetProtectionGroupRun
      parameters:
      - description: Specifies a unique id of the Protection Group.
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: Specifies a unique run id of the Protection Group run.
        name: runId
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d+:\d+$
      - description: TenantIds contains ids of the tenants for which the run is to be returned.
        name: tenantIds
        in: query
        schema:
          type: array
          items:
            type: string
      - description: If true, the response will include Protection Group Runs which were created by all tenants which the current user has permission to see. If false, then only Protection Groups created by the current user will be returned. If it's not specified, it is true by default.
        name: includeTenants
        in: query
        schema:
          type: boolean
      - description: Specifies if the result includes the object details for a protection run. If set to true, details of the protected object will be returned. If set to false or not specified, details will not be returned.
        name: includeObjectDetails
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/GetProtectionGroupRunResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
  /data-protect/protection-groups/{id}/runs/{runId}/cancel:
    post:
      description: Cancel protection run for a given protection group ID and run ID.
      tags:
      - Protection Groups
      summary: Cancel protection group run
      operationId: CancelProtectionGroupRun
      parameters:
      - description: Specifies a unique id of the Protection Group.
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: Specifies a unique run id of the Protection Group run.
        name: runId
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d+:\d+$
      responses:
        '200':
          description: OK
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelProtectionGroupRunRequest'
        description: Specifies the parameters to cancel a protection run.
        required: true
  /data-protect/protection-groups/{id}/runs/{runId}/debug-logs:
    get:
      description: Get the debug logs for all objects of a run for a particular Protection Group.
      tags:
      - Protection Groups
      summary: Get the debug logs for a run from a Protection Group
      operationId: GetRunDebugLogs
      parameters:
      - description: Specifies a unique id of the Protection Group.
        name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d+:\d+:\d+$
      - description: Specifies a unique run id of the Protection Group run.
        name: runId
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d+:\d+$
      - description: 'Specifies the id of the object for which debug logs are to be returned. '
        name: objectId
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
  /data-protect/protection-groups/{id}/runs/{runId}/objects/{objectId}/debug-logs:
    get:
      description: Get the debug logs for a particular object of a run for a particular Protection Group.
      tags:
      - Protection Groups
      summary: Get the debug logs for a particular object in a run from a Protection Group
      operationId: GetRunDebugLogsForObject
      parameters:
      - description: Specifies a unique id of the Protection Group.
        name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d+:\d+:\d+$
      - description: Specifies a unique run id of the Protection Group run.
        name: runId
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d+:\d+$
      - description: 'Specifies the id of the object for which debug logs are to be returned. '
        name: objectId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
  /data-protect/protection-groups/{id}/runs/{runId}/objects/{objectId}/downloadMessages:
    get:
      description: Get an CSV error report for given objectId and run id. Each row in CSV report contains the File Path, error/warning code and error/warning message.
      tags:
      - Protection Groups
      summary: Get the CSV of errors/warnings for a given run and an object
      operationId: GetRunErrorsReport
      parameters:
      - description: Specifies a unique id of the Protection Group.
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: Specifies a unique run id of the Protection Group run.
        name: runId
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d+:\d+$
      - description: 'Specifies the id of the object for which errors/warnings are to be returned. '
        name: objectId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
  /data-protect/runs/summary:
    get:
      description: Get a list of protection runs.
      tags:
      - Protection Groups
      summary: Get the list of runs
      operationId: GetProtectionRuns
      parameters:
      - description: Filter by a start time. Specify the start time as a Unix epoch Timestamp (in microseconds), only runs executing after this time will be returned. By default it is endTimeUsecs minus an hour.
        name: startTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: Filter by a end time. Specify the start time as a Unix epoch Timestamp (in microseconds), only runs executing before this time will be returned. By default it is current time.
        name: endTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: Specifies a list of status, runs matching the status will be returned.<br> 'Running' indicates that the run is still running.<br> 'Canceled' indicates that the run has been canceled.<br> 'Canceling' indicates that the run is in the process of being canceled.<br> 'Failed' indicates that the run has failed.<br> 'Missed' indicates that the run was unable to take place at the scheduled time because the previous run was still happening.<br> 'Succeeded' indicates that the run has finished successfully.<br> 'SucceededWithWarning' indicates that the run finished successfully, but there were some warning messages.
        name: runStatus
        in: query
        schema:
          type: array
          items:
            enum:
            - Accepted
            - Running
            - Canceled
            - Canceling
            - Failed
            - Missed
            - Succeeded
            - SucceededWithWarning
            - OnHold
            type: string
      responses:
        '200':
          $ref: '#/components/responses/GetProtectionRunsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
  /data-protect/runs/{runId}/progress:
    get:
      description: Get the progress of a run.
      tags:
      - Protection Groups
      summary: Get the progress of a run
      operationId: GetProtectionRunProgress
      parameters:
      - description: Specifies a unique run id of the Protection Run.
        name: runId
        in: path
        required: true
        schema:
          type: string
      - description: Specifies the objects whose progress will be returned. This only applies to protection group runs and will be ignored for object runs. If the objects are specified, the run progress will not be returned and only the progress of the specified objects will be returned.
        name: objects
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int64
      - description: TenantIds contains ids of the tenants for which the run is to be returned.
        name: tenantIds
        in: query
        schema:
          type: array
          items:
            type: string
      - description: If true, the response will include Protection Group Runs which were created by all tenants which the current user has permission to see. If false, then only Protection Groups created by the current user will be returned. If it's not specified, it is true by default.
        name: includeTenants
        in: query
        schema:
          type: boolean
      - description: Specifies whether to return finished tasks. By default only active tasks are returned.
        name: includeFinishedTasks
        in: query
        schema:
          type: boolean
      - description: Specifies the time after which the progress task starts in Unix epoch Timestamp(in microseconds).
        name: startTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: Specifies the time before which the progress task ends in Unix epoch Timestamp(in microseconds).
        name: endTimeUsecs
        in: query
        schema:
          type: integer
          format: int64
      - description: Specifies the maximum number of tasks to return.
        name: maxTasksNum
        in: query
        schema:
          type: integer
          format: int32
      - description: Specifies whether to return objects. By default all the task tree are returned.
        name: excludeObjectDetails
        in: query
        schema:
          type: boolean
      - description: Specifies whether to include event logs
        name: includeEventLogs
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/GetProtectionRunProgress'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - APIKeyHeader: []
