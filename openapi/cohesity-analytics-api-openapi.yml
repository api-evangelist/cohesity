openapi: 3.2.0
info:
  description: 'This API list provides operations for interfacing with the Cohesity

    Cluster.'
  title: Cohesity REST Analytics API
  version: '1.0'
servers:
- url: https://<CLUSTER_VIP>/irisservices/api/v1
tags:
- name: Analytics
paths:
  /public/analytics/analyzeJar:
    post:
      description: Returns the result of the jar analysis.
      tags:
      - Analytics
      summary: Analyze the uploaded jar
      operationId: AnalyzeJar
      responses:
        '200':
          $ref: '#/components/responses/AnalyzeJarResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyseJarArg'
  /public/analytics/apps:
    get:
      description: 'If no parameters are specified, all Applications currently on

        the Cohesity Cluster are returned.

        Specifying parameters filters the results that are returned.'
      tags:
      - Analytics
      summary: List Applications filtered by the specified parameters
      operationId: GetApplications
      responses:
        '200':
          $ref: '#/components/responses/GetApplicationsResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      description: Returns the created application.
      tags:
      - Analytics
      summary: Create an Application
      operationId: CreateApplication
      responses:
        '201':
          $ref: '#/components/responses/ApplicationResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapReduceInfo'
  /public/analytics/apps/{id}:
    get:
      description: Returns the Application corresponding to the specified Application Id.
      tags:
      - Analytics
      summary: List details about a single Application
      operationId: GetApplicationById
      parameters:
      - x-go-name: Id
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/GetApplicationByIdResponse'
        default:
          $ref: '#/components/responses/Error'
    put:
      description: Returns the updated Application.
      tags:
      - Analytics
      summary: Update an Application
      operationId: UpdateApplication
      parameters:
      - x-go-name: Id
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/ApplicationResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapReduceInfo'
    delete:
      description: Returns delete status upon completion.
      tags:
      - Analytics
      summary: Delete an Application
      operationId: DeleteApplication
      parameters:
      - x-go-name: Id
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/Error'
  /public/analytics/cancelAppInstanceRun/{id}:
    put:
      description: Returns the result.
      tags:
      - Analytics
      summary: Cancel a specific map reduce instance run
      operationId: CancelMapReduceInstanceRun
      parameters:
      - x-go-name: Id
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/CancelMapReduceInstanceRunResponse'
        default:
          $ref: '#/components/responses/Error'
  /public/analytics/mappers:
    get:
      description: 'If no parameters are specified, all Mappers currently on

        the Cohesity Cluster are returned.

        Specifying parameters filters the results that are returned.'
      tags:
      - Analytics
      summary: List Mappers filtered by the specified parameters
      operationId: GetMappers
      responses:
        '200':
          $ref: '#/components/responses/GetMappersResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      description: Returns the created mapper.
      tags:
      - Analytics
      summary: Create a Mapper
      operationId: CreateMapper
      responses:
        '201':
          $ref: '#/components/responses/MapperResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapperInfo'
  /public/analytics/mappers/{id}:
    get:
      description: Returns the Mapper corresponding to the specified Mapper Id.
      tags:
      - Analytics
      summary: List details about a single Mapper
      operationId: GetMapperById
      parameters:
      - x-go-name: Id
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/GetMapperByIdResponse'
        default:
          $ref: '#/components/responses/Error'
    put:
      description: Returns the updated Mapper.
      tags:
      - Analytics
      summary: Update a Mapper
      operationId: UpdateMapper
      parameters:
      - x-go-name: Id
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/MapperResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapperInfo'
    delete:
      description: Returns delete status upon completion.
      tags:
      - Analytics
      summary: Delete a Mapper
      operationId: DeleteMapper
      parameters:
      - x-go-name: Id
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/Error'
  /public/analytics/mrAppRun/{id}:
    delete:
      description: Returns delete status upon completion.
      tags:
      - Analytics
      summary: Delete a Map-Reduce Application Instance Run
      operationId: DeleteMapReduceInstanceRun
      parameters:
      - x-go-name: Id
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/Error'
  /public/analytics/mrAppRuns:
    get:
      description: 'If no parameters are specified, all map reduce application instance runs

        currently on the Cohesity Cluster are returned.

        Specifying parameters filters the results that are returned.'
      tags:
      - Analytics
      summary: List map reduce application runs filtered by the specified parameters
      operationId: GetMapReduceAppRuns
      responses:
        '200':
          $ref: '#/components/responses/GetMapReduceAppRunsResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetMapReduceAppRunsParams'
  /public/analytics/mrBaseJar:
    get:
      description: Returns a struct containing the map reduce base jar from the cluster.
      tags:
      - Analytics
      summary: Downloads the map reduce base jar
      operationId: DownloadMRBaseJar
      responses:
        '200':
          $ref: '#/components/responses/DownloadResponse'
        default:
          $ref: '#/components/responses/Error'
  /public/analytics/mrFileFormats:
    get:
      description: 'The Analytics workbench generates output files from map reduce instances run for

        a particular application. This API returns the output file formats available to

        the user for download.'
      tags:
      - Analytics
      summary: Used to retrieve supported output file formats from a map reduce instance
      operationId: GetMapReduceFileFormats
      parameters:
      - x-go-name: ResultFilePath
        description: 'Specifies the path where the map reduce instance has the result.

          file generated.'
        name: resultFilePath
        in: query
        required: true
        schema:
          type: string
      - x-go-name: StorageDomainId
        description: Specifies the ID of the storage domain.
        name: storageDomainId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - x-go-name: ViewName
        description: 'Specifies the name of the view inside view box where map reduce instance.

          is run.'
        name: viewName
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/GetMapReduceFileFormatsResponse'
        default:
          $ref: '#/components/responses/Error'
  /public/analytics/mrOutputfiles:
    get:
      description: Returns a struct containing the map reduce instance run output files from Yoda.
      tags:
      - Analytics
      summary: Download map reduce base instance run output files from Yoda
      operationId: DownloadMROutputFiles
      parameters:
      - x-go-name: IsNfsFile
        description: If true, then extracts file from NFS, else from local file system.
        name: isNfsFile
        in: query
        schema:
          type: boolean
      - x-go-name: PartitionId
        description: Cluster partition id for the file to be read.
        name: partitionId
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: ViewBoxId
        description: View box id for the file to be read. Required for nfs files only.
        name: viewBoxId
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: ViewName
        description: View name for the file to be read. Required for nfs files only.
        name: viewName
        in: query
        schema:
          type: string
      - x-go-name: FilePath
        description: filepath of the file on NFS.
        name: filePath
        in: query
        schema:
          type: string
      - x-go-name: StartOffset
        description: start offset from where bytes will be read.
        name: startOffset
        in: query
        schema:
          type: integer
          format: int64
      - x-go-name: LengthBytes
        description: Number of bytes to be read from start_offset.
        name: lengthBytes
        in: query
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/DownloadResponse'
        default:
          $ref: '#/components/responses/Error'
  /public/analytics/reducers:
    get:
      description: 'If no parameters are specified, all Reducers currently on

        the Cohesity Cluster are returned.

        Specifying parameters filters the results that are returned.'
      tags:
      - Analytics
      summary: List Reducers filtered by the specified parameters
      operationId: GetReducers
      responses:
        '200':
          $ref: '#/components/responses/GetReducersResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      description: Returns the created reducer.
      tags:
      - Analytics
      summary: Create a Reducer
      operationId: CreateReducer
      responses:
        '201':
          $ref: '#/components/responses/ReducerResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReducerInfo'
  /public/analytics/reducers/{id}:
    get:
      description: Returns the Reducer corresponding to the specified Reducer Id.
      tags:
      - Analytics
      summary: List details about a single Reducer
      operationId: GetReducerById
      parameters:
      - x-go-name: Id
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/GetReducerByIdResponse'
        default:
          $ref: '#/components/responses/Error'
    put:
      description: Returns the updated reducer.
      tags:
      - Analytics
      summary: Update a Reducer
      operationId: UpdateReducer
      parameters:
      - x-go-name: Id
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/ReducerResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReducerInfo'
    delete:
      description: Returns delete status upon completion.
      tags:
      - Analytics
      summary: Delete a Reducer
      operationId: DeleteReducer
      parameters:
      - x-go-name: Id
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/Error'
  /public/analytics/runAppInstance:
    put:
      description: Returns the updated Application.
      tags:
      - Analytics
      summary: Run a map-reduce application instance
      operationId: RunMapReduceAppInstance
      responses:
        '200':
          $ref: '#/components/responses/RunMapReduceAppInstanceResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunMapReduceParams'
  /public/analytics/supportedPatterns:
    get:
      description: 'The Analytics workbench has ability to search for patterns which can be system

        defined or can be user defined. This API returns the patterns available for

        search.'
      tags:
      - Analytics
      summary: Used to retrieve supported patterns available for search in an application
      operationId: GetSupportedPatterns
      parameters:
      - x-go-name: ApplicationId
        description: Specifies the application Id.
        name: applicationId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - x-go-name: ApplicationDataType
        description: Specifies the data type for which supported patterns can be fetched.
        name: applicationDataType
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          $ref: '#/components/responses/GetSupportedPatternsResponse'
        default:
          $ref: '#/components/responses/Error'
    put:
      description: 'The Analytics workbench has ability to search for patterns which can be system

        defined or can be user defined. This API enables the user to save patterns for

        searching.'
      tags:
      - Analytics
      summary: Used to save user patterns for search in an application
      operationId: SavePattern
      responses:
        '201':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatternRequestBody'
  /public/analytics/uploadJar:
    post:
      description: 'Returns a struct containing the jar name and local mount path where the jar

        will be uploaded.'
      tags:
      - Analytics
      summary: Upload a jar to pre-specified Yoda internal view
      operationId: UploadJar
      responses:
        '200':
          $ref: '#/components/responses/UploadJarResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      description: Returns delete status upon completion.
      tags:
      - Analytics
      summary: Delete the uploaded jar from temporary location
      operationId: DeleteUploadedJar
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadMRJarViewPathWrapper'
  /public/analytics/uploadJarPath:
    get:
      description: Returns the mounted path to upload Jars.
      tags:
      - Analytics
      summary: Get details about the mounted path to upload Jars
      operationId: GetMRUploadJarPath
      responses:
        '200':
          $ref: '#/components/responses/GetMRUploadJarPathResponse'
        default:
          $ref: '#/components/responses/Error'
components:
  schemas:
    RequestError:
      description: Details about the Error.
      type: object
      title: Error
      properties:
        errorCode:
          description: Operation response error code.
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: ErrorCode
        message:
          description: Description of the error.
          type:
          - string
          - 'null'
          x-go-name: Message
      x-go-package: cohesity/iris/server/data/public
    MapReduceInfo_RequiredProperty:
      description: 'A required property represents a property that user must set before

        invoking a mapreduction instance. e.g., SimpleGrepMapper will require a

        property named searchPattern to be set.'
      type: object
      properties:
        defaultValue:
          description: Default Value of the property.
          type:
          - string
          - 'null'
          x-go-name: DefaultValue
        description:
          description: Description of this property
          type:
          - string
          - 'null'
          x-go-name: Description
        isRequired:
          description: Whether the property is required or optional.
          type:
          - boolean
          - 'null'
          x-go-name: IsRequired
        name:
          description: Name of the property.
          type:
          - string
          - 'null'
          x-go-name: Name
      x-go-package: yoda/base/analytics.pb
    InputSpec_InputFilesSelector:
      description: 'If mapper is going to run over files on SnapFS, this selects the input

        files.'
      type: object
      properties:
        fileTimeFilter:
          description: File time filter for file's last change time.
          $ref: '#/components/schemas/InputSpec_FileTimeFilter'
        filenameGlob:
          description: Glob patterns to match on file. e.g. {*.txt, *.cc}
          type:
          - array
          - 'null'
          items:
            type: string
          x-go-name: FilenameGlob
        jobIds:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int64
          x-go-name: JobIds
        maxSnapshotTimestamp:
          description: 'Exclusive end of snapshot_timestamp range. If missing, inf will be used

            as the timestamp range.'
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: MaxSnapshotTimestamp
        minSnapshotTimestamp:
          description: Inclusive. If missing, 0 will the default lower end of timestamp range
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: MinSnapshotTimestamp
        partitionIds:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int64
          x-go-name: PartitionIds
        processLatestOnly:
          description: 'Boolean flag to indicate if only latest snapshot of each object should

            be processed.'
          type:
          - boolean
          - 'null'
          x-go-name: ProcessLatestOnly
        rootDir:
          description: 'Within each volume, traversal will be rooted at this directory. A

            typical value here might be /home'
          type:
          - string
          - 'null'
          x-go-name: RootDir
        viewBoxIds:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int64
          x-go-name: ViewBoxIds
        viewName:
          description: 'This is the view name user enters manually. If this is set we will

            process this view only. partition_id and view_box_id will be populated

            only if view_name is present.'
          type:
          - string
          - 'null'
          x-go-name: ViewName
      x-go-package: yoda/base/analytics.pb
    RunMapReduceParams:
      description: RunMapReduceParams specifies the input params to run a map reduce instance.
      type: object
      title: Get Run Map Reduce App Parameters.
      properties:
        appId:
          description: ApplicationId is the Id of the map reduce application to run.
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: ApplicationId
        inputParams:
          description: 'InputParams specifies optional list of key=value input params specified

            for running the map reduce instance.'
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/MapReduceInstance_InputParam'
          x-go-name: InputParams
        mrInput:
          description: 'InputSpecification specifies the input information to run the specific map

            reduce instance.'
          $ref: '#/components/schemas/InputSpec'
        mrOutput:
          description: 'OutputSpecification specifies the output information to run the specific

            map reduce instance.'
          $ref: '#/components/schemas/OutputSpec'
      x-go-package: cohesity/iris/server/data/public
    MapReduceFileFormats:
      description: Specifies information about file formats produced by a mapo reduce instance.
      type: object
      title: Map Reduce File Formats.
      properties:
        supportedFormats:
          description: 'Specifies the list of formats supported with integer enum mapping to file

            format.'
          type:
          - array
          - 'null'
          items:
            type: string
          x-go-name: SupportedFormats
      x-go-package: cohesity/iris/server/data/public
    UploadMRJarViewPathWrapper:
      description: 'UploadMRJarViewPathWrapper contains jar name and local mount path where the

        Jars will be uploaded.'
      type: object
      title: Upload JAR Request.
      properties:
        jarName:
          description: JarName is the name of the uploaded jar.
          type:
          - string
          - 'null'
          x-go-name: JarName
        jarPath:
          description: JarPath is the path for the directory where uploaded jar is stored.
          type:
          - string
          - 'null'
          x-go-name: JarPath
      x-go-package: cohesity/iris/server/data/public
    MapperInfo:
      type: object
      title: Information about a mapper.
      properties:
        code:
          description: The code of the mapper in the specified language. Should be UTF-8.
          type:
          - string
          - 'null'
          x-go-name: Code
        id:
          description: 'Mapper ID generated by system. Absent when user is creating a new mapper.

            Mandatory in all other use cases.'
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: Id
        isSystemDefined:
          description: Whether the mapper is system defined.
          type:
          - boolean
          - 'null'
          x-go-name: IsSystemDefined
        jarName:
          description: 'User can write their own mapper/reducer or upload jar files containing

            mappers and reducers. If this mapper was part of a jar file, then this

            field will have the JAR name.'
          type:
          - string
          - 'null'
          x-go-name: JarName
        jarPath:
          description: 'path of JAR in which this mapper was found. This is applicable only when

            this mapper was uploaded via JAR.'
          type:
          - string
          - 'null'
          x-go-name: JarPath
        language:
          description: Language of the mapper.
          type:
          - integer
          - 'null'
          format: int32
          x-go-name: Language
        name:
          description: Name of the mapper.
          type:
          - string
          - 'null'
          x-go-name: Name
      x-go-package: yoda/base/analytics.pb
    AnalyseJarResult:
      type: object
      properties:
        error:
          description: Status code of http rpc.
          $ref: '#/components/schemas/ErrorProto'
        mappers:
          description: Name of all mapper classes found in jar file.
          type:
          - array
          - 'null'
          items:
            type: string
          x-go-name: Mappers
        reducers:
          description: Name of all reducers classes found in jar file.
          type:
          - array
          - 'null'
          items:
            type: string
          x-go-name: Reducers
      x-go-package: yoda/base/analytics.pb
    MapReduceInfo:
      description: 'This will be used to encapsulate information about mapper and reducer only.

        On UI this will be used to show the list of available apps to the user.'
      type: object
      title: Map Reduce Information.
      properties:
        appProperty:
          $ref: '#/components/schemas/MapReduceInfo_AppProperty'
        auxData:
          description: Auxiliary data for map reduce.
          $ref: '#/components/schemas/MapReduceAuxData'
        description:
          description: Map reduce job description.
          type:
          - string
          - 'null'
          x-go-name: Description
        excludedDataSourceVec:
          description: List of all excluded data sources for this app.
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
          x-go-name: ExcludedDataSourceVec
        id:
          description: ID of map reduce job.
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: Id
        isSystemDefined:
          description: 'Flag to denote if this is system pre-defined app or user has written this

            app.'
          type:
          - boolean
          - 'null'
          x-go-name: IsSystemDefined
        mapperId:
          description: ID of the mapper to process the input.
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: MapperId
        name:
          description: Map reduce job name.
          type:
          - string
          - 'null'
          x-go-name: Name
        reducerId:
          description: ID of the reducer.
          type:
          - integer
          - 'null'
          format: int64
          x-go-name: ReducerId
        requiredPropertyVec:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/MapReduceInfo_RequiredProperty'
          x-go-name: RequiredPropertyVec
      x-go-package: yoda/base/analytics.pb
    InputSpec_FileTimeFilter:
      description: 'File time filter to filter files based on their last change time. All

        files whose change time is in the range [change_time_range_start_secs,

