    - {method: PUT, path: /public/clusters/gflag}
    - {method: POST, path: /public/export/config}
    - {method: PUT, path: /public/import/config}
    - {method: GET, path: /public/network/interfaces}
  documentation_lifecycle:
    - >-
      developer.cohesity.com/apidocs/* now carries a banner reading "This API
      documentation is unmaintained, please look at specific cluster's RestAPI
      docs page." - the whole legacy portal is self-declared unmaintained.
    - >-
      developers.cohesity.com is the current developer portal; developer.cohesity.com
      is the retained legacy one that still serves the only downloadable specs.
