description: >-
  Cohesity publishes named product editions but NO prices and NO API-level plan.
  This file replaces a 2026-05-04 bulk-sweep scaffold that invented Free /
  Professional / Enterprise tiers with fabricated request quotas and per-minute
  rate limits; none of those tiers, quotas or limits exist. Cohesity is an
  enterprise contract-negotiated vendor - subscription licences are sold in 1, 3
  or 5-year terms through sales, API access is a capability of the product a
  customer already licenses, and there is no metered API plan, no self-serve
  signup and no published price of any kind.
note: >-
  The Kin Score should read this as an honest zero on published pricing, not as
  three tiers with numbers behind them.
