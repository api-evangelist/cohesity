    name: Cohesity-Cloud-Services collection
  description: Helios is Cohesity's SaaS-based control plane that manages a fleet of Cohesity clusters
    from a single global pane of glass. The Helios REST API authenticates via an apiKey generated from
    the Helios UI and passed in the request header, supports both v1 and v2 endpoint families, and lets
    customers list and operate registered clusters, run protection jobs, manage policies, and access reporting
    and analytics globally.
  x-features:
  - apiKey-based authentication via Helios UI
  - v1 and v2 API surfaces under /irisservices/api/
  - Manage protection groups, policies, and recovery operations
  - Reporting and global analytics across clusters
  - Multi-cluster operations from a single endpoint
  x-use-cases:
  - Centralize backup and recovery automation across many Cohesity clusters
  - Drive policy and SLA enforcement from CI/CD pipelines
  - Trigger or schedule recoveries from external orchestration tools
  - Export reporting data into SIEM or BI dashboards
- aid: cohesity:dataprotect-rest-api
  name: Cohesity DataProtect REST API
  tags:
  - Backup
  - DataProtect
  - Disaster Recovery
  - Per-Cluster
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.cohesity.com/apidocs/versions/
  properties:
  - url: https://developer.cohesity.com/apidocs/versions/
    type: Documentation
  - url: https://developers.cohesity.com/page/api-reference
    type: APIReference
  - url: https://developers.cohesity.com/docs/getting-started
    type: GettingStarted
  - url: openapi/cohesity-cluster-v1-openapi.yml
    type: OpenAPI
    name: Cohesity REST API v1 (Swagger 2.0)
  - url: openapi/_original/cohesity-cluster-v1-openapi-original.yml
    type: OpenAPI
    name: Cohesity REST API v1 — as published
  - url: overlays/cohesity-cluster-v1-overlay.yaml
    type: Overlay
  description: The DataProtect REST API is the per-cluster RESTful interface exposed by every Cohesity
    cluster, providing programmatic control over data management operations including backups, restores,
    replication, archival, cloud tiering, and storage domain management. Authentication is performed via
    API keys for automation users or username/password for interactive sessions.
  x-features:
  - Per-cluster REST endpoint
  - API key and session authentication
  - Backup, restore, replication, and archive operations
  - Storage domain and view management
  - Versioned API generations available concurrently
  x-use-cases:
  - Automate cluster registration and configuration
  - Trigger ad-hoc backups and recoveries from runbooks
  - Integrate with vRealize, ServiceNow, Ansible, and Terraform workflows
  - Build custom dashboards over per-cluster operational data
  baseURL: https://{cluster-vip}/irisservices/api/v1/public
  x-baseurl-note: Templated per cluster. The published v1 specification declares host "<CLUSTER_VIP>"
    with basePath /irisservices/api/v1 — the DataProtect API is served by every Cohesity cluster at its
    own VIP, so no single production host exists. The same surface is reachable centrally through Helios
    at https://helios.cohesity.com/irisservices/api/v1/public.
- aid: cohesity:helios-reporting-api
  name: Cohesity Helios Reporting API
  tags:
  - Reporting
  - Analytics
  - Helios
  - Automation
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://helios.cohesity.com/heliosreporting/api/v1
  humanURL: https://developer.cohesity.com/apidocs/helios-reporting
  properties:
  - url: https://developer.cohesity.com/apidocs/helios-reporting
    type: Documentation
  - url: openapi/cohesity-helios-reporting-openapi.yml
    type: OpenAPI
    name: Helios Reporting service APIs (Swagger 2.0)
  - url: openapi/_original/cohesity-helios-reporting-openapi-original.yml
    type: OpenAPI
    name: Helios Reporting — as published
  - url: overlays/cohesity-helios-reporting-overlay.yaml
    type: Overlay
  description: The Helios Reporting service exposes Cohesity's cross-cluster reporting layer as a standalone
    REST API with 20 operations. It publishes a catalog of report types and their components, renders
    on-demand previews without persisting anything, and manages recurring schedules whose exports are
    collected as downloadable task artifacts. Authentication is the same apiKey header used across the
    Cohesity surface.
  x-features:
  - Report catalog and report-type definitions
  - On-demand report and component previews
  - Recurring schedules with on-demand runs
  - Asynchronous export with task artifacts
  - apiKey header authentication
  x-use-cases:
  - Feed backup and compliance reporting into BI or SIEM tooling
  - Answer a one-off posture question with a preview call that creates nothing
  - Automate recurring executive and audit reporting
- aid: cohesity:site-continuity-api
  name: Cohesity Site Continuity API
  tags:
  - Disaster Recovery
  - Site Continuity
  - Orchestration
  - Helios
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://helios.cohesity.com/v2/mcm/site-continuity/v2
  humanURL: https://developer.cohesity.com/apidocs/site-continuity
  properties:
  - url: https://developer.cohesity.com/apidocs/site-continuity
    type: Documentation
  - url: openapi/cohesity-site-continuity-openapi.yml
    type: OpenAPI
    name: Site Continuity v2 Service APIs (Swagger 2.0)
  - url: openapi/_original/cohesity-site-continuity-openapi-original.yml
    type: OpenAPI
    name: Site Continuity v2 — as published
  - url: overlays/cohesity-site-continuity-overlay.yaml
    type: Overlay
  description: Site Continuity is Cohesity's disaster-recovery orchestration service, exposed as a 25-operation
    REST API on the Helios control plane. It models sites, applications and DR plans, runs health checks
    that validate a plan without executing it, and performs and tracks failover and failback actions.
    It is the one Cohesity surface that publishes an enumerated error-code vocabulary (kNoError, kValidationError,
    kInternalError).
  x-features:
  - Sites, applications and versioned app snapshots
  - DR plan lifecycle and plan actions
  - Non-destructive DR plan health checks
  - Enumerated SCErrorCode error vocabulary
  - apiKey header authentication
  x-use-cases:
  - Orchestrate and rehearse failover from external runbooks
  - Validate DR readiness on a schedule without triggering a failover
  - Report DR plan state into a resilience dashboard
