description: Cohesity is a data security and management company providing backup, disaster recovery, archive,
  and cyber resilience capabilities across on-premises, cloud, and SaaS workloads. Following the merger
  with Veritas, the combined company protects enterprise data while powering automation, orchestration,
  and AI- driven recovery. The Cohesity developer surface centers on the Cohesity REST API, exposed both
  per-cluster (DataProtect/cluster API) and via the Helios global control plane, with versioned v1 and
  v2 endpoints, API-key authentication, and SDKs for Python, PowerShell, Ansible, Terraform, and ServiceNow.
